[project]
name = "codegen-orchestrator"
version = "0.1.0"
description = "Multi-agent orchestrator for automated project generation and deployment"
requires-python = ">=3.12"
# No runtime dependencies - each service has its own

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "jsonschema>=4.26.0",
    # Pinned below 0.16 deliberately. 0.16 formats Python inside Markdown, and it also
    # stops treating services/worker-manager as its own config root, which surfaces 132
    # real violations there (blind except, typing.Dict, unsorted imports, naive datetimes).
    # Adopting it means fixing those first.
    "ruff>=0.15.5,<0.17",
    "mypy>=1.13.0",
    "httpx",
    "respx>=0.21.1",
    "fakeredis>=2.34.1",
    "makefun",
    "copier>=9.17.1",
    # Workspace members (all services + packages)
    "api",
    "langgraph-orchestrator",
    "telegram-bot",
    "scheduler",
    "worker-manager",
    "infra-service",
    "scaffolder",
    "worker-wrapper",
]

[tool.uv.workspace]
members = [
    "services/api",
    "services/langgraph",
    "services/telegram_bot",
    "services/scheduler",
    "services/worker-manager",
    "services/infra-service",
    "services/scaffolder",
    "packages/worker-wrapper",
]

[tool.uv.sources]
# Only workspace members here. `shared` is not a package and has no entry: it
# reaches consumers as a bind-mount (compose) or a `COPY shared` (images), and
# tests import it from the repo tree via PYTHONPATH. See
# docs/decisions/shared-is-not-a-package.md. Every name below has to be depended
# on by something, enforced by tests/unit/test_uv_sources_are_used.py.
api = { workspace = true }
langgraph-orchestrator = { workspace = true }
telegram-bot = { workspace = true }
scheduler = { workspace = true }
worker-manager = { workspace = true }
infra-service = { workspace = true }
scaffolder = { workspace = true }
worker-wrapper = { workspace = true }

# No build-system — this is a virtual workspace root (not a distributable package)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `shared` lives in the tree and is not installed, so the repo root has to be
# importable for every pytest run rooted here.
pythonpath = ["."]
markers = [
    "e2e: marks tests as end-to-end tests",
    "e2e_real: marks tests as real e2e tests (deselect with '-m \"not e2e_real\"')",
    "integration: marks tests as integration tests",
    "requires_github: marks tests requiring real GitHub credentials",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Ruff is configured in the root ruff.toml. A [tool.ruff] section here would be
# ignored whenever that file exists, so it lives in one place only.

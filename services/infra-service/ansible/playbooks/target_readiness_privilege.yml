---
# Managed-target readiness, phase `privilege_preflight`: does the documented safe
# privilege path reach root without a prompt. Run by itself, with its own
# timeout, only after `target_readiness_login.yml` succeeded — so any failure of
# this run, a timeout included, is the privilege phase.
#
# The documented safe privilege path is the one every managed row uses:
# `servers.ssh_user` is the administrative account the fleet key opens (`root`
# on rows the platform registers), and Ansible escalates with `become` through
# non-interactive sudo. A password prompt, a sudo that needs a terminal, or an
# account that cannot become root fails here. Nothing is written to the target.

- name: Prove the privilege path reaches root without a prompt
  hosts: "{{ target_host | default('all') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Become root through non-interactive sudo
      ansible.builtin.command: id -u
      changed_when: false
      register: target_readiness_privilege

    - name: Refuse a privilege path that does not end at root
      ansible.builtin.assert:
        that:
          - target_readiness_privilege.stdout | trim == '0'
        fail_msg: >-
          become did not reach uid 0 on this target, so the QA role cannot be
          applied safely; nothing was changed.
        quiet: true

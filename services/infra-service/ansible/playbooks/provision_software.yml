---
# Provision Software Playbook
# Stage 2: System Updates and Software Installation (Slow)
# Usage: ansible-playbook -i inventory/prod.ini playbooks/provision_software.yml -e "target_host=vps-267179"

- name: Provision Software (Updates & Docker)
  hosts: "{{ target_host | default('all') }}"
  become: true
  vars_files:
    - ../group_vars/provision_vars.yml
  vars:
    # Only the typed ProvisionerMessage profile can override this. Server
    # labels deliberately do not select the fast path.
    provisioning_profile: production
  
  pre_tasks:
    - name: Wait for server to be reachable
      wait_for_connection:
        timeout: 60
    
    - name: Gather facts
      setup:

  tasks:
    # ========================================
    # 1. System Updates
    # ========================================
    - name: Record apt lock wait started
      ansible.builtin.set_fact:
        provisioning_apt_lock_wait_started: "{{ lookup('pipe', 'date +%s') | int }}"

    - name: Wait for any possibly running apt/dpkg processes
      shell: "while fuser /var/lib/dpkg/lock >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done;"
      changed_when: false

    - name: Record apt lock wait finished
      ansible.builtin.set_fact:
        provisioning_apt_lock_wait_seconds: >-
          {{ (lookup('pipe', 'date +%s') | int) - (provisioning_apt_lock_wait_started | int) }}

    - name: Record package and system installation started
      ansible.builtin.set_fact:
        provisioning_package_system_started: "{{ lookup('pipe', 'date +%s') | int }}"

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: [system]

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      tags: [system]
      when: provisioning_profile != 'stand_e2e'

    # ========================================
    # 2. Essential Tools Installation
    # ========================================
    - name: Install essential packages
      apt:
        name: "{{ essential_packages }}"
        state: present
      tags: [packages]

    - name: Record package and system installation finished
      ansible.builtin.set_fact:
        provisioning_package_system_seconds: >-
          {{ (lookup('pipe', 'date +%s') | int) - (provisioning_package_system_started | int) }}

    - name: Record Docker and tooling installation started
      ansible.builtin.set_fact:
        provisioning_docker_tooling_started: "{{ lookup('pipe', 'date +%s') | int }}"

    - name: Download pinned uv for stand runner
      ansible.builtin.get_url:
        url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/uv-{{ uv_version }}.tar.gz"
        mode: '0644'
      tags: [packages]

    - name: Extract pinned uv for stand runner
      ansible.builtin.unarchive:
        src: "/tmp/uv-{{ uv_version }}.tar.gz"
        dest: /tmp
        remote_src: true
      tags: [packages]

    - name: Install pinned uv for stand runner
      ansible.builtin.copy:
        src: "/tmp/uv-x86_64-unknown-linux-gnu/uv"
        dest: /usr/local/bin/uv
        remote_src: true
        mode: '0755'
      tags: [packages]

    # ========================================
    # 3. Docker Installation
    # ========================================
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      tags: [docker]

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
      tags: [docker]

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      tags: [docker]

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
      tags: [docker]

    - name: Record Docker and tooling installation finished
      ansible.builtin.set_fact:
        provisioning_docker_tooling_seconds: >-
          {{ (lookup('pipe', 'date +%s') | int) - (provisioning_docker_tooling_started | int) }}

    - name: Record roles and monitoring started
      ansible.builtin.set_fact:
        provisioning_roles_monitoring_started: "{{ lookup('pipe', 'date +%s') | int }}"

    - name: Prepare deploy target
      ansible.builtin.include_role:
        name: deploy_target
      tags: [deploy_target]

    # The QA run identity belongs to this phase and not to a later one: the
    # provisioner writes `provisioning_phase=complete` only when this playbook
    # succeeds, so a host that is recorded complete is a host on which this role
    # ran. "Provisioned but with no account for QA to borrow" is not a state
    # this path can produce.
    - name: Create the QA run identity
      ansible.builtin.include_role:
        name: qa_identity
      tags: [qa_identity]

    # ========================================
    # 4. Monitoring (node_exporter + cadvisor)
    # ========================================
    - name: Include monitoring role
      ansible.builtin.include_role:
        name: monitoring
        apply:
          tags: [monitoring]
      tags: [monitoring]

    # ========================================
    # 5. Firewall (UFW) Application Rules
    # ========================================
    # Note: UFW and SSH are already enabled in Stage 1
    
    - name: Allow HTTP through firewall
      ufw:
        rule: allow
        port: '80'
        proto: tcp
      tags: [firewall]

    - name: Allow HTTPS through firewall
      ufw:
        rule: allow
        port: '443'
        proto: tcp
      tags: [firewall]

    # ========================================
    # 5. System Configuration
    # ========================================
    - name: Set timezone
      timezone:
        name: "{{ timezone }}"
      tags: [system]

    - name: Set hostname
      hostname:
        name: "{{ server_hostname | default(inventory_hostname) }}"
      tags: [system]

    - name: Record roles and monitoring finished
      ansible.builtin.set_fact:
        provisioning_roles_monitoring_seconds: >-
          {{ (lookup('pipe', 'date +%s') | int) - (provisioning_roles_monitoring_started | int) }}

    - name: Report provisioning phase timings
      ansible.builtin.debug:
        msg:
          provisioning_phase_timing_seconds:
            apt_lock_wait: "{{ provisioning_apt_lock_wait_seconds | int }}"
            package_system: "{{ provisioning_package_system_seconds | int }}"
            docker_tooling: "{{ provisioning_docker_tooling_seconds | int }}"
            roles_monitoring: "{{ provisioning_roles_monitoring_seconds | int }}"

    # ========================================
    # 6. Verification
    # ========================================
    - name: Verify Docker is running
      command: docker --version
      register: docker_version
      changed_when: false
      tags: [verify]

    - name: Verify UFW is active
      command: ufw status
      register: ufw_status
      changed_when: false
      tags: [verify]

    - name: Display verification results
      debug:
        msg:
          - "Docker version: {{ docker_version.stdout }}"
          - "UFW status: {{ ufw_status.stdout_lines[0] }}"
      tags: [verify]

  post_tasks:
    - name: Software provisioning complete
      debug:
        msg: "Server {{ inventory_hostname }} software installation complete!"

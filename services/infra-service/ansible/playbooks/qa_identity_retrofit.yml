---
# Bring an already-provisioned host to the state a fresh one comes out in:
# the QA run identity exists, and nothing is left of the QA agent that used to
# live on the target.
#
# Usage (normally through `python -m src.provisioner.qa_identity_retrofit HANDLE`,
# which also records the identity on the server row):
#   ansible-playbook -i inventory/prod.ini playbooks/qa_identity_retrofit.yml \
#     -e "target_host=1.2.3.4 deploy_user=root"
#
# Two properties this playbook owes its caller:
#
# * it is repeatable. Every task is a state, not a step; a second run changes
#   nothing and fails nothing.
# * it removes only what is positively identified as the old QA runner's. The
#   account this cleans up in is the administrative one, which is also where a
#   human keeps their own things, so "probably ours" is not a reason to delete
#   anything. A path that cannot be told from ordinary interactive data is left
#   alone and named in this host's report instead — an administrator can then
#   look at a named path on a named machine, which no amount of guessing here
#   would be better than.

- name: Retrofit the QA run identity
  hosts: "{{ target_host | default('all') }}"
  become: true
  vars_files:
    - ../group_vars/provision_vars.yml

  pre_tasks:
    - name: Wait for server to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Gather facts
      ansible.builtin.setup:

  tasks:
    - name: Create the QA run identity
      ansible.builtin.include_role:
        name: qa_identity

    # The old QA agent ran as the deploy user — which on a host provisioned
    # before this is `root` — so its leftovers are in that account's home.
    - name: Resolve the home of the account the old QA agent lived in
      ansible.builtin.getent:
        database: passwd
        key: "{{ deploy_user }}"

    - name: Name that home
      ansible.builtin.set_fact:
        qa_residue_home: "{{ ansible_facts.getent_passwd[deploy_user][4] }}"

    # Each path here is one the removed target-local QA provisioning role itself
    # created, at a name nothing else on a deploy target uses. (Deliberately not
    # naming that role here: a playbook mentioning it is what a repo test reads
    # as this playbook still using it.) Nothing is removed by resemblance.
    - name: Remove what the target-local QA agent left behind
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        # The Claude Code CLI provisioning installed for that account.
        - "{{ qa_residue_home }}/.local/bin/claude"
        # The LLM credentials copied onto the target. This one file, not the
        # directory around it: `~/.claude` is also where an administrator's own
        # interactive Claude Code keeps its configuration, and no deploy target
        # needs to hold LLM credentials either way.
        - "{{ qa_residue_home }}/.claude/.credentials.json"
        # The Telegram account QA used to talk to bots as.
        - "{{ qa_residue_home }}/.qa-telethon.env"
        # The venv (telethon, httpx) and the old write guard. Created by the
        # role, at a path only the role used.
        - /opt/qa-runner
      register: qa_residue_removed

    # Left alone, deliberately, and each for the same reason: on this host they
    # are indistinguishable from something a person put there. Each one is named
    # in this host's report with why it stayed and the command that removes it,
    # so the decision is handed to the administrator who can tell — which is more
    # than a guess here could be worth, and less than an outage.
    - name: Look at what is deliberately left in place
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        # The Claude Code CLI's own directories. The old role wrote into them,
        # and so does anybody who runs Claude Code on this machine; only the
        # credentials file removed above was certainly the platform's.
        - path: "{{ qa_residue_home }}/.claude"
          why: >-
            also where this account's own interactive Claude Code keeps its
            settings and history; only .credentials.json inside it was certainly
            the platform's, and that one file has been removed
          remove_by_hand: "rm -rf {{ qa_residue_home }}/.claude"
        - path: "{{ qa_residue_home }}/.local/share/claude"
          why: >-
            the Claude Code CLI's own data directory, written by anybody who runs
            that CLI on this host and not only by the removed QA runner
          remove_by_hand: "rm -rf {{ qa_residue_home }}/.local/share/claude"
        # The sharpest case. The old role created 2GB of swap there because the
        # CLI installer needed it — and `/swapfile` is also what every guide
        # tells an administrator to call swap, with nothing in the file to tell
        # the two apart. Taking swap off a live host running user applications
        # is an outage, not cleanup, so the fact is reported and the decision is
        # left to somebody who knows which of the two this is.
        - path: /swapfile
          why: >-
            2GB of swap at the name every guide uses, so the QA runner's swap
            and an administrator's own are the same file to this playbook;
            removing swap from a host running user applications is an outage
          remove_by_hand: "swapoff /swapfile && rm -f /swapfile && sed -i '\\|^/swapfile|d' /etc/fstab"
      loop_control:
        label: "{{ item.path }}"
      register: qa_residue_left

    # What this host changed and what it did not, in one place, so a fleet-wide
    # retrofit can be read per host instead of by scrolling task output.
    - name: Report what this host changed and what it left
      ansible.builtin.debug:
        msg:
          qa_ssh_user: "{{ qa_ssh_user }}"
          # What the target itself said about the account, not what the role
          # meant to do to it. A host that got this far has an account that was
          # proved unable to become root; one that did not never reaches here.
          #
          # The key is the same one `provision_software.yml` reports under,
          # because the provisioner cuts this line out of the play output by
          # that name: a retrofit that proved a seat under a different key was
          # reported as a play that proved none.
          qa_identity_proof: "{{ qa_identity_proof.stdout | trim }}"
          removed_paths: >-
            {{ qa_residue_removed.results
               | selectattr('changed')
               | map(attribute='item')
               | list }}
          left_in_place: >-
            {{ qa_residue_left.results
               | selectattr('stat.exists')
               | map(attribute='item')
               | list }}

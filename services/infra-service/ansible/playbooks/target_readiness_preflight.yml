---
# Managed-target readiness preflight: can the stored administrative key log in,
# and does the documented privilege path reach root without a prompt. Asked
# before anything on the target changes, so a target that fails either is
# recorded with that exact phase instead of receiving half of the QA role.
#
# The documented safe privilege path is the one every managed row uses:
# `servers.ssh_user` is the administrative account the fleet key opens (`root`
# on rows the platform registers), and Ansible escalates with `become` through
# non-interactive sudo. A password prompt, a sudo that needs a terminal, or an
# account that cannot become root fails the second play. Nothing here writes to
# the target, reinstalls it or touches its firewall.

- name: Prove the administrative account logs in with the stored key
  hosts: "{{ target_host | default('all') }}"
  gather_facts: false
  become: false
  tasks:
    - name: Log in as the administrative account
      ansible.builtin.raw: id -un
      changed_when: false

- name: Prove the privilege path reaches root without a prompt
  hosts: "{{ target_host | default('all') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Become root through non-interactive sudo
      ansible.builtin.command: id -u
      changed_when: false
      register: target_readiness_privilege

    - name: Refuse a privilege path that does not end at root
      ansible.builtin.assert:
        that:
          - target_readiness_privilege.stdout | trim == '0'
        fail_msg: >-
          become did not reach uid 0 on this target, so the QA role cannot be
          applied safely; nothing was changed.
        quiet: true

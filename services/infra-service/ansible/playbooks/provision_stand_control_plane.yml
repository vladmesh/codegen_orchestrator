---
# Minimal, stand-only bootstrap for the disposable orchestrator/control plane.
#
# The stand creates a separate machine for the application target. That target
# is registered and provisioned through the product's provision_software.yml
# path after this control plane is running, so this playbook deliberately does
# not install target layout, QA identities, monitoring, firewall, or host
# policy. It must remain builtins-only: the GitHub workflow can avoid a Galaxy
# download before it starts this short-lived host.

- name: Provision stand control plane
  hosts: prod
  become: true
  gather_facts: false
  vars:
    stand_runtime_user: deploy
    stand_uv_version: "0.6.14"
    stand_checkout_root: /opt/codegen_orchestrator
    # Every apt task still waits this long for the dpkg lock. After the
    # first-boot settle below nothing else should take it, so this only bounds
    # a surprise; package/repository errors fail in the task that saw them.
    stand_apt_lock_timeout_seconds: 300
    # One settle attempt: cloud-init plus stopping the image's automatic apt
    # runs plus the lock wait.
    stand_first_boot_settle_timeout_seconds: 300
    # How long a host that dropped SSH or rebooted during the settle has to
    # answer again before the bootstrap fails as unreachable.
    stand_first_boot_reconnect_timeout_seconds: 180
    # Without keepalives a rebooted host leaves the session hanging for many
    # minutes (runs 35594323906, 35597245917); this notices it within ~60 s.
    ansible_ssh_extra_args: -o ServerAliveInterval=15 -o ServerAliveCountMax=4

  pre_tasks:
    - name: Wait for control plane to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 60

    # A fresh cloud image keeps changing itself after SSH is up: cloud-init may
    # still be installing or upgrading packages (and may reboot), and the
    # apt-daily timers start unattended-upgrades, which restarts sshd, dbus or
    # systemd under Docker. The stand VM lives for one run and is destroyed, so
    # its automatic upgrades are masked and stopped rather than waited for:
    # waiting is unbounded, depends on what was published that day, and the
    # timers could fire again mid-run. Only then is the dpkg lock wait
    # meaningful, and an interrupted dpkg run is finished before apt starts.
    - name: Settle first boot before apt or Docker work
      ansible.builtin.shell: &stand_first_boot_settle
        executable: /bin/bash
        cmd: |
          timeout {{ stand_first_boot_settle_timeout_seconds }}s bash -euo pipefail <<'SETTLE'
          log() { printf 'first-boot settle: %s\n' "$*" >&2; }
          units="apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service"
          log "masking and stopping automatic apt runs"
          systemctl mask $units
          systemctl stop $units
          if command -v cloud-init >/dev/null 2>&1; then
            log "waiting for cloud-init to finish"
            cloud_init_rc=0
            cloud-init status --wait >/dev/null || cloud_init_rc=$?
            if [ "$cloud_init_rc" -ne 0 ]; then
              # 2 is a recoverable warning, 1 a failed module; either way
              # cloud-init is finished, which is all this wait is for.
              log "cloud-init finished with status $cloud_init_rc"
              cloud-init status --long >&2 || true
            fi
          fi
          log "waiting for dpkg/apt locks"
          while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do
            sleep 5
          done
          log "finishing any interrupted package configuration"
          DEBIAN_FRONTEND=noninteractive dpkg --configure -a
          log "done"
          SETTLE
      ignore_unreachable: true
      register: stand_first_boot_settle

    - name: Wait for control plane to return after a first-boot drop
      ansible.builtin.wait_for_connection:
        timeout: "{{ stand_first_boot_reconnect_timeout_seconds }}"
      when: stand_first_boot_settle is unreachable

    # The masks survive a reboot, so the repeat is short; a second drop here
    # is a real failure and is not tolerated.
    - name: Settle first boot again after reconnecting
      ansible.builtin.shell: *stand_first_boot_settle
      when: stand_first_boot_settle is unreachable

    # Keep this as the one fact collection for the whole bootstrap. The former
    # bootstrap.yml + provision_software.yml sequence collected it twice.
    - name: Gather control plane facts
      ansible.builtin.setup:

    - name: Update apt cache without changing the base image
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: "{{ stand_apt_lock_timeout_seconds }}"

  tasks:
    - name: Install control-plane host tools
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - make
          - rsync
        state: present
        lock_timeout: "{{ stand_apt_lock_timeout_seconds }}"

    - name: Create runtime user
      ansible.builtin.user:
        name: "{{ stand_runtime_user }}"
        shell: /bin/bash
        create_home: true

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Read Debian architecture for Docker repository
      ansible.builtin.command: dpkg --print-architecture
      register: stand_docker_architecture
      changed_when: false

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ stand_docker_architecture.stdout }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present
        # The following apt task refreshes this cache under its bounded lock
        # timeout; do not create an unprotected apt operation here.
        update_cache: false

    - name: Install Docker Engine and compose tooling
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present
        update_cache: true
        lock_timeout: "{{ stand_apt_lock_timeout_seconds }}"

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Download pinned uv for stand runner
      ansible.builtin.get_url:
        url: "https://github.com/astral-sh/uv/releases/download/{{ stand_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/uv-{{ stand_uv_version }}.tar.gz"
        mode: "0644"

    - name: Extract pinned uv for stand runner
      ansible.builtin.unarchive:
        src: "/tmp/uv-{{ stand_uv_version }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install pinned uv for stand runner
      ansible.builtin.copy:
        src: /tmp/uv-x86_64-unknown-linux-gnu/uv
        dest: /usr/local/bin/uv
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Remove downloaded uv archive
      ansible.builtin.file:
        path: "/tmp/uv-{{ stand_uv_version }}.tar.gz"
        state: absent

    - name: Create stand checkout root
      ansible.builtin.file:
        path: "{{ stand_checkout_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

  post_tasks:
    # These checks are intentionally commands, not a successful task list: a
    # failing daemon, missing compose/buildx plugin, stale uv binary, or absent
    # runtime user must stop before protected configuration is copied.
    - name: Verify Docker daemon is running
      ansible.builtin.command: docker info
      changed_when: false

    - name: Verify Docker compose plugin is available
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Verify Docker buildx plugin is available
      ansible.builtin.command: docker buildx version
      changed_when: false

    - name: Verify pinned uv is available to the remote runner
      ansible.builtin.command: /usr/local/bin/uv --version
      changed_when: false

    - name: Verify runtime user identity
      ansible.builtin.command: "id {{ stand_runtime_user }}"
      changed_when: false

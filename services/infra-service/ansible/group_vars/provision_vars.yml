---
# Provision Variables
# Переменные для кастомизации provisioning

# ========================================
# SSH Configuration
# ========================================
ssh_public_key: "{{ lookup('env', 'ORCHESTRATOR_SSH_PUBLIC_KEY') }}"
deploy_user: deploy
services_root: /opt/services
disable_password_auth: true

# ========================================
# Firewall Configuration
# ========================================
firewall_allowed_ports:
  - 22   # SSH
  - 80   # HTTP
  - 443  # HTTPS

# ========================================
# Docker Configuration
# ========================================
docker_version: "latest"
docker_compose_version: "v2.24.0"
# The stand suite entry point invokes uv itself.  Keep the host-side runner
# deterministic rather than assuming a tool from a provider base image.
uv_version: "0.6.14"

# ========================================
# System Configuration
# ========================================
timezone: "UTC"
# server_hostname будет взят из inventory_hostname если не указан

# ========================================
# Essential Packages
# ========================================
essential_packages:
  - curl
  - git
  # The stand builds its worker base images here whenever no published
  # release matches its tree, and that build is driven by the Makefile.
  - make
  - htop
  - vim
  - net-tools
  - ca-certificates
  - gnupg
  - wget
  - unzip
  - software-properties-common

---
# QA Runner provisioning — installs Claude Code CLI and QA dependencies
# on prod servers for post-deploy testing.
#
# Everything Claude Code needs belongs to {{ qa_runner_user }}: QA connects over
# SSH as that user and calls `claude` from its own $HOME/.local/bin. Installing
# under root would leave that user without a binary.

- name: Create QA runner directory
  file:
    path: "{{ qa_runner_dir }}"
    state: directory
    owner: "{{ qa_runner_user }}"
    mode: '0755'

# --- Swap (Claude Code installer needs ~2GB to unpack) ---

- name: Create swap file (2GB)
  shell: |
    fallocate -l 2G /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
  args:
    creates: /swapfile

- name: Enable swap
  shell: swapon /swapfile
  changed_when: false
  failed_when: false

- name: Persist swap in fstab
  lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

# --- Claude Code CLI (standalone binary, no Node.js needed) ---

- name: Create Claude config directory for the QA user
  file:
    path: "{{ qa_runner_home }}/.claude"
    state: directory
    owner: "{{ qa_runner_user }}"
    mode: '0700'

# pipefail is what makes a failed curl fail the task: without it bash exits 0 on
# empty input and Ansible reports a successful install with no binary on disk.
- name: Install Claude Code CLI via install script
  shell: |
    set -euo pipefail
    curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
    creates: "{{ qa_runner_claude_bin }}"
  become: true
  become_user: "{{ qa_runner_user }}"
  environment:
    HOME: "{{ qa_runner_home }}"

# Same invocation QA uses over SSH: bare `claude` found through $HOME/.local/bin.
- name: Verify Claude Code CLI runs for the QA user
  shell: |
    set -euo pipefail
    export PATH="$HOME/.local/bin:$PATH"
    claude --version
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ qa_runner_user }}"
  environment:
    HOME: "{{ qa_runner_home }}"
  changed_when: false
  register: qa_runner_claude_version

# --- Python QA dependencies (in venv, PEP 668) ---

- name: Install python3-venv
  apt:
    name: python3-venv
    state: present

- name: Create QA runner Python venv
  shell: python3 -m venv {{ qa_runner_dir }}/venv
  args:
    creates: "{{ qa_runner_dir }}/venv/bin/python"

- name: Install Python pip packages for QA (telethon, httpx)
  pip:
    name:
      - telethon
      - httpx
    state: present
    virtualenv: "{{ qa_runner_dir }}/venv"

# --- Claude Code session (copied from host) ---

- name: Copy Claude Code credentials
  copy:
    src: "{{ claude_credentials_file }}"
    dest: "{{ qa_runner_home }}/.claude/.credentials.json"
    owner: "{{ qa_runner_user }}"
    mode: '0600'
  no_log: true

- name: Configure Claude Code permissions (allowlist for QA)
  copy:
    dest: "{{ qa_runner_home }}/.claude/settings.json"
    owner: "{{ qa_runner_user }}"
    mode: '0600'
    content: |
      {
        "permissions": {
          "allow": [
            "Bash(*)", "Read(*)", "Write(*)", "Edit(*)",
            "Glob(*)", "Grep(*)", "WebFetch(*)", "WebSearch(*)"
          ],
          "deny": []
        }
      }
  no_log: true

# --- Telethon credentials (required) ---
#
# QA writes to bots as a real Telegram user, which needs all three values:
# Telethon connects with api_id/api_hash even when the session is already
# authorized. Missing any of them fails provisioning instead of leaving QA to
# discover it mid-run.

- name: Require Telethon credentials in the environment
  assert:
    that:
      - telethon_api_id | string | length > 0
      - telethon_api_hash | string | length > 0
      - telethon_session | string | length > 0
    fail_msg: >-
      TELETHON_API_ID, TELETHON_API_HASH and TELETHON_SESSION must all be set in
      the orchestrator .env. Without them QA cannot test Telegram bots.
    quiet: true

- name: Write Telethon credentials for the QA user
  copy:
    dest: "{{ qa_runner_telethon_env_file }}"
    owner: "{{ qa_runner_user }}"
    mode: '0600'
    content: |
      TELETHON_API_ID={{ telethon_api_id }}
      TELETHON_API_HASH={{ telethon_api_hash }}
      TELETHON_SESSION={{ telethon_session }}
  no_log: true

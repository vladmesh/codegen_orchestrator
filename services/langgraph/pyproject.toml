[project]
name = "langgraph-orchestrator"
version = "0.1.0"
description = "LangGraph-based multi-agent orchestrator"
requires-python = ">=3.12"
dependencies = [
    # LangGraph & LangChain
    "langgraph>=1.0.5",
    "langchain>=1.0.0",
    "langchain-openai>=0.2.0",

    # HTTP client
    "httpx>=0.27.0",
    "aiohttp>=3.14.3",

    # Redis (for stream communication)
    "redis[hiredis]>=8.1.0",

    # Utils
    "structlog>=25.1.0",
    "pyjwt[crypto]>=2.13.0",
    "pydantic-settings>=2.15.0",

    # GitHub secrets encryption
    "pynacl>=1.5.0",

    # LangGraph PostgreSQL checkpointer (psycopg[binary] needed for slim images)
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.3.4",

    # Conversation summarization (SummarizationNode for context management)
    "langmem>=0.0.30",

    # Web search for PO agent (DuckDuckGo, no API key needed)
    "ddgs>=7.0.0",

    # SSH for deploy pre-checks (server directory validation) and for the
    # one-shot identity a central QA run reaches its target with
    "asyncssh>=2.24.0",

    # Telegram QA probe. QA talks to a deployed bot as the platform's test
    # account from here; no deploy target holds a Telethon session any more.
    "telethon>=1.36.0",

    # The kit's own package-catalog loader and core version (src/kit_catalog.py): the
    # Architect plans packages from the kit's live catalog, parsed the way `kit add` parses
    # it. The same commit as the root `[tool.uv.sources]` pin; a unit test ties the two.
    "codegen-kit-tooling @ git+https://github.com/vladmesh/codegen-product-kit.git@b5716efe6ae03c13e1762e372c63e6639843d122",

    # shared/ deps (shared is COPY'd as plain files, not pip-installed)
    "pyyaml>=6.0",
    "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# `codegen-kit-tooling` is a direct reference to the pinned kit commit; hatchling refuses
# one in `project.dependencies` unless it is allowed explicitly.
[tool.hatch.metadata]
allow-direct-references = true

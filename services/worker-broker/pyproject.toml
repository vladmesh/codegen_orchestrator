[project]
name = "worker-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "redis",
    "structlog",
    # shared/ is copied as plain files rather than installed as a package.
    "httpx>=0.27.0",
    "pynacl>=1.5.0",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=43.0.0",
    "pgvector>=0.2.5",
    "pyyaml",
]

[tool.ruff]
# This local configuration is intentional: keep the broker aligned with worker-manager's
# stable Ruff 0.16 defaults until both services migrate to the repository rule set together.
line-length = 120

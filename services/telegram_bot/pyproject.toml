[project]
name = "telegram-bot"
version = "0.1.0"
description = "Telegram Bot Interface"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.8",
    "httpx>=0.27.0",
    # shared.notifications is the admin-alert channel the proactive listener
    # reaches for when a delivery cannot be completed; it talks over aiohttp.
    "aiohttp>=3.14.3",
    "structlog>=25.1.0",
    "redis[hiredis]>=8.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",

    # shared/ deps (shared is COPY'd as plain files, not pip-installed)
    "pyyaml>=6.0",
    "cryptography>=43.0.0",
    "pgvector>=0.2.5",
    "pyjwt[crypto]>=2.13.0",
    "pynacl>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

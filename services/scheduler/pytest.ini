[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that require database or Redis
    ci_only: runs in CI only, never in the host profile of scripts/test-unit-local.sh
    docker: implies ci_only; runs the real docker CLI (compose config, build, info)
    ansible: implies ci_only; runs ansible-core for real (ansible-playbook, PlaybookCLI)
    privileged: implies ci_only; needs root or sudo and changes the machine (useradd, become)
    kit_gate: implies ci_only; runs the product kit's toolchain gate (generate, ruff, xenon, deptry)
addopts =
    -v
    -W always
    --strict-markers
    --tb=short

log_format json_log escape=json '{"level":"info","service":"admin-frontend",'
    '"remote_addr":"$remote_addr","request":"$request",'
    '"status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"http_referer":"$http_referer","http_user_agent":"$http_user_agent",'
    '"request_time":$request_time}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log json_log;
    error_log /var/log/nginx/error.log warn;

    # Upstreams resolve per request through Docker's DNS, so nginx starts and stays up while an
    # upstream is not running yet; its routes answer 502 until it is. A proxy_pass naming the host
    # directly would be resolved once at startup, and an unknown name stops nginx. A proxy_pass
    # without a URI part forwards the request URI unchanged; /wm-api/ rewrites its prefix first.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;
    set $wm_upstream worker-manager:8000;
    set $grafana_upstream grafana:3000;

    # Basic auth for all locations (except health)
    auth_basic "Orchestrator Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # API proxy on the same origin, so the browser needs no CORS.
    #
    # The browser never holds the internal key: basic auth above decides who may use
    # this origin, and the proxy authenticates to the API on their behalf with the key
    # entrypoint.sh stamps in at container start. /api/debug/* goes through here too.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Key "__INTERNAL_API_KEY__";
        proxy_set_header X-Admin-Console-Operator $remote_user;
    }

    # Worker-manager introspection API
    location /wm-api/ {
        rewrite ^/wm-api/(.*)$ /api/introspect/$1 break;
        proxy_pass http://$wm_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health — no auth (for Docker healthcheck)
    location = /health {
        auth_basic off;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    # Grafana reverse proxy
    location /grafana/ {
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana WebSocket (live features)
    location /grafana/api/live/ {
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

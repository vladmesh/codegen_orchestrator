# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes from dev:
#   - Only Caddy publishes host ports; API, dashboards and PostgreSQL stay internal
#   - restart: unless-stopped on stateless services (already set on workers/caddy/registry)
#   - DB credentials have no defaults (fail-fast if .env is misconfigured)
#   - Redis AOF persistence enabled
#
# Secret paths (SSH key, GitHub App PEM, HOST_CLAUDE_DIR, HOST_CODEX_HOME)
# are controlled via env vars in .env — see docs/DEPLOY.md for required values.

services:
  api:
    restart: unless-stopped
    ports: !reset []

  admin-frontend:
    # Operator access goes through an SSH tunnel until the admin UI has an
    # authenticated TLS route in Caddy. Never publish Basic Auth over HTTP.
    ports: !override
      - "127.0.0.1:3001:80"

  user-dashboard:
    # Public access is served by Caddy at /lk; a direct port would bypass TLS
    # and expose nginx's unrestricted /api proxy.
    ports: !reset []

  langgraph:
    restart: unless-stopped

  telegram_bot:
    restart: unless-stopped

  scheduler:
    restart: unless-stopped

  db:
    # PostgreSQL is an internal control-plane dependency, not a host service.
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    command: redis-server --appendonly yes

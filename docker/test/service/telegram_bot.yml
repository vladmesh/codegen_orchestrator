services:
  redis:
    image: redis:7.4.10-alpine
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - test-net

  telegram-bot:
    image: codegen-orchestrator/telegram_bot:test
    build: 
        context: ../../..
        dockerfile: services/telegram_bot/Dockerfile
        args:
          SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: ["sh", "-c", "trap 'exit 0' TERM INT; python -c 'import src.main'; sleep infinity & wait"]
    environment:
      TELEGRAM_BOT_TOKEN: "123:test"
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000
      LK_DOMAIN: https://lk.test.example.com
    depends_on:
      - redis
    volumes:
      - ../../../services/telegram_bot/src:/app/src
      - ../../../shared:/app/shared
    networks:
      - test-net

  telegram_bot-test-runner:
    image: codegen-orchestrator/telegram_bot-test-runner:test
    build: 
        context: ../../..
        dockerfile: services/telegram_bot/Dockerfile.test
        args:
          SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    environment:
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: "123:test"
      API_BASE_URL: http://api:8000
      LK_DOMAIN: https://lk.test.example.com
      PYTHONPATH: /app
    volumes:
      # Mounted file by file on purpose. Binding the whole service directory
      # over /app makes Docker create the nested mount point /app/shared on the
      # host as an empty services/telegram_bot/shared, and that directory then
      # shadows the repository's shared package for anything importing from the
      # service path — including `make test-unit`, which is how it was found.
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../../services/telegram_bot/src:/app/src
      - ../../../services/telegram_bot/tests:/app/tests
      - ../../../services/telegram_bot/pytest.ini:/app/pytest.ini
      - ../../../shared:/app/shared
    working_dir: /app
    command: ["pytest", "tests/service", "-v", "-s", "--asyncio-mode=auto"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - test-net

networks:
  test-net:
    driver: bridge

services:
  # Infrastructure
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Real API Service
  api:
    image: codegen-orchestrator/api:test
    build: 
      context: ../../..
      dockerfile: services/api/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: ["/entrypoint.sh"]
    environment:
      - ENVIRONMENT=test
      - SEED_SYSTEM_CONFIGS_ON_START=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=test
      - SECRETS_ENCRYPTION_KEY=GkH0NqyqjG599M0K9fVwU34b_2i1-m_i_M80-82d2X0=
      - LK_JWT_SECRET=test-lk-jwt-secret
      - INTERNAL_API_KEY=test-internal-api-key-for-service-tests
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Real Loki — the analytics aggregator reads its logs from here
  loki:
    image: grafana/loki:3.4.3
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ../../../infra/loki.yml:/etc/loki/loki.yml:ro
      # World-writable tmpfs: the image runs Loki as a non-root user
      - type: tmpfs
        target: /loki
        tmpfs:
          mode: 0777
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Scheduler Test Runner
  scheduler-test-runner:
    image: codegen-orchestrator/scheduler-test-runner:test
    build:
      context: ../../..
      dockerfile: services/scheduler/Dockerfile.test
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: ["pytest", "tests/service/", "-v"]
    environment:
      - API_BASE_URL=http://api:8000
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=test-token-for-scheduler-tests
      - GITHUB_ORG_NAME=test-org
      - TIME4VPS_USERNAME=test
      - TIME4VPS_PASSWORD=test
      - INTERNAL_API_KEY=test-internal-api-key-for-service-tests
      - LOKI_URL=http://loki:3100
      - PYTHONPATH=/app:/app/src
    depends_on:
      api:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ../../../services/scheduler/src:/app/src
      - ../../../services/scheduler/tests:/app/tests
      - ../../../shared:/app/shared

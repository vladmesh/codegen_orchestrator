services:
  # The service under test
  api:
    image: codegen-orchestrator/api:test
    build: 
      context: ../../..
      dockerfile: services/api/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: ["/entrypoint.sh"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=test
      - SYSTEM_CONFIGS_TEST_OVERLAY=/app/scripts/system_configs.service_test.yaml
      - SECRETS_ENCRYPTION_KEY=wHhIQWmPfLt60oHdxzbQhY1ZKnUon12e5_SuZ33xDxc=
      - LK_JWT_SECRET=test-lk-jwt-secret-for-service-tests
      - INTERNAL_API_KEY=test-internal-api-key-for-service-tests
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Infrastructure
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test Runner
  api-test-runner:
    image: codegen-orchestrator/api-test-runner:test
    build:
      context: ../../..
      dockerfile: services/api/Dockerfile.test
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: ["pytest", "tests/service/", "-v"]
    environment:
      - API_URL=http://api:8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - SECRETS_ENCRYPTION_KEY=wHhIQWmPfLt60oHdxzbQhY1ZKnUon12e5_SuZ33xDxc=
      - LK_JWT_SECRET=test-lk-jwt-secret-for-service-tests
      - INTERNAL_API_KEY=test-internal-api-key-for-service-tests
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../../../services/api/src:/app/src
      - ../../../services/api/tests:/app/tests
      - ../../../shared:/app/shared

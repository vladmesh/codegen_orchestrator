services:
  # The service under test
  worker-manager:
    image: codegen-orchestrator/worker-manager:test
    build: 
      context: ../../..
      dockerfile: services/worker-manager/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    user: root
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WORKER_REDIS_URL=redis://redis:6379/0
      - WORKER_API_URL=http://api:8000
      - ENVIRONMENT=test
      - 'WORKER_DOCKER_LABELS={"com.codegen.environment": "test"}'
      - WORKER_IMAGE_PREFIX=worker-test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Infrastructure
  redis:
    image: redis:7.4.10-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test Runner
  worker-manager-test-runner:
    image: codegen-orchestrator/worker-manager-test-runner:test
    build:
      context: ../../..
      dockerfile: services/worker-manager/Dockerfile.test
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: ["pytest", "tests/service/", "-v", "-s"]
    environment:
      - WORKER_MANAGER_URL=http://worker-manager:8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      worker-manager:
        condition: service_healthy
    volumes:
      - ../../../services/worker-manager/src:/app/src
      - ../../../services/worker-manager/tests:/app/tests
      - ../../../shared:/app/shared

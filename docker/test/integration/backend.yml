networks:
  backend-test:
    name: backend-test-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  langgraph:
    build:
      context: ../../..
      dockerfile: services/langgraph/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_URL=http://api:8000
      - API_BASE_URL=http://api:8000
      - INTERNAL_API_KEY=test-internal-api-key-for-integration-tests
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend-test

  engineering-worker:
    build:
      context: ../../..
      dockerfile: services/langgraph/Dockerfile
    command: ["python", "-m", "src.consumers.engineering"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=http://api:8000
      - INTERNAL_API_KEY=test-internal-api-key-for-integration-tests
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend-test

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-test

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend-test:
        ipv4_address: 172.31.0.10

  api:
    build:
      context: ../../..
      dockerfile: services/api/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - SECRETS_ENCRYPTION_KEY=wHhIQWmPfLt60oHdxzbQhY1ZKnUon12e5_SuZ33xDxc=
      - LK_JWT_SECRET=test-lk-jwt-secret
      - INTERNAL_API_KEY=test-internal-api-key-for-integration-tests
    depends_on: [db, redis]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    networks:
      backend-test:
        ipv4_address: 172.31.0.20

  integration-test-runner:
    build:
      context: ../../..
      dockerfile: docker/test/integration/Dockerfile
    command:
      [
        "pytest",
        "tests/integration/backend/test_smoke.py",
        "tests/integration/backend/test_user_isolation.py",
        "tests/integration/backend/test_langgraph_integration.py",
        "tests/integration/backend/test_port_allocation_race.py",
        "tests/integration/backend/test_repositories.py",
        "-v",
      ]
    depends_on:
      langgraph:
        condition: service_started
      engineering-worker:
        condition: service_started
    volumes:
      - ../../../tests:/app/tests
      - ../../../services:/app/services
      - ../../../shared:/app/shared
      - ../../../packages:/app/packages
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://172.31.0.10:6379/0
      - API_BASE_URL=http://172.31.0.20:8000
      - INTERNAL_API_KEY=test-internal-api-key-for-integration-tests
    networks:
      - backend-test

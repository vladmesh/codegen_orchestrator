name: Set up uv with retry
description: Retry transient download failures while installing uv, and name exhaustion as CI infrastructure.
runs:
  using: composite
  steps:
    - name: Set up uv, attempt 1
      id: attempt-1
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      continue-on-error: true

    - name: Set up uv, attempt 2
      id: attempt-2
      if: steps.attempt-1.outcome != 'success'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      continue-on-error: true

    - name: Set up uv, attempt 3
      id: attempt-3
      if: steps.attempt-1.outcome != 'success' && steps.attempt-2.outcome != 'success'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      continue-on-error: true

    - name: Fail as CI infrastructure after retry exhaustion
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.attempt-1.outcome }}" = "success" ] || \
          [ "${{ steps.attempt-2.outcome }}" = "success" ] || \
          [ "${{ steps.attempt-3.outcome }}" = "success" ]; then
          exit 0
        fi
        echo "uv could not be downloaded after three attempts. Code changes are not required."
        bash "${GITHUB_WORKSPACE}/scripts/ci-infra.sh" mark --step setup-uv --cause uv-download
        exit 1

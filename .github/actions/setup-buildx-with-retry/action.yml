name: Set up Docker Buildx with retry
description: Bootstrap a Buildx builder in bounded attempts, retrying registry failures and hangs.
# Each attempt creates a docker-container builder and boots it, which pulls
# moby/buildkit (bootstrap.sh). The attempts are one scripts/ci-infra.sh retry, not three
# docker/setup-buildx-action steps: a composite action step takes no timeout-minutes, and
# buildx pulls the builder image on every bootstrap even when it is already local, so a
# pull that hangs (an anonymous Docker Hub rate limit neither fails nor finishes) held
# the first attempt until the job limit and the retry never ran. Under retry's
# --attempt-timeout a hung attempt is stopped and the next one starts. Measured
# bootstraps take under 40 s; three attempts at the bound, each with timeout's 30 s
# kill-after, plus backoff take at most 8 minutes, which scripts/check-ci-gate.py counts
# into the budget of every job that uses this action.
#
# ci.yml passes the workflow_dispatch inputs straight through, and a push or
# pull_request run passes them empty: bootstrap.sh reads empty as false.
inputs:
  simulate_first_attempt_registry_failure:
    description: Fail the first Buildx attempt before it reaches Docker Hub, for retry-path validation.
    required: false
    default: "false"
  simulate_first_attempt_pull_hang:
    description: Make the first Buildx attempt hang past its bound, for timeout-path validation.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx in bounded attempts
      shell: bash
      env:
        SIMULATE_REGISTRY_FAILURE: ${{ inputs.simulate_first_attempt_registry_failure }}
        SIMULATE_PULL_HANG: ${{ inputs.simulate_first_attempt_pull_hang }}
      run: >-
        bash "${GITHUB_WORKSPACE}/scripts/ci-infra.sh" retry --step setup-buildx --cause buildx-registry
        --attempt-timeout 120s -- bash "${GITHUB_ACTION_PATH}/bootstrap.sh"

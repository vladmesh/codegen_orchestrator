name: M4 bookkeeping repair

on:
  push:
    branches:
      - hotfix/m4-bookkeeping

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/m4-bookkeeping
      - name: Restore test guard and changelog
        shell: bash
        run: |
          if grep -q 'Run responses no longer project engineering token/cost accounting' docs/CHANGELOG.md && grep -q 'ix_engineering_budget_reservations_task_id' services/api/tests/service/test_engineering_attempt_ledger.py; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          test_path = Path('services/api/tests/service/test_engineering_attempt_ledger.py')
          test = test_path.read_text()
          comment_anchor = '    assert balance.json()["active_held_microusd"] == 0\n\n    readmitted = await async_client.post('
          comment_replacement = '    assert balance.json()["active_held_microusd"] == 0\n\n    # RELEASED proves the first handoff did not start. Reusing that stable\n    # attempt identity must make a fresh decision, not reuse its historical\n    # admitted outcome without a hold.\n    readmitted = await async_client.post('
          if comment_anchor in test:
              test = test.replace(comment_anchor, comment_replacement, 1)
          index_anchor = '                "ix_engineering_budget_reservations_story_id",\n                "ix_engineering_budget_reservation_user_state",'
          index_replacement = '                "ix_engineering_budget_reservations_story_id",\n                "ix_engineering_budget_reservations_task_id",\n                "ix_engineering_budget_reservation_user_state",'
          if index_anchor in test:
              test = test.replace(index_anchor, index_replacement, 1)
          if '"ix_engineering_budget_reservations_task_id"' not in test:
              raise SystemExit('task_id index assertion not restored')
          test_path.write_text(test)

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text()
          bullet = '- Run responses no longer project engineering token/cost accounting; Grafana and admin consumers read the\n  append-only engineering ledger, and the retired Run columns are dropped.\n\n'
          if bullet not in changelog:
              anchor = '## 2026-09-09\n\n'
              if anchor not in changelog:
                  raise SystemExit('2026-09-09 changelog heading not found')
              changelog = changelog.replace(anchor, anchor + bullet, 1)
          changelog_path.write_text(changelog)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/api/tests/service/test_engineering_attempt_ledger.py docs/CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'test: restore M4 migration guard and changelog'
          git push origin HEAD:hotfix/m4-bookkeeping

name: Production Agent Matrix

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Print recent matrix debug dumps without starting projects
        required: false
        type: boolean
        default: false

concurrency:
  group: production-agent-matrix
  cancel-in-progress: false

jobs:
  matrix:
    if: ${{ !inputs.diagnostics_only }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300
    steps:
      - name: Run Claude and Codex worker/QA matrix
        uses: appleboy/ssh-action@v1
        timeout-minutes: 290
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 285m
          script: |
            set -euo pipefail
            cd /opt/codegen_orchestrator
            export PATH="$HOME/.local/bin:$PATH"
            command -v uv >/dev/null
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"

            compose=(docker compose -f docker-compose.yml -f docker-compose.prod.yml)
            report="/tmp/codegen-agent-matrix-${{ github.run_id }}.tsv"
            matrix_api_container="codegen-agent-matrix-api-${{ github.run_id }}"
            printf 'qa_agent\tworker_agent\tstatus\tduration_seconds\trun_evidence\n' > "$report"

            set_qa_executor() {
              local executor="$1"
              python3 - "$executor" <<'PY'
            from pathlib import Path
            import sys

            path = Path(".env")
            executor = sys.argv[1]
            lines = path.read_text(encoding="utf-8").splitlines()
            rendered = []
            replaced = False
            for line in lines:
                if line.startswith("QA_EXECUTOR_AGENT_TYPE="):
                    rendered.append(f"QA_EXECUTOR_AGENT_TYPE={executor}")
                    replaced = True
                else:
                    rendered.append(line)
            if not replaced:
                rendered.append(f"QA_EXECUTOR_AGENT_TYPE={executor}")
            path.write_text("\n".join(rendered) + "\n", encoding="utf-8")
            PY
              "${compose[@]}" up -d --no-deps --force-recreate qa-worker
              local actual
              actual=$("${compose[@]}" exec -T qa-worker python -c \
                'from src.config.settings import get_settings; print(get_settings().qa_executor_agent_type.value)')
              test "$actual" = "$executor"
            }

            cleanup_matrix() {
              docker rm -f "$matrix_api_container" >/dev/null 2>&1 || true
              docker ps -a -q \
                --filter label=com.codegen.type=worker \
                --filter status=exited \
                --filter name=worker-dev-live-te- \
                | xargs -r docker rm -f >/dev/null
              set_qa_executor codex || true
            }
            trap cleanup_matrix EXIT

            internal_key=$("${compose[@]}" exec -T api printenv INTERNAL_API_KEY)
            test -n "$internal_key"
            for fallback_var in QA_LLM_MODEL QA_LLM_BASE_URL QA_LLM_API_KEY; do
              test -z "$("${compose[@]}" exec -T qa-worker printenv "$fallback_var")"
            done

            # The production deploy consumes registry images, whose :latest may
            # lag the exact orchestrator revision under test. Build the complete
            # worker chain from this checkout so services and worker-wrapper are
            # guaranteed to speak the same contracts during the experiment.
            make rebuild-worker-images
            make check-worker-images
            cleanup_matrix

            # Production intentionally does not publish the API port. Start an
            # isolated second API process for the host-side live harness; it
            # shares the production network and state, but never recreates the
            # primary API container or changes Caddy routing.
            docker rm -f "$matrix_api_container" >/dev/null 2>&1 || true
            "${compose[@]}" run -d --no-deps \
              --name "$matrix_api_container" \
              -p 127.0.0.1:8000:8000 api >/dev/null
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                docker logs "$matrix_api_container"
                exit 1
              fi
              sleep 1
            done

            # This is deliberately the released PO-tool boundary, not a POST
            # factory. The entry point binds two manifest-owned project ids to
            # this checkout and writes its own exclusive receipt before any
            # worker/QA combination starts. Its failure is terminal for this
            # operator-dispatched matrix, but the receipt remains for the
            # read-only diagnostics action.
            preflight_id="matrix-po-default-${{ github.run_id }}-${{ github.run_attempt }}"
            preflight_evidence="docs/e2e_results/run-evidence-po-default-${preflight_id}.json"
            test ! -e "$preflight_evidence"
            if COMPOSE_FILE="docker-compose.yml:docker-compose.prod.yml" \
              INTERNAL_API_KEY="$internal_key" \
              PO_DEFAULT_MATRIX_API_URL="http://127.0.0.1:8000" \
              PO_DEFAULT_MATRIX_API_CONTAINER="$matrix_api_container" \
              PO_DEFAULT_MATRIX_CHECKOUT_SHA="${{ github.sha }}" \
              PO_DEFAULT_MATRIX_PREFLIGHT_ID="$preflight_id" \
              PO_DEFAULT_MATRIX_TEST_TELEGRAM_ID="999000001" \
              PO_DEFAULT_MATRIX_EVIDENCE_DIRECTORY="docs/e2e_results" \
              uv run python tests/live/po_default_preflight.py; then
              preflight_status=passed
            else
              preflight_status=failed
            fi
            test -s "$preflight_evidence"
            printf '\nPO default preflight (%s):\n' "$preflight_status"
            cat "$preflight_evidence"
            test "$preflight_status" = passed

            matrix_failed=0
            for qa_agent in claude codex; do
              set_qa_executor "$qa_agent"
              for worker_agent in claude codex; do
                started=$(date +%s)
                if INTERNAL_API_KEY="$internal_key" \
                  LIVE_LLM_QA=1 \
                  LIVE_QA_AGENT_TYPE="$qa_agent" \
                  LIVE_WORKER_AGENT_TYPE="$worker_agent" \
                  uv run pytest \
                    tests/live/test_full_pipeline.py::TestFullPipelineLLM \
                    -v --tb=long -x -s; then
                  status=passed
                else
                  status=failed
                  matrix_failed=1
                  latest_debug=$(find docs/e2e_results -maxdepth 1 \
                    -name 'debug-full-llm-*.md' -type f -printf '%T@ %p\n' \
                    | sort -nr | head -n 1 | cut -d' ' -f2-)
                  if [ -n "$latest_debug" ]; then
                    printf '\nDebug dump for QA=%s worker=%s:\n' "$qa_agent" "$worker_agent"
                    cat "$latest_debug"
                  fi
                fi
                duration=$(($(date +%s) - started))

                # One retained artifact per combination, written by the live
                # harness before its teardown removes the worker containers the
                # evidence is read from. It is what makes a worker's death
                # attributable after the fact: exit code, bounded container log
                # tail, executed role agents and the retained transcript path.
                # Selected by this combination's own name and its own window, so
                # a combination that emitted nothing cannot borrow another's.
                evidence=$(find docs/e2e_results -maxdepth 1 \
                  -name "run-evidence-worker-${worker_agent}-qa-${qa_agent}-*.json" \
                  -type f -newermt "@$started" \
                  -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
                if [ -n "$evidence" ]; then
                  printf '\nRun evidence for QA=%s worker=%s:\n' "$qa_agent" "$worker_agent"
                  cat "$evidence"
                else
                  evidence=missing
                  printf '\nNo run evidence artifact for QA=%s worker=%s\n' \
                    "$qa_agent" "$worker_agent"
                fi

                printf '%s\t%s\t%s\t%s\t%s\n' \
                  "$qa_agent" "$worker_agent" "$status" "$duration" "$evidence" | tee -a "$report"
              done
            done

            cleanup_matrix
            trap - EXIT
            printf '\nProduction agent matrix summary:\n'
            cat "$report"
            exit "$matrix_failed"

  diagnostics:
    if: ${{ inputs.diagnostics_only }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Inspect recent matrix diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/codegen_orchestrator
            compose=(docker compose -f docker-compose.yml -f docker-compose.prod.yml)

            printf 'qa_executor='
            "${compose[@]}" exec -T qa-worker python -c \
              'from src.config.settings import get_settings; print(get_settings().qa_executor_agent_type.value)'
            if docker ps -a --format '{{.Names}}' | grep -q '^codegen-agent-matrix-api-'; then
              echo 'matrix_api_sidecar=present'
            else
              echo 'matrix_api_sidecar=absent'
            fi

            find docs/e2e_results -maxdepth 1 \
              -name 'run-evidence-*.json' -type f -printf '%T@ %p\n' \
              | sort -nr | head -n 4 | cut -d' ' -f2- \
              | while IFS= read -r evidence_file; do
                  printf '\n===== %s =====\n' "$evidence_file"
                  cat "$evidence_file"
                done

            find docs/e2e_results -maxdepth 1 \
              -name 'debug-full-llm-*.md' -type f -printf '%T@ %p\n' \
              | sort -nr | head -n 4 | cut -d' ' -f2- \
              | while IFS= read -r debug_file; do
                  printf '\n===== %s =====\n' "$debug_file"
                  cat "$debug_file"
                done

            printf '\n===== worker result contract failures (last 24h) =====\n'
            "${compose[@]}" logs --since 24h engineering-worker \
              | grep 'worker_result_invalid' || true

            printf '\n===== remaining worker containers =====\n'
            docker ps -a --filter label=com.codegen.type=worker \
              --format '{{.ID}} {{.Names}} {{.Status}}'
            docker ps -a -q --filter label=com.codegen.type=worker \
              | while IFS= read -r container_id; do
                  [ -n "$container_id" ] || continue
                  printf '\n--- %s ---\n' "$container_id"
                  docker logs --tail=200 "$container_id" 2>&1 || true
                done

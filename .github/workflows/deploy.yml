name: Deploy

# Both contours run this one workflow, so the run list would otherwise show a
# column of identical "Deploy" entries with no way to tell which machine each
# one touched.
run-name: Deploy ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - stand
      # Which released commit to deploy. Empty deploys the commit the workflow was
      # dispatched on. A previous released SHA redeploys that release through this
      # workflow, which is how a rollback is done (docs/DEPLOY.md, "Rolling back").
      revision:
        description: 'Full SHA of a released main commit to deploy (empty: the dispatched commit)'
        required: false
        default: ''
        type: string

# One deploy per contour at a time. The contours run on different hosts, so they
# do not queue behind each other — but two deploys racing on one host would fight
# over the same .env and the same compose project.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Only what the deploy actually does: read the worker and service image releases,
    # and the CI run that publishes them. The automatic token stands in for GHCR_TOKEN
    # where no environment defines one, so a contour needs no registry credential of its own.
    permissions:
      contents: read
      packages: read
      actions: read
    # Environment-scoped variables resolve only inside a job that declares the
    # environment, so the per-contour paths live here and not at workflow level.
    # The defaults are production's values: an environment that sets nothing
    # deploys exactly as before.
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/codegen_orchestrator' }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'deploy' }}
      COMPOSE_ARGS: ${{ vars.COMPOSE_ARGS || '-f docker-compose.yml -f docker-compose.prod.yml' }}
      # The one revision every step deploys: the runner checkout, both release waits,
      # the host checkout, both pulls and the target reconcile. Validated as a full
      # SHA before anything reads it.
      DEPLOY_REVISION: ${{ inputs.revision || github.sha }}
      # How long a deploy dispatched right after a merge waits for that commit's
      # push-to-main CI run to publish its worker and service releases (45 minutes,
      # one deadline for both).
      RELEASE_WAIT_SECONDS: 2700
      # Generated on the host from the pulled service release record
      # (scripts/service_release.py compose-override). Every compose call from the
      # pull on adds it, so compose runs the release by digest and builds nothing.
      SERVICE_RELEASE_COMPOSE: deployed-service-images.compose.yml
      # What a revision has to carry to be deployed by this workflow. A revision
      # without it predates pulled service releases and is refused.
      RELEASE_TOOLING: >-
        infra/scripts/pull-service-images.sh
        infra/scripts/retag-worker-images.sh
        scripts/release_switch.py
        scripts/service_release.py
        scripts/wait_release.py
      # Where the host stages the revision before the switch: a git worktree under
      # the SSH user's home, outside DEPLOY_PATH and outside every path a container
      # mounts. Everything that can refuse runs there; nothing running can see it.
      RELEASE_STAGE: .codegen-release-stage
      # Where the verify step leaves what it verified for the Switch: under the deploy
      # path, untracked, and outside every path a container mounts. Not live state.
      RELEASE_PENDING: .release-pending

    steps:
      # The revision reaches remote scripts and git commands, so it is a full SHA or
      # nothing: no branch name, no short SHA, no expression.
      - name: Validate the deployed revision
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOY_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: revision '${DEPLOY_REVISION}' is not a full 40-character commit SHA." >&2
            exit 1
          fi
          echo "Deploying ${DEPLOY_REVISION}"

      # The runner works from the deployed revision too: the release waits compute
      # that revision's source hash and run its own release consumers.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REVISION }}

      # A revision from before the service release was consumed has no service puller
      # and no compose override generator, and its compose would build on the host.
      # It is refused here, before any wait and before the host is touched.
      - name: Refuse a revision that predates pulled service releases
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for path in ${RELEASE_TOOLING}; do
            if [ ! -f "${path}" ]; then
              missing+=("${path}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "FATAL: ${DEPLOY_REVISION} predates deploying the service release by digest" >&2
            echo "       (it has no ${missing[*]}). This workflow cannot deploy it;" >&2
            echo "       deploy a later released revision instead (docs/DEPLOY.md, Rolling back)." >&2
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        env:
          REQUIRED_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REQUIRED_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          REQUIRED_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REQUIRED_INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          REQUIRED_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          REQUIRED_GRAFANA_DB_USER: ${{ secrets.GRAFANA_DB_USER }}
          REQUIRED_GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          REQUIRED_GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          REQUIRED_LOKI_PUSH_USER: ${{ secrets.LOKI_PUSH_USER }}
          REQUIRED_LOKI_PUSH_PASSWORD_HASH: ${{ secrets.LOKI_PUSH_PASSWORD_HASH }}
          REQUIRED_ORCHESTRATOR_PUBLIC_IP: ${{ secrets.ORCHESTRATOR_PUBLIC_IP }}
          REQUIRED_GH_ORG: ${{ secrets.GH_ORG }}
          REQUIRED_WORKER_BROKER_INTERNAL_TOKEN: ${{ secrets.WORKER_BROKER_INTERNAL_TOKEN }}
          # Policy, not a credential, so it is an environment variable. Compose
          # refuses to start without it; failing here stops before the host is touched.
          REQUIRED_DEFAULT_AGENT_TYPE: ${{ vars.DEFAULT_AGENT_TYPE }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            REQUIRED_POSTGRES_DB \
            REQUIRED_POSTGRES_USER \
            REQUIRED_POSTGRES_PASSWORD \
            REQUIRED_INTERNAL_API_KEY \
            REQUIRED_ADMIN_PASSWORD \
            REQUIRED_GRAFANA_DB_USER \
            REQUIRED_GRAFANA_DB_PASSWORD \
            REQUIRED_GRAFANA_ADMIN_PASSWORD \
            REQUIRED_LOKI_PUSH_USER \
            REQUIRED_LOKI_PUSH_PASSWORD_HASH \
            REQUIRED_ORCHESTRATOR_PUBLIC_IP \
            REQUIRED_GH_ORG \
            REQUIRED_WORKER_BROKER_INTERNAL_TOKEN \
            REQUIRED_DEFAULT_AGENT_TYPE
          do
            if [ -z "${!name}" ]; then
              missing+=("${name#REQUIRED_}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required secrets or variables for %s: %s\n' \
              "${{ inputs.environment }}" "${missing[*]}" >&2
            exit 1
          fi

      - name: Validate production provider secrets
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        env:
          REQUIRED_TIME4VPS_MANAGED_SERVER_IDS: ${{ secrets.TIME4VPS_MANAGED_SERVER_IDS }}
          REQUIRED_TIME4VPS_LOGIN: ${{ secrets.TIME4VPS_LOGIN }}
          REQUIRED_TIME4VPS_PASSWORD: ${{ secrets.TIME4VPS_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            REQUIRED_TIME4VPS_MANAGED_SERVER_IDS \
            REQUIRED_TIME4VPS_LOGIN \
            REQUIRED_TIME4VPS_PASSWORD
          do
            if [ -z "${!name}" ]; then
              missing+=("${name#REQUIRED_}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required production secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # A repository secret is inherited by every environment that does not define
      # its own, and that inheritance is invisible at the point of use: a contour
      # that simply omits the allowlist receives production's, and with it the
      # authority to reinstall production's servers. So every non-production
      # contour states its allowlist as an environment variable, and the deploy
      # refuses to run when the secret does not match what the contour declared.
      - name: Verify this contour's provider allowlist is its own
        if: ${{ inputs.environment != 'production' }}
        shell: bash
        env:
          MANAGED_SERVER_IDS: ${{ secrets.TIME4VPS_MANAGED_SERVER_IDS }}
          DECLARED_SERVER_IDS: ${{ vars.MANAGED_SERVER_IDS_DECLARED }}
        run: |
          set -euo pipefail
          if [ "${MANAGED_SERVER_IDS}" != "${DECLARED_SERVER_IDS}" ]; then
            echo "FATAL: PROVISIONING_POLICY_TIME4VPS_MANAGED_SERVER_IDS is not this environment's own list." >&2
            echo "       Either the environment declares no allowlist and inherited the" >&2
            echo "       repository one, or the two have drifted. Refusing to deploy." >&2
            exit 1
          fi
          echo "allowlist matches this contour's declaration"

      # Nothing may touch the host for a revision that has no worker release and no
      # service release. Both are published by the push-to-main CI run of this exact
      # commit, so a deploy dispatched while that run is still queued or running
      # waits for it, up to RELEASE_WAIT_SECONDS for both, re-probing each marker
      # read-only. A commit with no such run, a run that failed or was cancelled, and
      # a run that succeeded without a marker are refused at once, each with its own
      # exit code (scripts/wait_release.py). A rollback to a released SHA passes at once.
      - name: Wait for this revision's worker and service releases
        timeout-minutes: 50
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/wait_release.py --revision "${DEPLOY_REVISION}" \
            --chain worker --chain service --timeout-seconds "${RELEASE_WAIT_SECONDS}"

      # The file-only steps below reach the host through infra/scripts/deploy-ssh.sh,
      # which retries a dropped SSH connection (exit 255) a bounded number of times
      # and never re-runs a remote script that failed on its own. The remote script
      # travels on stdin, so what it carries never reaches a process list.
      - name: Write .env to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail
          bash infra/scripts/deploy-ssh.sh <<'REMOTE'
          set -euo pipefail
          umask 077
          cat > ${{ env.DEPLOY_PATH }}/.env << 'ENVEOF'
          # Database
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          # Internal service authentication
          INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}

          # LLM
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPEN_ROUTER_KEY=${{ secrets.OPEN_ROUTER_KEY }}
          PO_LLM_MODEL=${{ secrets.PO_LLM_MODEL }}
          PO_LLM_BASE_URL=${{ secrets.PO_LLM_BASE_URL }}
          PO_LLM_API_KEY=${{ secrets.PO_LLM_API_KEY }}

          ARCHITECT_LLM_MODEL=${{ secrets.ARCHITECT_LLM_MODEL }}
          ARCHITECT_LLM_BASE_URL=${{ secrets.ARCHITECT_LLM_BASE_URL }}
          ARCHITECT_LLM_API_KEY=${{ secrets.ARCHITECT_LLM_API_KEY }}

          # Summarization model selection; numeric tuning is seeded as system config below.
          SUMMARIZATION_MODEL=${{ secrets.SUMMARIZATION_MODEL }}

          # GitHub
          GITHUB_APP_ID=${{ secrets.GH_APP_ID }}
          GITHUB_ORG=${{ secrets.GH_ORG }}

          # Telegram
          # Same inheritance, worse consequence: two long-polling clients on one
          # token steal each other's updates, so a contour that is not the bot's
          # owner must not receive it. The stand runs no telegram_bot at all.
          TELEGRAM_BOT_TOKEN=${{ inputs.environment == 'production' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELETHON_API_ID=${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH=${{ secrets.TELETHON_API_HASH }}
          TELETHON_SESSION=${{ secrets.TELETHON_SESSION }}
          ADMIN_TELEGRAM_IDS=${{ secrets.ADMIN_TELEGRAM_IDS }}
          TELEGRAM_ID_ADMIN=${{ secrets.TELEGRAM_ID_ADMIN }}

          # Encryption
          SECRETS_ENCRYPTION_KEY=${{ secrets.SECRETS_ENCRYPTION_KEY }}

          # Which contour this installation is. Empty means production, so an
          # environment that sets nothing keeps production's resource names.
          LIVE_CONTOUR=${{ vars.LIVE_CONTOUR }}

          # Infrastructure
          ORCHESTRATOR_HOSTNAME=${{ secrets.ORCHESTRATOR_HOSTNAME }}
          ORCHESTRATOR_PUBLIC_IP=${{ secrets.ORCHESTRATOR_PUBLIC_IP }}
          # Each contour provisions its own servers. The allowlist is fail-closed
          # and per-ID, so a contour can act only on the servers it names — which
          # is why it must be its own list and not an inherited one. The step
          # below refuses the deploy when it is not.
          # The repository secret remains the input source. Services consume
          # the provider-scoped policy key below.
          PROVISIONING_POLICY_TIME4VPS_MANAGED_SERVER_IDS=${{ secrets.TIME4VPS_MANAGED_SERVER_IDS }}
          TIME4VPS_LOGIN=${{ secrets.TIME4VPS_LOGIN }}
          TIME4VPS_PASSWORD=${{ secrets.TIME4VPS_PASSWORD }}

          # Registry
          REGISTRY_USER=${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD=${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_PASSWORD_HASH=${{ secrets.REGISTRY_PASSWORD_HASH }}

          # Worker agents
          # Engineering executor for new projects; required, no fallback.
          DEFAULT_AGENT_TYPE=${{ vars.DEFAULT_AGENT_TYPE }}
          FACTORY_API_KEY=${{ secrets.FACTORY_API_KEY }}
          HOST_CLAUDE_DIR=${{ secrets.HOST_CLAUDE_DIR }}
          HOST_CODEX_HOME=${{ secrets.HOST_CODEX_HOME }}
          # Shared manager-to-broker credential. Generate: openssl rand -hex 32
          WORKER_BROKER_INTERNAL_TOKEN=${{ secrets.WORKER_BROKER_INTERNAL_TOKEN }}

          # Observability
          LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}
          LOKI_PUSH_USER=${{ secrets.LOKI_PUSH_USER }}
          LOKI_PUSH_PASSWORD=${{ secrets.LOKI_PUSH_PASSWORD }}
          LOKI_PUSH_PASSWORD_HASH=${{ secrets.LOKI_PUSH_PASSWORD_HASH }}
          GRAFANA_DB_USER=${{ secrets.GRAFANA_DB_USER }}
          GRAFANA_DB_PASSWORD=${{ secrets.GRAFANA_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          # Loki read address for the analytics aggregator (internal network name)
          LOKI_URL=http://loki:3100

          # Admin UI
          ADMIN_USER=${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

          # LK (user dashboard)
          LK_DOMAIN=${{ secrets.LK_DOMAIN }}
          LK_JWT_SECRET=${{ secrets.LK_JWT_SECRET }}

          # Prod secret paths (used by docker-compose.prod.yml)
          GITHUB_APP_PEM_PATH=/opt/secrets/github_app.pem
          # In-container path of the same key; services fail fast without it
          GITHUB_APP_PRIVATE_KEY_PATH=/app/keys/github_app.pem
          ENVEOF
          chmod 600 ${{ env.DEPLOY_PATH }}/.env
          REMOTE

      # Checked on the file that was actually written, because that is what the
      # services read. An allowlist is the only thing that authorizes reinstalling
      # a provider server; a stand that carried one could act on a machine it does
      # not own, and a bot token would fight production's for its updates.
      - name: Verify the deployed contour carries only its own credentials
        if: ${{ inputs.environment != 'production' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail
          bash infra/scripts/deploy-ssh.sh <<'REMOTE'
          set -euo pipefail
          token=$(grep -m1 "^TELEGRAM_BOT_TOKEN=" ${{ env.DEPLOY_PATH }}/.env | cut -d= -f2- || true)
          if [ -n "${token}" ]; then
            echo "FATAL: TELEGRAM_BOT_TOKEN must be empty outside production" >&2
            exit 1
          fi
          allowlist=$(grep -m1 "^PROVISIONING_POLICY_TIME4VPS_MANAGED_SERVER_IDS=" ${{ env.DEPLOY_PATH }}/.env \
            | cut -d= -f2- || true)
          if [ "${allowlist}" != "${{ vars.MANAGED_SERVER_IDS_DECLARED }}" ]; then
            echo "FATAL: the deployed allowlist is not the one this contour declared" >&2
            exit 1
          fi
          echo "this contour carries only its own allowlist: ${allowlist}"
          REMOTE

      # Verify. Everything that can refuse the revision runs here, and nothing it
      # writes is live host state. The revision is staged as a git worktree outside
      # DEPLOY_PATH (RELEASE_STAGE); the live repository is only fetched into (.git,
      # which no container mounts). From the stage, concurrently: the worker base
      # images (pull-worker-images.sh, local :latest names left in place) and the
      # control-plane service images (pull-service-images.sh), each read from that
      # exact commit's release marker, pulled by digest and refused when built from
      # other sources; and any third-party image compose names by tag that the host
      # does not have yet (`--policy missing`, as `up` used to, so a re-pushed tag
      # never restarts the database). Then the compose override is generated from
      # the service record and checked by compose.
      #
      # What passed becomes the pending set (RELEASE_PENDING): both records, the
      # override and the revision's own release_switch.py. Any pending set an earlier
      # attempt left is discarded first. The live records are not read or written
      # here: only the Switch promotes, and only after `up` succeeded. The stage is
      # removed however the step ends, and a stage a crashed run left is replaced.
      - name: Pull and verify this revision's worker and service releases
        uses: appleboy/ssh-action@v1
        timeout-minutes: 20
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ env.DEPLOY_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            live=${{ env.DEPLOY_PATH }}
            pending="${live}/${{ env.RELEASE_PENDING }}"
            rm -rf "${pending}" "${pending}.next"
            stage="${HOME}/${{ env.RELEASE_STAGE }}"
            unstage() {
              git -C "${live}" worktree remove --force "${stage}" 2>/dev/null || rm -rf "${stage}"
              git -C "${live}" worktree prune
            }
            unstage
            trap unstage EXIT
            git -C "${live}" fetch --no-tags origin ${{ env.DEPLOY_REVISION }}
            git -C "${live}" worktree add --detach "${stage}" ${{ env.DEPLOY_REVISION }}
            cd "${stage}"
            for path in ${{ env.RELEASE_TOOLING }}; do
              if [ ! -f "${path}" ]; then
                echo "FATAL: ${{ env.DEPLOY_REVISION }} has no ${path}: it predates pulled service releases." >&2
                exit 1
              fi
            done
            # Compose reads the contour's .env from the project directory; the copy
            # (and the resolved configuration, which carries its values) goes with the stage.
            install -m 600 "${live}/.env" .env
            out="${stage}/.release-out"
            mkdir -m 700 "${out}"
            export GHCR_TOKEN='${{ secrets.GHCR_TOKEN || github.token }}'
            export GHCR_OWNER='${{ github.repository_owner }}'
            WORKER_IMAGE_TAG='${{ env.DEPLOY_REVISION }}' \
            DIGEST_FILE="${out}/deployed-worker-images.json" \
            RELEASE_DEFER_RETAG=true \
            bash infra/scripts/pull-worker-images.sh > "${out}/worker.log" 2>&1 &
            worker_pid=$!
            SERVICE_IMAGE_TAG='${{ env.DEPLOY_REVISION }}' \
            DIGEST_FILE="${out}/deployed-service-images.json" \
            bash infra/scripts/pull-service-images.sh > "${out}/service.log" 2>&1 &
            service_pid=$!
            docker compose ${{ env.COMPOSE_ARGS }} pull --ignore-buildable --policy missing --quiet \
              > "${out}/third-party.log" 2>&1 &
            third_party_pid=$!
            worker_status=0
            wait "${worker_pid}" || worker_status=$?
            service_status=0
            wait "${service_pid}" || service_status=$?
            third_party_status=0
            wait "${third_party_pid}" || third_party_status=$?
            for part in worker service third-party; do
              echo "===== ${part} images ====="
              cat "${out}/${part}.log"
            done
            if [ "${worker_status}" -ne 0 ] || [ "${service_status}" -ne 0 ] \
              || [ "${third_party_status}" -ne 0 ]; then
              echo "FATAL: pulling the release failed (worker exit ${worker_status}," >&2
              echo "       service exit ${service_status}, third-party exit ${third_party_status})." >&2
              echo "       Nothing running was changed." >&2
              exit 1
            fi
            docker compose ${{ env.COMPOSE_ARGS }} config --format json > "${out}/compose.json"
            python3 scripts/service_release.py compose-override \
              --compose-config "${out}/compose.json" \
              --record "${out}/deployed-service-images.json" \
              --output "${out}/${{ env.SERVICE_RELEASE_COMPOSE }}"
            docker compose ${{ env.COMPOSE_ARGS }} -f "${out}/${{ env.SERVICE_RELEASE_COMPOSE }}" config --quiet
            python3 scripts/release_switch.py check --pending "${out}" --revision ${{ env.DEPLOY_REVISION }}
            # Every pull and check passed: this is the pending set, whole or not at all.
            mkdir -m 700 "${pending}.next"
            for file in deployed-worker-images.json deployed-service-images.json \
              ${{ env.SERVICE_RELEASE_COMPOSE }}; do
              mv "${out}/${file}" "${pending}.next/${file}"
            done
            cp scripts/release_switch.py "${pending}.next/release_switch.py"
            mv "${pending}.next" "${pending}"

      # What the deploy is made of, on the record. This does not look the tags up
      # again: it copies back the pending records the step above wrote from the
      # digests it pulled and verified — read before the Switch, so a deploy that
      # fails there still leaves the evidence of what it was about to start.
      - name: Record deployed revision and verified image digests
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          RECORDS: ${{ runner.temp }}/deployed-records
          WORKER_DIGEST_FILE: ${{ runner.temp }}/deployed-worker-images.json
          SERVICE_DIGEST_FILE: ${{ runner.temp }}/deployed-service-images.json
        run: |
          set -euo pipefail
          bash infra/scripts/deploy-ssh.sh > "${RECORDS}" <<'REMOTE'
          set -euo pipefail
          cat ${{ env.DEPLOY_PATH }}/${{ env.RELEASE_PENDING }}/deployed-worker-images.json
          echo '#service-release-record'
          cat ${{ env.DEPLOY_PATH }}/${{ env.RELEASE_PENDING }}/deployed-service-images.json
          REMOTE
          sed '/^#service-release-record$/,$d' "${RECORDS}" > "${WORKER_DIGEST_FILE}"
          sed '1,/^#service-release-record$/d' "${RECORDS}" > "${SERVICE_DIGEST_FILE}"
          python3 -m json.tool "${WORKER_DIGEST_FILE}" > /dev/null
          python3 -m json.tool "${SERVICE_DIGEST_FILE}" > /dev/null
          {
            echo "### Deployed revision ${DEPLOY_REVISION}"
            echo
            echo "Worker base images:"
            echo
            echo '```json'
            cat "${WORKER_DIGEST_FILE}"
            echo '```'
            echo
            echo "Service images:"
            echo
            echo '```json'
            cat "${SERVICE_DIGEST_FILE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployed worker image digests
        uses: actions/upload-artifact@v7
        with:
          name: deployed-worker-images-${{ env.DEPLOY_REVISION }}
          path: ${{ runner.temp }}/deployed-worker-images.json
          if-no-files-found: error

      - name: Upload deployed service image digests
        uses: actions/upload-artifact@v7
        with:
          name: deployed-service-images-${{ env.DEPLOY_REVISION }}
          path: ${{ runner.temp }}/deployed-service-images.json
          if-no-files-found: error

      # ---- Switch: the one place live host state changes. ----
      # Live host state is the /opt/secrets files, DEPLOY_PATH's tracked checkout,
      # the worker-base-*:latest tags worker-manager builds from, the running compose
      # project, the deployed/previous release records and the compose override `up`
      # reads. No other step, and no script another step calls, writes any of them.
      # One SSH session, one attempt (a dropped connection must not run it twice), in
      # this order:
      #   1. check the pending set is complete and is this revision's — the only check,
      #      before any write, run from the pending set's own copy of the helper
      #      because the checkout still holds the previous revision;
      #   2. the mounted secret file;  3. the checkout, reset to the revision;
      #   4. worker-base-*:latest from the pending worker record, before `up`, so the
      #      new worker-manager never sees the previous bases;
      #   5. the override, then `up`;
      #   6. only after `up` succeeded: promote — the live current records become
      #      previous, the pending records become current;
      #   7. bring the release to service: migrations and the config seeder in the
      #      released api container (the seeder talks to the API, so it waits for its
      #      health; paid-work controls are initialize-only, live operator values
      #      win), then the schedulers recreated after the seed and waited for. Their
      #      recreate is an `up`, and `up` happens nowhere but here.
      # A failure from 2 on leaves the target partially applied: rerun the deploy of
      # the same revision (every step is idempotent), or deploy the revision of the
      # live current record (docs/DEPLOY.md, "If a deploy fails").
      - name: Switch
        timeout-minutes: 25
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_SSH_ATTEMPTS: 1
        run: |
          set -euo pipefail
          bash infra/scripts/deploy-ssh.sh <<'REMOTE'
          set -euo pipefail
          # One group, read whole before any of it runs, with stdin from /dev/null:
          # `bash -s` reads this script from stdin, and `compose exec` would read the
          # rest of it as its own input.
          {
          live=${{ env.DEPLOY_PATH }}
          pending="${live}/${{ env.RELEASE_PENDING }}"
          cd "${live}"
          python3 "${pending}/release_switch.py" check --pending "${pending}" \
            --revision ${{ env.DEPLOY_REVISION }}

          sudo mkdir -p /opt/secrets
          sudo chown deploy:deploy /opt/secrets
          echo '${{ secrets.GH_APP_PRIVATE_KEY }}' > /opt/secrets/github_app.pem
          chmod 600 /opt/secrets/github_app.pem

          git reset --hard ${{ env.DEPLOY_REVISION }}

          bash infra/scripts/retag-worker-images.sh "${pending}/deployed-worker-images.json"

          cp "${pending}/${{ env.SERVICE_RELEASE_COMPOSE }}" "${{ env.SERVICE_RELEASE_COMPOSE }}.next"
          mv -f "${{ env.SERVICE_RELEASE_COMPOSE }}.next" ${{ env.SERVICE_RELEASE_COMPOSE }}
          docker compose ${{ env.COMPOSE_ARGS }} -f ${{ env.SERVICE_RELEASE_COMPOSE }} \
            up -d --remove-orphans --no-build --pull never

          python3 scripts/release_switch.py promote --pending "${pending}" --live "${live}" \
            --revision ${{ env.DEPLOY_REVISION }}

          docker compose ${{ env.COMPOSE_ARGS }} -f ${{ env.SERVICE_RELEASE_COMPOSE }} \
            exec -T api alembic upgrade head
          echo "Waiting for API to be healthy..."
          timeout=60
          while ! docker compose ${{ env.COMPOSE_ARGS }} -f ${{ env.SERVICE_RELEASE_COMPOSE }} \
            exec -T api curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1
          do
            if [ "${timeout}" -le 0 ]; then
              echo "FATAL: API health check failed after 60s" >&2
              docker compose ${{ env.COMPOSE_ARGS }} -f ${{ env.SERVICE_RELEASE_COMPOSE }} logs --tail=50 api >&2
              exit 1
            fi
            sleep 2
            timeout=$((timeout - 2))
          done
          echo "API is healthy"
          docker compose ${{ env.COMPOSE_ARGS }} -f ${{ env.SERVICE_RELEASE_COMPOSE }} exec -T api \
            python /app/scripts/seed_system_configs.py \
            --api-base-url http://localhost:8000 \
            --configs-path /app/scripts/system_configs.yaml
          docker compose ${{ env.COMPOSE_ARGS }} -f ${{ env.SERVICE_RELEASE_COMPOSE }} \
            up -d --force-recreate --no-deps --wait --wait-timeout 180 --no-build --pull never \
            scheduler-pipeline scheduler-infrastructure scheduler-maintenance
          } < /dev/null
          REMOTE

      # Every managed deploy target is reconciled to the QA target profile this
      # revision's `qa_identity` role defines — after the new services are healthy,
      # before the deploy reports success. The command parses each stored key,
      # proves the administrative login and privilege path, applies and proves the
      # role, and records a receipt or a typed not-ready incident per target. It
      # runs only the login, privilege and retrofit playbooks: no provider
      # reinstall, no firewall change, no QA or stand run. It exits zero only when
      # every managed row has a recorded ready or not-ready verdict; a row still
      # being provisioned, one it cannot handle, or a verdict superseded or not
      # recorded fails the step, and every row's outcome is listed in its output.
      - name: Reconcile managed deploy targets
        if: ${{ inputs.environment == 'production' }}
        uses: appleboy/ssh-action@v1
        timeout-minutes: 30
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ env.DEPLOY_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}
            deployed=$(git rev-parse HEAD)
            if [ "${deployed}" != "${{ env.DEPLOY_REVISION }}" ]; then
              echo "FATAL: ${{ env.DEPLOY_PATH }} is at ${deployed}, not the deployed ${{ env.DEPLOY_REVISION }}" >&2
              exit 1
            fi
            docker compose ${{ env.COMPOSE_ARGS }} -f ${{ env.SERVICE_RELEASE_COMPOSE }} exec -T infra-service \
              python -m src.provisioner.target_readiness --revision ${{ env.DEPLOY_REVISION }}

      # After the deploy is live and bounded, so it never holds the critical path.
      # It keeps the current and the previous release of both chains — the previous
      # one is what a rollback redeploys without a pull — and removes only images of
      # neither that no container uses. Service release images carry a local
      # codegen-orchestrator/<image>:<sha> name, so the dangling prune cannot take them.
      - name: Cleanup
        uses: appleboy/ssh-action@v1
        timeout-minutes: 10
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ env.DEPLOY_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}
            cleanup_status=0
            python3 scripts/cleanup_worker_images.py \
              --release-record deployed-worker-images.json \
              --previous-release-record previous-deployed-worker-images.json || cleanup_status=$?
            python3 scripts/service_release.py cleanup \
              --current-record deployed-service-images.json \
              --previous-record previous-deployed-service-images.json || cleanup_status=$?
            # Rebuilt worker images can leave their replaced images dangling on the
            # classic image store. Docker keeps images named by containers.
            docker image prune -f
            if [ "${cleanup_status}" -ne 0 ]; then
              exit "${cleanup_status}"
            fi

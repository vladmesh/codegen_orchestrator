name: Update Astra audit status

on:
  push:
    branches:
      - docs/astra-architecture-audit

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/astra-architecture-audit
      - name: Record M4 completion
        shell: bash
        run: |
          if grep -q 'Completed in PR #483' docs/astra_audit.md; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/astra_audit.md')
          text = path.read_text()
          completed_anchor = "- **M3 — completed in PR #464 (merged 2026-09-07).** Enabled PO now requires durable checkpoint configuration at startup; `MemorySaver` remains an explicit test construction path rather than a production downgrade.\n"
          text = text.replace(completed_anchor, completed_anchor + "- **M4 — completed in PR #483 (merged 2026-09-09).** Run responses no longer project engineering token/cost accounting from the ledger. The legacy Run API/model/admin fields and DB columns are removed; Grafana reads those facts directly from `engineering_attempt_ledger`, and boundary tests forbid restoring the old surface.\n", 1)
          text = text.replace("- **M4:** `_attach_ledger_compatibility()` still exists. The item remains current, but consumer/data-migration proof should be refreshed before dropping fields or columns.\n", "", 1)
          text = text.replace("Seven of the sixteen H/M/L findings are complete (H2, H3, H4, M1, M3, M6, M8); the other nine remain open.", "Eight of the sixteen H/M/L findings are complete (H2, H3, H4, M1, M3, M4, M6, M8); the other eight remain open.", 1)
          anchor = "Do not remove the projection before verifying admin/dashboard consumers and historical response expectations."
          progress = anchor + "\n\n### Progress\n\n**Completed in PR #483 (merged 2026-09-09).** The canonical ledger is now the only engineering token/cost read surface:\n\n- `_attach_ledger_compatibility()` and its transient `_ledger_*` projections are removed;\n- Run read/update schemas, the SQLAlchemy model and the admin frontend no longer expose `input_tokens`, `output_tokens`, `total_tokens` or `cost_usd`;\n- Alembic drops those four retired `runs` columns;\n- Grafana token/cost panels read `engineering_attempt_ledger` directly;\n- service and boundary tests pin the ledger read path and prevent the compatibility surface from returning.\n"
          text = text.replace(anchor, progress, 1)
          text = text.replace("1. Migrate old Run observability consumers to the engineering ledger and drop compatibility projections/columns.", "1. **Completed in PR #483:** migrate Run observability consumers to the engineering ledger and drop compatibility projections/columns.", 1)
          required = (
              "**M4 — completed in PR #483",
              "Eight of the sixteen H/M/L findings are complete",
              "**Completed in PR #483:** migrate Run observability consumers",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f"audit patch incomplete: {missing}")
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/astra_audit.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: record M4 completion'
          git push origin HEAD:docs/astra-architecture-audit

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service_template_candidate_ref:
        description: Optional codegen-product-kit tag or commit to test before updating the production pin
        required: false
        type: string
      simulate_first_attempt_registry_failure:
        description: Simulate a Docker registry failure on Buildx attempt 1 to validate the retry path
        required: false
        default: false
        type: boolean
      simulate_first_attempt_pull_hang:
        description: Make Buildx attempt 1 hang past its bound to validate the timeout path
        required: false
        default: false
        type: boolean

# A pull request keeps one run: a new push to its branch cancels the run of the older head.
# Every other run is a group of its own and is never cancelled: a second merge to main
# while the first merge's run is still going used to cancel that run, and the first SHA
# then never got its service and worker release. Run ids are unique, so no main run
# waits behind or replaces another either (a group holds one pending run, not a queue).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries a timeout-minutes, so nothing waits for GitHub's 360-minute default;
# the CI contract refuses a job without one. A docker step carries its own bound through
# scripts/ci-infra.sh, and every step that can run before it carries one too, so the worst
# case of all of them (each retry attempt at its bound, backoff, kill-after, plus a margin)
# fits inside the job: a step that hangs is stopped and named inside the job, and the
# always() expose step still runs. The CI contract sums that worst case per job and matrix
# leg; the step bounds come from the green runs of 2026-08-11..2026-09-23 with margin
# (docs/TESTING.md, "Time bounds").
jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      langgraph: ${{ steps.filter.outputs.langgraph }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      telegram: ${{ steps.filter.outputs.telegram }}
      worker-manager: ${{ steps.filter.outputs['worker-manager'] }}
      shared: ${{ steps.filter.outputs.shared }}
      packages: ${{ steps.filter.outputs.packages }}
      infra-service: ${{ steps.filter.outputs['infra-service'] }}
      docker-test: ${{ steps.filter.outputs['docker-test'] }}
      ci: ${{ steps.filter.outputs.ci }}
      deps: ${{ steps.filter.outputs.deps }}
      integration-tests: ${{ steps.filter.outputs['integration-tests'] }}
      web: ${{ steps.filter.outputs.web }}
      worker-broker: ${{ steps.filter.outputs['worker-broker'] }}
      scaffolder: ${{ steps.filter.outputs.scaffolder }}
      service-images: ${{ steps.filter.outputs['service-images'] }}
      # The plan the docker jobs run by (scripts/ci_plan.py): the legs of the two test
      # matrices, as JSON lists, and whether the service image import check runs.
      service-legs: ${{ steps.plan.outputs['service-legs'] }}
      integration-legs: ${{ steps.plan.outputs['integration-legs'] }}
      service-image-imports: ${{ steps.plan.outputs['service-image-imports'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
            langgraph:
              - 'services/langgraph/**'
            scheduler:
              - 'services/scheduler/**'
            telegram:
              - 'services/telegram_bot/**'
            worker-manager:
              - 'services/worker-manager/**'
            shared:
              - 'shared/**'
            packages:
              - 'packages/**'
            infra-service:
              - 'services/infra-service/**'
            docker-test:
              - 'tests/compose/**'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Makefile'
              - 'scripts/test-unit-local.sh'
              - 'scripts/check-ci-gate.py'
              - 'scripts/ci-infra.sh'
              - 'scripts/ci_plan.py'
              - 'scripts/ci_build_cache.py'
            deps:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'services/*/pyproject.toml'
              - 'shared/**/pyproject.toml'
              - 'packages/**/pyproject.toml'
            integration-tests:
              - 'tests/integration/**'
            web:
              - 'services/admin-frontend/**'
              - 'services/user-dashboard/**'
            worker-broker:
              - 'services/worker-broker/**'
            scaffolder:
              - 'services/scaffolder/**'
            # What the Python service images are built from: every such service (not the
            # frontends), shared/ and packages/ they bake, the compose files that start
            # them, and the import check's own scripts. deps and ci count too (ci_plan.py).
            service-images:
              - 'services/api/**'
              - 'services/infra-service/**'
              - 'services/langgraph/**'
              - 'services/scaffolder/**'
              - 'services/scheduler/**'
              - 'services/telegram_bot/**'
              - 'services/worker-broker/**'
              - 'services/worker-manager/**'
              - 'shared/**'
              - 'packages/**'
              - '.dockerignore'
              - 'docker-compose*.yml'
              - 'infra/scripts/service-images.sh'
              - 'scripts/check_service_image_imports.py'
              - 'scripts/service_image_locks.py'
              - 'scripts/ci_build_cache.py'

      - name: Plan the docker jobs
        id: plan
        timeout-minutes: 1
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_plan.py

  # Ruff alone, in about 15 s: this is what the docker jobs wait for, so a lint failure
  # still stops the heavy fan-out, while the unit suite (fast-checks) runs beside them
  # and is required by merge-gate.
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        timeout-minutes: 2
        with:
          python-version: '3.12'

      - name: Install uv
        run: >-
          bash scripts/ci-infra.sh retry --step install-uv --cause uv-download --attempt-timeout 60s
          -- pip install uv

      - name: Install dependencies
        timeout-minutes: 5
        run: uv sync --locked

      - name: Check formatting with Ruff
        timeout-minutes: 1
        run: uv run ruff format --check .

      - name: Lint with Ruff
        timeout-minutes: 1
        run: uv run ruff check .

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

  fast-checks:
    name: Fast Checks (Unit Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        timeout-minutes: 2
        with:
          python-version: '3.12'

      - name: Install uv
        run: >-
          bash scripts/ci-infra.sh retry --step install-uv --cause uv-download --attempt-timeout 60s
          -- pip install uv

      - name: Install dependencies
        timeout-minutes: 5
        run: uv sync --locked

      - name: Run unit tests
        timeout-minutes: 10
        run: make test-unit

      - name: Check nothing built is behind the tree on shared
        timeout-minutes: 1
        run: make check-shared-freshness

      - name: Run offline live regressions
        timeout-minutes: 3
        run: make test-live

      - name: Pull Redis image with retry
        run: >-
          bash scripts/ci-infra.sh retry --step redis-pull --cause image-pull --attempt-timeout 90s
          -- docker pull redis:7.4.10-alpine

      - name: Run Redis capability cleanup regression
        run: bash scripts/ci-infra.sh bound --step redis-cleanup --timeout 3m -- bash scripts/ci-redis-cleanup-regression.sh

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

  ci-contract:
    name: CI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        timeout-minutes: 2
        with:
          python-version: '3.12'

      - name: Install uv
        run: >-
          bash scripts/ci-infra.sh retry --step install-uv --cause uv-download --attempt-timeout 60s
          -- pip install uv

      - name: Install dependencies
        timeout-minutes: 5
        run: uv sync --locked

      - name: Validate CI gate contract
        run: make ci-contract

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

  # Builds every Python service image in one parallel bake through the layer cache, then
  # imports its entry modules and checks its lock inside it. It runs when the plan says
  # an image's sources changed, and on every push to main whatever changed.
  service-image-imports:
    name: Service Image Entrypoint Imports
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [detect-changes, lint, ci-contract]
    if: >-
      needs.lint.result == 'success' && needs.ci-contract.result == 'success'
      && needs.detect-changes.outputs['service-image-imports'] == 'true'
    outputs:
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        timeout-minutes: 2
        with:
          python-version: '3.12'

      - name: Install Compose and lock parsers
        timeout-minutes: 2
        run: python -m pip install pyyaml==6.0.3 packaging==26.2

      - name: Set up Docker Buildx with retry
        id: buildx
        uses: ./.github/actions/setup-buildx-with-retry
        with:
          simulate_first_attempt_registry_failure: ${{ inputs.simulate_first_attempt_registry_failure }}
          simulate_first_attempt_pull_hang: ${{ inputs.simulate_first_attempt_pull_hang }}

      # The gha layer cache needs the Actions runtime token, which only actions receive.
      - name: Expose the Actions cache to Buildx
        timeout-minutes: 1
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      - name: Import every service entrypoint from its production image
        id: service-image-imports
        run: bash scripts/ci-infra.sh bound --step service-image-imports --timeout 15m -- python scripts/check_service_image_imports.py --layer-cache gha

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

  # The legs are the plan's (scripts/ci_plan.py): a leg nothing in the change reaches is
  # not created, so it takes no runner, and with no leg at all the job is skipped, which
  # merge-gate accepts only because the plan says so.
  test-service:
    name: Service Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: [detect-changes, lint, ci-contract]
    if: >-
      needs.lint.result == 'success' && needs.ci-contract.result == 'success'
      && needs.detect-changes.outputs['service-legs'] != '[]'
    env:
      CI_INFRA_JOB: test-service/${{ matrix.service }}
    # One output per matrix leg: legs share the job's outputs, and a leg that sets
    # none leaves the others' in place.
    outputs:
      infra-marker-api: ${{ steps.infra.outputs['infra-marker-api'] }}
      infra-marker-langgraph: ${{ steps.infra.outputs['infra-marker-langgraph'] }}
      infra-marker-scheduler: ${{ steps.infra.outputs['infra-marker-scheduler'] }}
      infra-marker-telegram_bot: ${{ steps.infra.outputs['infra-marker-telegram_bot'] }}
      infra-marker-worker-manager: ${{ steps.infra.outputs['infra-marker-worker-manager'] }}
      infra-marker-infra: ${{ steps.infra.outputs['infra-marker-infra'] }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs['service-legs']) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up Docker Buildx with retry
        id: buildx
        uses: ./.github/actions/setup-buildx-with-retry
        with:
          simulate_first_attempt_registry_failure: ${{ inputs.simulate_first_attempt_registry_failure }}
          simulate_first_attempt_pull_hang: ${{ inputs.simulate_first_attempt_pull_hang }}

      # The gha layer cache needs the Actions runtime token, which only actions receive.
      - name: Expose the Actions cache to Buildx
        timeout-minutes: 1
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      # Every image the compose file builds reads and writes the cache of its Dockerfile,
      # the scope every other job building that Dockerfile shares (scripts/ci_build_cache.py).
      - name: Wire the layer cache into the test images
        timeout-minutes: 1
        run: python3 scripts/ci_build_cache.py compose-override tests/compose/service/${{ matrix.service }}.yml "$RUNNER_TEMP/build-cache.yml"

      - name: Pull test images with retry
        id: pull-images
        run: bash scripts/ci-infra.sh pull-images --step pull-images tests/compose/service/${{ matrix.service }}.yml

      - name: Run service tests
        id: service-tests
        run: bash scripts/ci-infra.sh bound --step service-tests --timeout 15m -- make test-service SERVICE=${{ matrix.service }}
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          TEST_COMPOSE_OVERRIDE: ${{ runner.temp }}/build-cache.yml

      - name: Assert required service test ran
        timeout-minutes: 1
        if: always()
        run: |
          if [ "${{ steps.buildx.outcome }}" != "success" ]; then
            echo "CI infrastructure failure: Docker image registry was unavailable while preparing Buildx after retries."
            echo "Do not change application code. Re-run CI when the registry is available."
            exit 1
          fi
          if [ "${{ steps.pull-images.outcome }}" != "success" ]; then
            echo "Pulling the test images did not succeed; see that step's log."
            echo "A registry that stayed unavailable after retries is marked there as CI infrastructure."
            exit 1
          fi
          if [ "${{ steps.service-tests.outcome }}" != "success" ]; then
            echo "Required service test did not complete successfully: ${{ matrix.service }}"
            echo "Outcome: ${{ steps.service-tests.outcome }}"
            exit 1
          fi

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker-${{ matrix.service }}

  test-integration:
    name: Integration Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [detect-changes, lint, ci-contract]
    if: >-
      needs.lint.result == 'success' && needs.ci-contract.result == 'success'
      && needs.detect-changes.outputs['integration-legs'] != '[]'
    env:
      CI_INFRA_JOB: test-integration/${{ matrix.suite }}
    outputs:
      infra-marker-backend: ${{ steps.infra.outputs['infra-marker-backend'] }}
      infra-marker-template: ${{ steps.infra.outputs['infra-marker-template'] }}
      infra-marker-frontend: ${{ steps.infra.outputs['infra-marker-frontend'] }}
      infra-marker-infra: ${{ steps.infra.outputs['infra-marker-infra'] }}
      infra-marker-po-tools: ${{ steps.infra.outputs['infra-marker-po-tools'] }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.detect-changes.outputs['integration-legs']) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up Docker Buildx with retry
        id: buildx
        uses: ./.github/actions/setup-buildx-with-retry
        with:
          simulate_first_attempt_registry_failure: ${{ inputs.simulate_first_attempt_registry_failure }}
          simulate_first_attempt_pull_hang: ${{ inputs.simulate_first_attempt_pull_hang }}

      - name: Set up uv for template smoke
        id: setup-uv
        if: matrix.suite == 'template'
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retry

      - name: Expose the Actions cache to Buildx
        timeout-minutes: 1
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      - name: Wire the layer cache into the test images
        timeout-minutes: 1
        run: python3 scripts/ci_build_cache.py compose-override tests/compose/integration/${{ matrix.suite }}.yml "$RUNNER_TEMP/build-cache.yml"

      - name: Pull test images with retry
        id: pull-images
        run: bash scripts/ci-infra.sh pull-images --step pull-images tests/compose/integration/${{ matrix.suite }}.yml

      - name: Run integration tests
        id: integration-tests
        run: bash scripts/ci-infra.sh bound --step integration-tests --timeout 10m -- make test-integration-${{ matrix.suite }}
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          TEST_COMPOSE_OVERRIDE: ${{ runner.temp }}/build-cache.yml

      - name: Assert required integration test ran
        timeout-minutes: 1
        if: always()
        run: |
          if [ "${{ steps.buildx.outcome }}" != "success" ]; then
            echo "CI infrastructure failure: Docker image registry was unavailable while preparing Buildx after retries."
            echo "Do not change application code. Re-run CI when the registry is available."
            exit 1
          fi
          if [ "${{ steps.setup-uv.outcome }}" = "failure" ]; then
            echo "CI infrastructure failure: uv could not be downloaded after retries."
            exit 1
          fi
          if [ "${{ steps.pull-images.outcome }}" != "success" ]; then
            echo "Pulling the test images did not succeed; see that step's log."
            echo "A registry that stayed unavailable after retries is marked there as CI infrastructure."
            exit 1
          fi
          if [ "${{ steps.integration-tests.outcome }}" != "success" ]; then
            echo "Required integration test did not complete successfully: ${{ matrix.suite }}"
            echo "Outcome: ${{ steps.integration-tests.outcome }}"
            exit 1
          fi

      - name: Cleanup test containers
        timeout-minutes: 2
        if: always()
        run: docker compose -p codegen_orchestrator_test_${{ matrix.suite }} -f tests/compose/integration/${{ matrix.suite }}.yml down -v --remove-orphans 2>/dev/null || true

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker-${{ matrix.suite }}

  template-compatibility:
    name: Template Compatibility (${{ matrix.entry }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, ci-contract]
    if: needs.lint.result == 'success' && needs.ci-contract.result == 'success'
    env:
      CI_INFRA_JOB: template-compatibility/${{ matrix.entry }}
    outputs:
      infra-marker-baseline: ${{ steps.infra.outputs['infra-marker-baseline'] }}
      infra-marker-candidate: ${{ steps.infra.outputs['infra-marker-candidate'] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - entry: baseline
            candidate: false
          - entry: candidate
            candidate: true
    steps:
      - name: Checkout code
        if: matrix.candidate == false || inputs.service_template_candidate_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up uv with retry
        if: matrix.candidate == false || inputs.service_template_candidate_ref != ''
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retry

      - name: Run baseline compatibility smoke
        if: matrix.candidate == false
        run: >-
          bash scripts/ci-infra.sh bound --step compatibility-smoke --timeout 15m --
          make test-template-compat ARTIFACT_DIR="$RUNNER_TEMP/template-compat-${{ matrix.entry }}"

      - name: Run candidate compatibility smoke
        if: matrix.candidate == true && inputs.service_template_candidate_ref != ''
        run: >-
          bash scripts/ci-infra.sh bound --step compatibility-smoke --timeout 15m --
          make test-template-compat TEMPLATE_REF="$CANDIDATE_REF" ARTIFACT_DIR="$RUNNER_TEMP/template-compat-${{ matrix.entry }}"
        env:
          CANDIDATE_REF: ${{ inputs.service_template_candidate_ref }}

      - name: Candidate not requested
        if: matrix.candidate == true && inputs.service_template_candidate_ref == ''
        run: echo "No candidate ref was requested; production pin is unchanged"

      - name: Upload compatibility result
        timeout-minutes: 2
        if: always() && (matrix.candidate == false || inputs.service_template_candidate_ref != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: template-compat-${{ matrix.entry }}
          path: ${{ runner.temp }}/template-compat-${{ matrix.entry }}/template-compat-result.json
          if-no-files-found: error

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker-${{ matrix.entry }}

  web-checks:
    name: Web Checks (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        app: [admin-frontend, user-dashboard]
    defaults:
      run:
        working-directory: services/${{ matrix.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs tsc -b, so a type error fails here too.
      - name: Build
        run: npm run build

  # This suite exercises the worker image chain against a real Docker daemon. It
  # is too expensive for every PR, but a worker release on main cannot bypass it:
  # merge-gate consumes this job in the same DAG before it permits the marker.
  #
  # It tests the images that ship: the candidate record of build-worker-images, pulled
  # into DinD by digest, never a chain of its own. publish-worker-images commits exactly
  # that record, handed over through the same job output, or refuses.
  test-backend-dind-integration:
    name: Backend Docker-in-Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: [lint, ci-contract, build-worker-images]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.lint.result == 'success' && needs.ci-contract.result == 'success'
      && needs.build-worker-images.result == 'success'
    outputs:
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    # packages: read is for pulling the candidates into DinD.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Set up Docker Buildx with retry
        id: buildx
        uses: ./.github/actions/setup-buildx-with-retry
        with:
          simulate_first_attempt_registry_failure: ${{ inputs.simulate_first_attempt_registry_failure }}
          simulate_first_attempt_pull_hang: ${{ inputs.simulate_first_attempt_pull_hang }}

      - name: Expose the Actions cache to Buildx
        timeout-minutes: 1
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      - name: Wire the layer cache into the test images
        timeout-minutes: 1
        run: python3 scripts/ci_build_cache.py compose-override tests/compose/integration/backend-dind.yml "$RUNNER_TEMP/build-cache.yml"

      - name: Pull test images with retry
        id: pull-images
        run: bash scripts/ci-infra.sh pull-images --step pull-images tests/compose/integration/backend-dind.yml

      # The suite pulls the candidates of this push into DinD and builds no worker image
      # (WORKER_BASE_IMAGE_SOURCE=candidates). watch still marks a Claude installer fetch
      # that failed after its retries, for the local runs that build the chain themselves.
      - name: Run integration tests
        id: integration-tests
        run: >-
          bash scripts/ci-infra.sh bound --step integration-tests --timeout 15m --
          bash scripts/ci-infra.sh watch --step integration-tests -- make test-integration-backend-dind
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          WORKER_BASE_IMAGE_SOURCE: candidates
          WORKER_BASE_CANDIDATES: ${{ needs.build-worker-images.outputs.candidates }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_COMPOSE_OVERRIDE: ${{ runner.temp }}/build-cache.yml

      - name: Assert backend Docker-in-Docker integration test ran
        timeout-minutes: 1
        if: always()
        run: |
          if [ "${{ steps.buildx.outcome }}" != "success" ]; then
            echo "CI infrastructure failure: Docker image registry was unavailable while preparing Buildx after retries."
            exit 1
          fi
          if [ "${{ steps.pull-images.outcome }}" != "success" ]; then
            echo "Pulling the test images did not succeed; see that step's log."
            echo "A registry that stayed unavailable after retries is marked there as CI infrastructure."
            exit 1
          fi
          if [ "${{ steps.integration-tests.outcome }}" != "success" ]; then
            echo "Backend Docker-in-Docker integration test did not complete successfully."
            echo "Outcome: ${{ steps.integration-tests.outcome }}"
            exit 1
          fi

      - name: Cleanup test containers
        timeout-minutes: 2
        if: always()
        run: docker compose -p codegen_orchestrator_test_backend-dind -f tests/compose/integration/backend-dind.yml down -v --remove-orphans 2>/dev/null || true

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

  # The first half of the worker base image release (infra/scripts/publish-worker-images.sh
  # candidates), keyed by the worker source hash. A released commit or hash is re-verified
  # and its digests handed on; only a hash with no release is built, once, and pushed
  # under this commit's SHA as candidates. It runs beside the suites, before anything is
  # known to be green, because a candidate is not a release. Its `candidates` output is
  # the one record both test-backend-dind-integration (which pulls and tests it) and
  # publish-worker-images (which commits it) read. It runs wherever the DinD suite runs.
  build-worker-images:
    name: Build Worker Base Image Candidates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    outputs:
      candidates: ${{ steps.candidates.outputs.candidates }}
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      # Deliberately no buildx builder: the chain is built with the runner's own docker
      # daemon, so the built images can be inspected and pushed by tag. watch marks a
      # Claude installer fetch that failed after its retries as CI infrastructure.
      - name: Build and push the worker image candidates
        run: >-
          bash scripts/ci-infra.sh bound --step build-candidates --timeout 15m --
          bash scripts/ci-infra.sh watch --step build-candidates --
          bash infra/scripts/publish-worker-images.sh candidates
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          CANDIDATE_FILE: ${{ runner.temp }}/worker-candidates.json

      - name: Hand the candidate record on
        id: candidates
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "candidates=$(base64 -w0 "${RUNNER_TEMP}/worker-candidates.json")" >> "$GITHUB_OUTPUT"
          {
            echo "### Worker base image candidates"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/worker-candidates.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

  # The first half of the service image release (infra/scripts/publish-service-images.sh):
  # every image of infra/scripts/service-images.sh built once and pushed under this
  # commit's SHA. It runs beside the suites, before anything is known to be green,
  # because a candidate is not a release: only publish-service-release, after the gate,
  # may commit these tags with the release marker. A red commit leaves inert candidates.
  # Push to main only, so a pull request never gets packages: write and never waits.
  build-service-images:
    name: Build Service Image Candidates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Nothing downstream of this job repeats its marker in the gate; like the release
    # job it reports a hang on its own annotations, summary and this output.
    outputs:
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      # A docker-container builder: it pushes straight from buildx and exports the
      # registry layer cache the candidates build from.
      - name: Set up Docker Buildx with retry
        id: buildx
        uses: ./.github/actions/setup-buildx-with-retry
        with:
          simulate_first_attempt_registry_failure: ${{ inputs.simulate_first_attempt_registry_failure }}
          simulate_first_attempt_pull_hang: ${{ inputs.simulate_first_attempt_pull_hang }}

      - name: Build and push the service image candidates
        run: >-
          bash scripts/ci-infra.sh bound --step build-candidates --timeout 25m --
          bash infra/scripts/publish-service-images.sh candidates
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

  merge-gate:
    name: Required CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
      - lint
      - fast-checks
      - ci-contract
      - service-image-imports
      - test-service
      - test-integration
      - template-compatibility
      - web-checks
      - test-backend-dind-integration
    if: always()
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLANNED_SERVICE_LEGS: ${{ needs.detect-changes.outputs['service-legs'] }}
          PLANNED_INTEGRATION_LEGS: ${{ needs.detect-changes.outputs['integration-legs'] }}
          PLANNED_SERVICE_IMAGE_IMPORTS: ${{ needs.detect-changes.outputs['service-image-imports'] }}
        run: |
          declare -A results=(
            ["detect-changes"]="${{ needs.detect-changes.result }}"
            ["lint"]="${{ needs.lint.result }}"
            ["fast-checks"]="${{ needs.fast-checks.result }}"
            ["ci-contract"]="${{ needs.ci-contract.result }}"
            ["service-image-imports"]="${{ needs.service-image-imports.result }}"
            ["test-service"]="${{ needs.test-service.result }}"
            ["test-integration"]="${{ needs.test-integration.result }}"
            ["template-compatibility"]="${{ needs.template-compatibility.result }}"
            ["web-checks"]="${{ needs.web-checks.result }}"
            ["test-backend-dind-integration"]="${{ needs.test-backend-dind-integration.result }}"
          )

          # A skip passes only where it is the plan. web-checks runs only for frontend and
          # CI changes. The DinD suite is deliberately main-only, but is mandatory on main
          # before a worker release can be published: a skipped DinD suite on main is
          # unsafe. The service and integration matrices and the service image import
          # check are skipped when detect-changes planned nothing for them
          # (scripts/ci_plan.py), and only then: a skip for any other reason, or with no
          # plan at all, fails the gate.
          skip_is_planned() {
            case "$1" in
              web-checks) return 0 ;;
              test-backend-dind-integration) [ "${GITHUB_REF}" != "refs/heads/main" ] ;;
              test-service) [ "${PLANNED_SERVICE_LEGS}" = "[]" ] ;;
              test-integration) [ "${PLANNED_INTEGRATION_LEGS}" = "[]" ] ;;
              service-image-imports) [ "${PLANNED_SERVICE_IMAGE_IMPORTS}" = "false" ] ;;
              *) return 1 ;;
            esac
          }

          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job: $result"
            if [ "$result" = "skipped" ] && skip_is_planned "$job"; then
              continue
            fi
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          # A job that failed on CI infrastructure exposes a marker as a job output
          # (scripts/ci-infra.sh). Repeat every one, so a reader of this gate alone sees
          # it. A marker never changes the verdict: the results above decide it.
          markers=$(printf '%s\n' "$NEEDS_JSON" \
            | grep -oE 'CI-INFRA-FAILURE: job=[A-Za-z0-9._/-]+ step=[A-Za-z0-9._/-]+ cause=[A-Za-z0-9._/-]+' \
            | sort -u || true)
          if [ -n "$markers" ]; then
            printf '### CI infrastructure failures\n\n' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r marker; do
              echo "::error title=CI infrastructure failure::$marker"
              printf '%s\n\n' "$marker" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$markers"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Required CI gate failed"
            exit 1
          fi

  # The second half of the worker base image release chain, and the only writer of its
  # markers (infra/scripts/publish-worker-images.sh release). Every green commit on main
  # gets its own release marker; the production deploy and the stand read the marker of
  # the exact revision they run and refuse anything else
  # (infra/scripts/pull-worker-images.sh). Nothing publishes a mutable :latest: that is
  # what put stale workers on a green deploy in GitHub #278.
  #
  # It builds nothing and pushes no image. It takes the candidate record DinD tested,
  # through the same build-worker-images output, and commits exactly those digests: a
  # fresh source hash gets its content marker and then the commit marker, an already
  # released hash only the commit marker (the alias), and a release of other digests is
  # refused. A rerun for an already-released SHA re-verifies it and pushes nothing.
  # `always()` is what makes this job reachable at all, not a way to publish a red
  # commit: the gate's own result is checked right after it. `merge-gate` runs with
  # `if: always()` because the suites above it are conditional, and a job downstream
  # of one skipped ancestor is skipped itself unless it says otherwise — so on every
  # main commit that left `web-checks` skipped (anything not touching the frontends)
  # this job silently never ran, and the revision got no worker release at all. The
  # deploy then refuses that revision (pull-worker-images.sh, exit 9), which is the
  # right end but a late and confusing one.
  publish-worker-images:
    name: Publish Worker Base Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [merge-gate, build-worker-images]
    if: >-
      always() && needs.merge-gate.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The gate runs before this job, so it cannot repeat this marker: a publish that hit
    # its bound is named on this job's own annotations and summary, and in this output.
    outputs:
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Verify the tested candidates and publish the worker release marker
        run: >-
          bash scripts/ci-infra.sh bound --step publish --timeout 10m --
          bash infra/scripts/publish-worker-images.sh release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          WORKER_CANDIDATES: ${{ needs.build-worker-images.outputs.candidates }}
          DIGEST_FILE: ${{ runner.temp }}/worker-images.json

      - name: Upload published worker image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worker-images-${{ github.sha }}
          path: ${{ runner.temp }}/worker-images.json
          if-no-files-found: error

      - name: Record the release in the run summary
        run: |
          set -euo pipefail
          {
            echo "### Worker base images published"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/worker-images.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

  # The second half of the service image release, and the only writer of its marker
  # (infra/scripts/publish-service-images.sh release). It commits the candidates of
  # build-service-images only once every one of them resolves to a digest whose
  # org.codegen.worker_source_hash is this tree's hash. `always()` has the reason given
  # for publish-worker-images above: without it a skipped conditional suite upstream of
  # the gate would skip this job, and the gate's own success is checked right after it.
  # A failed candidate build does not skip it either: the job then refuses loudly on the
  # tag that does not resolve. The deploy runs this release by digest (docs/DEPLOY.md).
  publish-service-release:
    name: Publish Service Image Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [merge-gate, build-service-images]
    if: >-
      always() && needs.merge-gate.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      infra-marker: ${{ steps.infra.outputs['infra-marker'] }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2

      - name: Verify the candidates and publish the service release marker
        run: >-
          bash scripts/ci-infra.sh bound --step publish --timeout 15m --
          bash infra/scripts/publish-service-images.sh release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          DIGEST_FILE: ${{ runner.temp }}/service-images.json

      - name: Upload published service image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: service-images-${{ github.sha }}
          path: ${{ runner.temp }}/service-images.json
          if-no-files-found: error

      - name: Record the release in the run summary
        run: |
          set -euo pipefail
          {
            echo "### Service images published"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/service-images.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Expose CI infrastructure failure
        id: infra
        if: always() && hashFiles('scripts/ci-infra.sh') != ''
        run: bash scripts/ci-infra.sh expose --output infra-marker

name: Grant migration access

# Temporary, one-shot: authorizes the migration operator's key on the production
# deploy account so the h01o move can copy data. Removed after the migration.
on:
  workflow_dispatch:

jobs:
  grant:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Append operator key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'deploy' }}
        run: |
          set -euo pipefail
          bash infra/scripts/deploy-ssh.sh <<'REMOTE'
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          grep -qF 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHQWwS+yEGzzcxlCZLAzOuzHlDEPxmm0x6fWnjc+LXpB codegen deploy CI -> h01o vlad' ~/.ssh/authorized_keys 2>/dev/null || echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHQWwS+yEGzzcxlCZLAzOuzHlDEPxmm0x6fWnjc+LXpB codegen deploy CI -> h01o vlad' >> ~/.ssh/authorized_keys
          echo "host: $(hostname) user: $(id -un) ip: $(curl -s -4 ifconfig.me || true)"
          echo "old-prod-hostname: $(grep -m1 '^ORCHESTRATOR_HOSTNAME=' /opt/codegen_orchestrator/.env | cut -d= -f2-)"
          REMOTE

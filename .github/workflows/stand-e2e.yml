name: Stand e2e

# The run list should say what was run without opening anything.
run-name: Stand e2e ${{ inputs.suite }}${{ inputs.suite == 'custom' && format(' ({0})', inputs.target) || '' }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'What to run'
        required: true
        default: 'mega'
        type: choice
        options:
          - mega
          - llm
          - matrix
          - custom
      target:
        description: 'pytest target, when suite is custom'
        required: false
        type: string
      worker:
        description: 'Coding agent (ignored by mega and matrix)'
        required: false
        default: 'claude'
        type: choice
        options:
          - claude
          - codex
      qa:
        description: 'QA executor (ignored by mega and matrix)'
        required: false
        default: 'codex'
        type: choice
        options:
          - claude
          - codex
      skip_sweep:
        description: 'Reserved for the later e2e runner; lifecycle cleanup is never skipped'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'

# One e2e at a time. They share a stand, a target server and one subscription
# per agent; two at once would fight over all three.
concurrency:
  group: stand-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: stand
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      STAND_RUN_TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The suite is a named one or a pytest target; `custom` is how the second
      # kind is spelled in a dropdown, and it has to name a target.
      - name: Resolve the suite
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.suite }}" = "custom" ]; then
            if [ -z "${{ inputs.target }}" ]; then
              echo "FATAL: suite=custom needs a pytest target" >&2
              exit 1
            fi
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate pre-create credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m scripts.stand_credentials

      - name: Preflight ephemeral machines
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo 'SSH_PRIVATE_KEY is unset' >&2; exit 2; }
          python3 -m scripts.stand_lifecycle preflight --run-tag "${STAND_RUN_TAG}"

      - name: Create ephemeral machines
        id: create
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
        run: |
          set -euo pipefail
          trap 'python3 -m scripts.stand_lifecycle cleanup --run-tag "${STAND_RUN_TAG}" || true' EXIT INT TERM
          python3 -m scripts.stand_lifecycle create --run-tag "${STAND_RUN_TAG}" --manifest machines.json --ttl-hours 6
          python3 -c '
          import json
          from pathlib import Path
          machines = json.loads(Path("machines.json").read_text())["machines"]
          values = {machine["role"] + "_ip": machine["ip"] for machine in machines}
          values.update({machine["role"] + "_id": machine["id"] for machine in machines})
          with Path(__import__("os").environ["GITHUB_OUTPUT"]).open("a") as output:
              output.writelines(f"{key}={value}\n" for key, value in values.items())
          '
          trap - EXIT INT TERM

      - name: Use created endpoints
        env:
          ORCHESTRATOR_IP: ${{ steps.create.outputs.orchestrator_ip }}
          TARGET_IP: ${{ steps.create.outputs.target_ip }}
        run: |
          set -euo pipefail
          test -n "${ORCHESTRATOR_IP}"
          test -n "${TARGET_IP}"
          printf 'orchestrator=%s\ntarget=%s\n' "${ORCHESTRATOR_IP}" "${TARGET_IP}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare protected SSH material
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo 'SSH_PRIVATE_KEY is unset' >&2; exit 2; }
          umask 077
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_path}"
          ssh-keygen -y -f "${key_path}" > "${RUNNER_TEMP}/stand-bootstrap.pub"

      - name: Bootstrap dynamic orchestrator
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          inventory="${RUNNER_TEMP}/stand-bootstrap.ini"
          {
            echo '[prod]'
            printf '%s ansible_user=root ansible_ssh_private_key_file=%s\n' "${PROD_HOST}" "${key_path}"
          } > "${inventory}"
          uvx --from ansible-core ansible-galaxy collection install \
            -r services/infra-service/ansible/requirements.yml
          ANSIBLE_CONFIG=services/infra-service/ansible/ansible.cfg \
            uvx --from ansible-core ansible-playbook -i "${inventory}" \
            services/infra-service/ansible/playbooks/bootstrap.yml \
            -e "ssh_public_key=$(<"${RUNNER_TEMP}/stand-bootstrap.pub")"
          ANSIBLE_CONFIG=services/infra-service/ansible/ansible.cfg \
            uvx --from ansible-core ansible-playbook -i "${inventory}" \
            services/infra-service/ansible/playbooks/provision_software.yml \
            -e "target_host=${PROD_HOST} deploy_user=deploy"
          ssh -i "${key_path}" -o StrictHostKeyChecking=accept-new root@"${PROD_HOST}" \
            'install -d -m 0755 /opt/codegen_orchestrator'
          rsync -a --delete --exclude .git --exclude .stand.env --exclude .stand-target.env \
            -e "ssh -i ${key_path} -o StrictHostKeyChecking=accept-new" \
            ./ root@"${PROD_HOST}":/opt/codegen_orchestrator/
          ssh -i "${key_path}" -o StrictHostKeyChecking=accept-new root@"${PROD_HOST}" \
            'uv --version >/dev/null'

      - name: Render protected dynamic configuration
        env:
          ORCHESTRATOR_PUBLIC_IP: ${{ steps.create.outputs.orchestrator_ip }}
          ORCHESTRATOR_HOSTNAME: ${{ steps.create.outputs.orchestrator_ip }}
          STAND_RUN_TAG: ${{ env.STAND_RUN_TAG }}
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LK_JWT_SECRET: ${{ secrets.LK_JWT_SECRET }}
          GITHUB_ORG: ${{ secrets.GH_ORG }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_PASSWORD_HASH: ${{ secrets.REGISTRY_PASSWORD_HASH }}
          LOKI_PUSH_USER: ${{ secrets.LOKI_PUSH_USER }}
          LOKI_PUSH_PASSWORD: ${{ secrets.LOKI_PUSH_PASSWORD }}
          LOKI_PUSH_PASSWORD_HASH: ${{ secrets.LOKI_PUSH_PASSWORD_HASH }}
          LOKI_URL: http://loki:3100
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_DB_USER: ${{ secrets.GRAFANA_DB_USER }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          WORKER_BROKER_INTERNAL_TOKEN: ${{ secrets.WORKER_BROKER_INTERNAL_TOKEN }}
          STAND_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAND_CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT }}
          STAND_CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          PO_LLM_MODEL: ${{ secrets.PO_LLM_MODEL }}
          PO_LLM_BASE_URL: ${{ secrets.PO_LLM_BASE_URL }}
          PO_LLM_API_KEY: ${{ secrets.PO_LLM_API_KEY }}
          ARCHITECT_LLM_MODEL: ${{ secrets.ARCHITECT_LLM_MODEL }}
          ARCHITECT_LLM_BASE_URL: ${{ secrets.ARCHITECT_LLM_BASE_URL }}
          ARCHITECT_LLM_API_KEY: ${{ secrets.ARCHITECT_LLM_API_KEY }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          SUMMARIZATION_MODEL: ${{ secrets.SUMMARIZATION_MODEL }}
          SUMMARIZATION_MAX_TOKENS: ${{ secrets.SUMMARIZATION_MAX_TOKENS }}
          SUMMARIZATION_TRIGGER_TOKENS: ${{ secrets.SUMMARIZATION_TRIGGER_TOKENS }}
          SUMMARIZATION_MAX_SUMMARY_TOKENS: ${{ secrets.SUMMARIZATION_MAX_SUMMARY_TOKENS }}
          GITHUB_APP_PEM_PATH: /opt/secrets/github_app.pem
          GITHUB_APP_PRIVATE_KEY_PATH: /app/keys/github_app.pem
          LIVE_CONTOUR: stand
        run: |
          set -euo pipefail
          umask 077
          python3 -c '
          import os
          from pathlib import Path
          names = (
              "ORCHESTRATOR_PUBLIC_IP", "ORCHESTRATOR_HOSTNAME", "STAND_RUN_TAG",
              "BITLAUNCH_API_KEY", "INTERNAL_API_KEY", "POSTGRES_DB", "POSTGRES_USER",
              "POSTGRES_PASSWORD", "SECRETS_ENCRYPTION_KEY", "LK_JWT_SECRET", "GITHUB_ORG",
              "GITHUB_APP_ID", "GITHUB_APP_PEM_PATH", "GITHUB_APP_PRIVATE_KEY_PATH",
              "REGISTRY_USER", "REGISTRY_PASSWORD", "REGISTRY_PASSWORD_HASH", "LOKI_PUSH_USER",
              "LOKI_PUSH_PASSWORD", "LOKI_PUSH_PASSWORD_HASH", "LOKI_URL", "ADMIN_USER",
              "ADMIN_PASSWORD", "GRAFANA_DB_USER", "GRAFANA_DB_PASSWORD", "GRAFANA_ADMIN_PASSWORD",
              "WORKER_BROKER_INTERNAL_TOKEN", "STAND_CLAUDE_CODE_OAUTH_TOKEN", "STAND_CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT", "STAND_CODEX_ACCESS_TOKEN", "PO_LLM_MODEL",
              "PO_LLM_BASE_URL", "PO_LLM_API_KEY", "ARCHITECT_LLM_MODEL", "ARCHITECT_LLM_BASE_URL",
              "ARCHITECT_LLM_API_KEY", "SUMMARIZATION_MODEL", "SUMMARIZATION_MAX_TOKENS",
              "SUMMARIZATION_TRIGGER_TOKENS", "SUMMARIZATION_MAX_SUMMARY_TOKENS", "LIVE_CONTOUR",
          )
          missing = [name for name in (*names, "GH_APP_PRIVATE_KEY") if not os.environ.get(name)]
          if missing:
              raise SystemExit("missing required stand configuration: " + ", ".join(missing))
          Path(".stand.env").write_text("\n".join(f"{name}={os.environ[name]}" for name in names) + "\n")
          Path(".stand-github-app.pem").write_text(os.environ["GH_APP_PRIVATE_KEY"])
          '

      - name: Bring up dynamic orchestrator and wait for API
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          scp -i "${key_path}" -o StrictHostKeyChecking=accept-new .stand.env \
            root@"${PROD_HOST}":/opt/codegen_orchestrator/.env
          ssh -i "${key_path}" -o StrictHostKeyChecking=accept-new root@"${PROD_HOST}" \
            'install -d -m 0700 /opt/secrets'
          scp -i "${key_path}" -o StrictHostKeyChecking=accept-new .stand-github-app.pem \
            root@"${PROD_HOST}":/opt/secrets/github_app.pem
          ssh -i "${key_path}" -o StrictHostKeyChecking=accept-new root@"${PROD_HOST}" '
            set -euo pipefail
            cd /opt/codegen_orchestrator
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml up -d --build --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml exec -T api alembic upgrade head
            remaining=180
            until docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml exec -T api curl -fsS http://127.0.0.1:8000/health >/dev/null; do
              test "${remaining}" -gt 0 || exit 1
              sleep 5
              remaining=$((remaining - 5))
            done
          '

      - name: Register and provision dynamic target
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
          TARGET_ID: ${{ steps.create.outputs.target_id }}
          TARGET_IP: ${{ steps.create.outputs.target_ip }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          registration_input="${RUNNER_TEMP}/stand-target.json"
          target_key="${RUNNER_TEMP}/stand-target.key"
          trap 'shred -u "${registration_input}" "${target_key}" || true' EXIT INT TERM
          export REGISTRATION_INPUT_PATH="${registration_input}"
          export TARGET_KEY_PATH="${target_key}"
          python3 -c '
          import json
          import os
          from pathlib import Path
          Path(os.environ["REGISTRATION_INPUT_PATH"]).write_text(json.dumps({
              "target_id": os.environ["TARGET_ID"],
              "target_ip": os.environ["TARGET_IP"],
              "run_tag": os.environ["STAND_RUN_TAG"],
          }) + "\n")
          Path(os.environ["TARGET_KEY_PATH"]).write_text(os.environ["SSH_PRIVATE_KEY"])
          '
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          tar -C "${RUNNER_TEMP}" -cf - stand-target.json stand-target.key | \
            ssh -i "${key_path}" -o StrictHostKeyChecking=accept-new root@"${PROD_HOST}" '
            set -euo pipefail
            umask 077
            cleanup() {
              shred -u /run/stand-target.key /run/stand-target.json || true
            }
            trap cleanup EXIT INT TERM
            tar -C /run -xf -
            cd /opt/codegen_orchestrator
            INTERNAL_API_KEY=$(sed -n "s/^INTERNAL_API_KEY=//p" ./.env)
            test -n "${INTERNAL_API_KEY}"
            export INTERNAL_API_KEY
            python3 -m scripts.register_bitlaunch_target \
              --input /run/stand-target.json --ssh-private-key-file /run/stand-target.key
            target_handle=$(python3 -c "import json; from pathlib import Path; print(\"bitlaunch-\" + str(json.loads(Path(\"/run/stand-target.json\").read_text())[\"target_id\"]))")
            python3 -m scripts.request_stand_provisioning --handle "${target_handle}"
            python3 -m scripts.wait_stand_provisioning --handle "${target_handle}"
          '

      - name: Provide worker base images on the stand
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          release_sha="${GITHUB_SHA}"
          echo "worker image release candidate: ${release_sha}"
          printf '%s\n' "${GHCR_TOKEN}" | ssh -i "${key_path}" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            root@"${PROD_HOST}" \
            "IFS= read -r GHCR_TOKEN && export GHCR_TOKEN && \
             cd /opt/codegen_orchestrator && \
             GHCR_OWNER='${GHCR_OWNER}' WORKER_IMAGE_TAG='${release_sha}' \
             DIGEST_FILE=/opt/codegen_orchestrator/deployed-worker-images.json \
             bash infra/scripts/pull-worker-images.sh" && pulled=0 || pulled=$?
          # Only a confirmed absent whole release (9) admits a local build.
          # Auth, transport, rate-limit, DNS, tool, source-hash and
          # invalid-release failures stay visible instead of being
          # misclassified as missing images.
          if [ "${pulled}" -ne 0 ]; then
            case "${pulled}" in
              9)
                echo "no release matches this tree (exit ${pulled}); building on the stand"
                ssh -i "${key_path}" -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                  root@"${PROD_HOST}" \
                  'cd /opt/codegen_orchestrator && export PATH=/usr/local/bin:$PATH && make ensure-worker-images'
                ;;
              *)
                echo "FATAL: pulling the worker image release failed with ${pulled}" >&2
                exit "${pulled}"
                ;;
            esac
          fi

      # The runner is the single owner of named-suite and custom-target
      # semantics.  Its non-zero result is held until the safe handoff has been
      # collected, then restored below so a suite failure remains the e2e result.
      - name: Run selected stand suite
        id: suite-run
        if: success()
        continue-on-error: true
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
          SUITE: ${{ steps.suite.outputs.value }}
          WORKER: ${{ inputs.worker }}
          QA: ${{ inputs.qa }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          remote_command=$(printf 'cd /opt/codegen_orchestrator && uv run python scripts/stand_run.py --suite %q --worker %q --qa %q' "${SUITE}" "${WORKER}" "${QA}")
          ssh -i "${key_path}" -o StrictHostKeyChecking=accept-new root@"${PROD_HOST}" "${remote_command}" \
            >"${RUNNER_TEMP}/remote-invocation.log" 2>&1

      # Copy only the runner's public reports.  This short-lived handoff is how
      # the fresh cleanup runner can build the one final acceptance artifact.
      - name: Record machine manifest
        if: always()
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/stand-e2e-handoff"
          run_dir="${evidence_dir}/run"
          mkdir -p "${run_dir}"
          test -f machines.json && cp machines.json "${evidence_dir}/machines.json" || true
          test -f "${RUNNER_TEMP}/remote-invocation.log" && \
            cp "${RUNNER_TEMP}/remote-invocation.log" "${run_dir}/remote-invocation.log" || true
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          if [ -n "${PROD_HOST}" ]; then
            for name in junit.xml report.tsv run.log claude-claude.log claude-codex.log codex-claude.log codex-codex.log; do
              scp -i "${key_path}" -o StrictHostKeyChecking=accept-new \
                root@"${PROD_HOST}":/root/e2e-runs/latest/"${name}" "${run_dir}/${name}" || true
            done
          fi

      # This is the admission boundary for the inter-job handoff. It derives
      # needles only from the helper's protected-value allow-list; public stand
      # routing and application configuration never becomes a redaction needle.
      - name: Admit cleanup handoff
        id: handoff-admission
        if: always()
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LK_JWT_SECRET: ${{ secrets.LK_JWT_SECRET }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_PASSWORD_HASH: ${{ secrets.REGISTRY_PASSWORD_HASH }}
          LOKI_PUSH_PASSWORD: ${{ secrets.LOKI_PUSH_PASSWORD }}
          LOKI_PUSH_PASSWORD_HASH: ${{ secrets.LOKI_PUSH_PASSWORD_HASH }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          WORKER_BROKER_INTERNAL_TOKEN: ${{ secrets.WORKER_BROKER_INTERNAL_TOKEN }}
          STAND_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAND_CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          PO_LLM_API_KEY: ${{ secrets.PO_LLM_API_KEY }}
          ARCHITECT_LLM_API_KEY: ${{ secrets.ARCHITECT_LLM_API_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          never_upload="${RUNNER_TEMP}/stand-e2e-never-upload"
          mkdir -p "${never_upload}"
          canary="$(uuidgen)"
          printf '%s\n' "${canary}" > "${never_upload}/run.log"
          export STAND_ACCEPTANCE_CANARY="${canary}"
          if python3 -m scripts.stand_acceptance scan \
            --artifact "${never_upload}" --canary-env STAND_ACCEPTANCE_CANARY; then
            echo 'redaction canary was not detected' >&2
            exit 2
          fi
          python3 -m scripts.stand_acceptance admit \
            --artifact "${RUNNER_TEMP}/stand-e2e-handoff" \
            --status "${RUNNER_TEMP}/stand-e2e-handoff-admission.json" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --protected-env

      - name: Upload cleanup handoff
        if: ${{ always() && steps.handoff-admission.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: stand-e2e-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stand-e2e-handoff
          if-no-files-found: error

      - name: Preserve suite result
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite-run.outcome }}
        run: |
          test "${SUITE_OUTCOME}" != "failure"

  cleanup:
    needs: e2e
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: stand
    env:
      STAND_RUN_TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v5

      - name: Download cleanup handoff
        id: handoff
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: stand-e2e-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stand-e2e-handoff

      - name: Cleanup and observe run-tagged machines
        id: cleanup-observation
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          handoff_dir="${RUNNER_TEMP}/stand-e2e-handoff"
          mkdir -p "${handoff_dir}"
          python3 -m scripts.stand_lifecycle cleanup-report \
            --run-tag "${STAND_RUN_TAG}" --output "${handoff_dir}/cleanup.json"

      - name: Build final acceptance evidence
        id: build-evidence
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m scripts.stand_acceptance build \
            --manifest "${RUNNER_TEMP}/stand-e2e-handoff/machines.json" \
            --run-dir "${RUNNER_TEMP}/stand-e2e-handoff/run" \
            --cleanup "${RUNNER_TEMP}/stand-e2e-handoff/cleanup.json" \
            --output "${RUNNER_TEMP}/stand-acceptance"

      - name: Admit final artifact
        id: final-admission
        if: always()
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LK_JWT_SECRET: ${{ secrets.LK_JWT_SECRET }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_PASSWORD_HASH: ${{ secrets.REGISTRY_PASSWORD_HASH }}
          LOKI_PUSH_PASSWORD: ${{ secrets.LOKI_PUSH_PASSWORD }}
          LOKI_PUSH_PASSWORD_HASH: ${{ secrets.LOKI_PUSH_PASSWORD_HASH }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          WORKER_BROKER_INTERNAL_TOKEN: ${{ secrets.WORKER_BROKER_INTERNAL_TOKEN }}
          STAND_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAND_CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          PO_LLM_API_KEY: ${{ secrets.PO_LLM_API_KEY }}
          ARCHITECT_LLM_API_KEY: ${{ secrets.ARCHITECT_LLM_API_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          never_upload="${RUNNER_TEMP}/stand-acceptance-never-upload"
          mkdir -p "${never_upload}"
          canary="$(uuidgen)"
          printf '%s\n' "${canary}" > "${never_upload}/run.log"
          export STAND_ACCEPTANCE_CANARY="${canary}"
          if python3 -m scripts.stand_acceptance scan \
            --artifact "${never_upload}" --canary-env STAND_ACCEPTANCE_CANARY; then
            echo 'redaction canary was not detected' >&2
            exit 2
          fi
          python3 -m scripts.stand_acceptance admit \
            --artifact "${RUNNER_TEMP}/stand-acceptance" \
            --status "${RUNNER_TEMP}/stand-acceptance-admission.json" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --protected-env

      - name: Upload acceptance artifact
        if: ${{ always() && steps.final-admission.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: stand-e2e-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stand-acceptance
          if-no-files-found: error

      - name: Fail closed on incomplete acceptance evidence
        if: always()
        env:
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup-observation.outcome }}
          BUILD_OUTCOME: ${{ steps.build-evidence.outcome }}
          ADMISSION_OUTCOME: ${{ steps.final-admission.outcome }}
        run: |
          test "${HANDOFF_OUTCOME}" = "success"
          test "${CLEANUP_OUTCOME}" = "success"
          test "${BUILD_OUTCOME}" = "success"
          test "${ADMISSION_OUTCOME}" = "success"

  ttl-sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: stand
    env:
      BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v5

      - name: Sweep expired run-tagged machines
        run: |
          set -euo pipefail
          python3 -m scripts.stand_lifecycle sweep --ttl-hours 6

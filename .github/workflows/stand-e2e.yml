name: Stand e2e

# The run list should say what was run without opening anything.
run-name: Stand e2e ${{ inputs.suite }}${{ inputs.suite == 'custom' && format(' ({0})', inputs.target) || '' }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'What to run'
        required: true
        default: 'mega'
        type: choice
        options:
          - mega
          - llm
          - matrix
          - custom
      target:
        description: 'pytest target, when suite is custom'
        required: false
        type: string
      worker:
        description: 'Coding agent (ignored by mega and matrix)'
        required: false
        default: 'claude'
        type: choice
        options:
          - claude
          - codex
      qa:
        description: 'QA executor (ignored by mega and matrix)'
        required: false
        default: 'codex'
        type: choice
        options:
          - claude
          - codex
      skip_sweep:
        description: 'Reserved for the later e2e runner; lifecycle cleanup is never skipped'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'

# One e2e at a time. They share a stand, a target server and one subscription
# per agent; two at once would fight over all three.
concurrency:
  group: stand-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: stand
    # Later cards bootstrap and run this pair. This card owns the bounded,
    # provider-neutral lifecycle only.
    timeout-minutes: 180
    env:
      STAND_RUN_TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v5

      # The suite is a named one or a pytest target; `custom` is how the second
      # kind is spelled in a dropdown, and it has to name a target.
      - name: Resolve the suite
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.suite }}" = "custom" ]; then
            if [ -z "${{ inputs.target }}" ]; then
              echo "FATAL: suite=custom needs a pytest target" >&2
              exit 1
            fi
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight ephemeral machines
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo 'SSH_PRIVATE_KEY is unset' >&2; exit 2; }
          python3 -m scripts.stand_lifecycle preflight --run-tag "${STAND_RUN_TAG}"

      - name: Create ephemeral machines
        id: create
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
        run: |
          set -euo pipefail
          trap 'python3 -m scripts.stand_lifecycle cleanup --run-tag "${STAND_RUN_TAG}" || true' EXIT INT TERM
          python3 -m scripts.stand_lifecycle create --run-tag "${STAND_RUN_TAG}" --manifest machines.json --ttl-hours 6
          python3 -c '
          import json
          from pathlib import Path
          machines = json.loads(Path("machines.json").read_text())["machines"]
          values = {machine["role"] + "_ip": machine["ip"] for machine in machines}
          values.update({machine["role"] + "_id": machine["id"] for machine in machines})
          with Path(__import__("os").environ["GITHUB_OUTPUT"]).open("a") as output:
              output.writelines(f"{key}={value}\n" for key, value in values.items())
          '
          trap - EXIT INT TERM

      - name: Use created endpoints
        env:
          ORCHESTRATOR_IP: ${{ steps.create.outputs.orchestrator_ip }}
          TARGET_IP: ${{ steps.create.outputs.target_ip }}
        run: |
          set -euo pipefail
          test -n "${ORCHESTRATOR_IP}"
          test -n "${TARGET_IP}"
          printf 'orchestrator=%s\ntarget=%s\n' "${ORCHESTRATOR_IP}" "${TARGET_IP}" >> "$GITHUB_STEP_SUMMARY"

      # Collected whatever the result was: a failed run is the one whose logs are
      # worth keeping, and the stand's disk is swept on a schedule.
      - name: Record machine manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stand-machines-${{ github.run_id }}
          path: machines.json
          if-no-files-found: warn

      - name: Upload the lifecycle manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stand-e2e-${{ inputs.suite }}-${{ github.run_id }}
          path: machines.json
          if-no-files-found: warn

  cleanup:
    needs: e2e
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: stand
    env:
      STAND_RUN_TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v5

      - name: Cleanup run-tagged machines
        run: |
          set -euo pipefail
          python3 -m scripts.stand_lifecycle cleanup --run-tag "${STAND_RUN_TAG}"

  ttl-sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: stand
    env:
      BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v5

      - name: Sweep expired run-tagged machines
        run: |
          set -euo pipefail
          python3 -m scripts.stand_lifecycle sweep --ttl-hours 6

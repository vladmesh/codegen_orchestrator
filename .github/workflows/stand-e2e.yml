name: Stand e2e

# The run list should say what was run without opening anything.
run-name: Stand e2e ${{ inputs.suite }}${{ inputs.suite == 'custom' && format(' ({0})', inputs.target) || '' }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'What to run'
        required: true
        default: 'mega-noop'
        type: choice
        options:
          - mega-noop
          - mega-llm
          - matrix
          - custom
      target:
        description: 'pytest target, when suite is custom'
        required: false
        type: string
      worker:
        description: 'Coding agent for mega-llm or custom only; matrix runs all four Claude/Codex pairs and mega-noop ignores it'
        required: false
        default: 'claude'
        type: choice
        options:
          - claude
          - codex
      qa:
        description: 'QA executor for mega-llm or custom only; matrix runs all four Claude/Codex pairs and mega-noop ignores it'
        required: false
        default: 'codex'
        type: choice
        options:
          - claude
          - codex
      keep_machines:
        description: 'Debug only: leave the pair and its DNS record in place so a failure can be inspected. Both still expire on the 6h sweep, and every retained hour is billed.'
        required: false
        default: false
        type: boolean
      skip_sweep:
        description: 'Reserved for the later e2e runner; lifecycle cleanup is never skipped'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'

# One e2e at a time. They share a stand, a target server and one subscription
# per agent; two at once would fight over all three.
concurrency:
  group: stand-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: stand
    # 360m > 45m provisioning + 262m runner matrix budget. The runner's 5m
    # fail-closed sweep is included; lifecycle cleanup has its own 30m job.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      STAND_RUN_TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      # One definition for every ssh and scp in this job. Several of these calls
      # wait minutes with the connection idle — provisioning runs ansible on the
      # far side and says nothing meanwhile — and an idle connection is what a
      # NAT or a load balancer drops. Run 33249511508 died that way at
      # `client_loop: send disconnect: Broken pipe` after five silent minutes.
      # Repeating the flags per call is how one call ends up without them, which
      # is why they are named once here.
      SSH_OPTS: >-
        -o StrictHostKeyChecking=accept-new
        -o BatchMode=yes
        -o ServerAliveInterval=30
        -o ServerAliveCountMax=10
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The suite is a named one or a pytest target; `custom` is how the second
      # kind is spelled in a dropdown, and it has to name a target.
      - name: Resolve the suite
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.suite }}" = "custom" ]; then
            if [ -z "${{ inputs.target }}" ]; then
              echo "FATAL: suite=custom needs a pytest target" >&2
              exit 1
            fi
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate pre-create credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m scripts.stand_credentials

      # A failed or still-running post-merge publish must cost nothing. The
      # release marker is immutable and written last by that job, so validate it
      # with the consumer's canonical contract before asking BitLaunch or DNS to
      # do anything. This does not wait: the operator should retry once the
      # post-merge worker-image publication CI has completed.
      - name: Validate exact worker image release
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
          WORKER_IMAGE_TAG: ${{ github.sha }}
          DIGEST_FILE: ${{ runner.temp }}/stand-precreate-worker-images.json
        run: |
          set -euo pipefail
          if RELEASE_VALIDATION_ONLY=true bash infra/scripts/pull-worker-images.sh; then
            exit 0
          else
            release_status=$?
          fi
          if [ "${release_status}" -eq 9 ]; then
            echo "release_not_published: the exact worker image release ${WORKER_IMAGE_TAG} is not published." >&2
            echo "Retry after the post-merge worker-image publication CI completes." >&2
            exit 1
          fi
          exit "${release_status}"

      - name: Preflight ephemeral machines
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo 'SSH_PRIVATE_KEY is unset' >&2; exit 2; }
          python3 -m scripts.stand_lifecycle preflight --run-tag "${STAND_RUN_TAG}"

      - name: Create ephemeral machines
        id: create
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
        run: |
          set -euo pipefail
          trap 'python3 -m scripts.stand_lifecycle cleanup --run-tag "${STAND_RUN_TAG}" || true' EXIT INT TERM
          python3 -m scripts.stand_lifecycle create --run-tag "${STAND_RUN_TAG}" --manifest machines.json --ttl-hours 6
          python3 -c '
          import json
          from pathlib import Path
          machines = json.loads(Path("machines.json").read_text())["machines"]
          values = {machine["role"] + "_ip": machine["ip"] for machine in machines}
          values.update({machine["role"] + "_id": machine["id"] for machine in machines})
          with Path(__import__("os").environ["GITHUB_OUTPUT"]).open("a") as output:
              output.writelines(f"{key}={value}\n" for key, value in values.items())
          '
          trap - EXIT INT TERM

      - name: Use created endpoints
        env:
          ORCHESTRATOR_IP: ${{ steps.create.outputs.orchestrator_ip }}
          TARGET_IP: ${{ steps.create.outputs.target_ip }}
        run: |
          set -euo pipefail
          test -n "${ORCHESTRATOR_IP}"
          test -n "${TARGET_IP}"
          printf 'orchestrator=%s\ntarget=%s\n' "${ORCHESTRATOR_IP}" "${TARGET_IP}" >> "$GITHUB_STEP_SUMMARY"

      # A GitHub runner pushes the generated project's images (`build-and-push` in
      # the template's ci.yml runs there, not on the target), and that runner's
      # trust store is not ours to add to. So the registry has to answer for a
      # publicly trusted certificate, which needs a name. The run creates one and
      # removes it with the machines.
      - name: Give the stand a resolvable name
        id: dns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ORCHESTRATOR_IP: ${{ steps.create.outputs.orchestrator_ip }}
        run: |
          set -euo pipefail
          name="$(python3 -m scripts.stand_dns create --run-tag "${STAND_RUN_TAG}" \
            --ip "${ORCHESTRATOR_IP}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')"
          # Caddy asks for a certificate as soon as the stack starts, and an
          # issuer that cannot resolve the name yet spends one of the week's
          # attempts on a failure.
          python3 -m scripts.stand_dns await --run-tag "${STAND_RUN_TAG}" --ip "${ORCHESTRATOR_IP}"
          echo "hostname=${name}" >> "$GITHUB_OUTPUT"
          echo "stand hostname: ${name}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare protected SSH material
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo 'SSH_PRIVATE_KEY is unset' >&2; exit 2; }
          umask 077
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_path}"

      - name: Bootstrap dynamic orchestrator
        # A new Ubuntu image still needs enough room for apt/Docker retries;
        # this bound is deliberately above the expected (not yet live-verified)
        # 2–3 minute minimal-control-plane path.
        timeout-minutes: 15
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          inventory="${RUNNER_TEMP}/stand-bootstrap.ini"
          {
            echo '[prod]'
            printf '%s ansible_user=root ansible_ssh_private_key_file=%s\n' "${PROD_HOST}" "${key_path}"
          } > "${inventory}"
          ANSIBLE_CONFIG=services/infra-service/ansible/ansible.cfg ANSIBLE_PIPELINING=True \
            uvx --from ansible-core ansible-playbook -i "${inventory}" \
            services/infra-service/ansible/playbooks/provision_stand_control_plane.yml
          rsync -a --delete --exclude .git --exclude .stand.env --exclude .stand-target.env \
            -e "ssh -i ${key_path} ${SSH_OPTS}" \
            ./ root@"${PROD_HOST}":/opt/codegen_orchestrator/
          ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" \
            'uv --version >/dev/null'

      # The compose services run as `${HOST_UID}:${HOST_GID}` and the App key is
      # bind-mounted into them read-only, so the file's owner and the process
      # reading it must be one identity. It is taken from the account bootstrap
      # created rather than from compose's 1000 default, which a cloud image may
      # have given to somebody else — the same thing production does with
      # `chown deploy:deploy /opt/secrets`.
      #
      # Its own step because the bootstrap handles secret material and may publish
      # no outputs at all; a uid is not secret, but that rule is worth more than
      # the convenience of putting this line there.
      - name: Discover the runtime identity
        id: identity
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          runtime_uid="$(ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" 'id -u deploy')"
          runtime_gid="$(ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" 'id -g deploy')"
          test -n "${runtime_uid}" && test -n "${runtime_gid}"
          echo "runtime_uid=${runtime_uid}" >> "$GITHUB_OUTPUT"
          echo "runtime_gid=${runtime_gid}" >> "$GITHUB_OUTPUT"

      - name: Render protected dynamic configuration
        env:
          ORCHESTRATOR_PUBLIC_IP: ${{ steps.create.outputs.orchestrator_ip }}
          ORCHESTRATOR_HOSTNAME: ${{ steps.dns.outputs.hostname }}
          STAND_RUN_TAG: ${{ env.STAND_RUN_TAG }}
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LK_JWT_SECRET: ${{ secrets.LK_JWT_SECRET }}
          GITHUB_ORG: ${{ secrets.GH_ORG }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_PASSWORD_HASH: ${{ secrets.REGISTRY_PASSWORD_HASH }}
          LOKI_PUSH_USER: ${{ secrets.LOKI_PUSH_USER }}
          LOKI_PUSH_PASSWORD: ${{ secrets.LOKI_PUSH_PASSWORD }}
          LOKI_PUSH_PASSWORD_HASH: ${{ secrets.LOKI_PUSH_PASSWORD_HASH }}
          LOKI_URL: http://loki:3100
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_DB_USER: ${{ secrets.GRAFANA_DB_USER }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          WORKER_BROKER_INTERNAL_TOKEN: ${{ secrets.WORKER_BROKER_INTERNAL_TOKEN }}
          STAND_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAND_CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT }}
          STAND_CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          PO_LLM_MODEL: ${{ secrets.PO_LLM_MODEL }}
          PO_LLM_BASE_URL: ${{ secrets.PO_LLM_BASE_URL }}
          PO_LLM_API_KEY: ${{ secrets.PO_LLM_API_KEY }}
          ARCHITECT_LLM_MODEL: ${{ secrets.ARCHITECT_LLM_MODEL }}
          ARCHITECT_LLM_BASE_URL: ${{ secrets.ARCHITECT_LLM_BASE_URL }}
          ARCHITECT_LLM_API_KEY: ${{ secrets.ARCHITECT_LLM_API_KEY }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          SUMMARIZATION_MODEL: ${{ secrets.SUMMARIZATION_MODEL }}
          SUMMARIZATION_MAX_TOKENS: ${{ secrets.SUMMARIZATION_MAX_TOKENS }}
          SUMMARIZATION_TRIGGER_TOKENS: ${{ secrets.SUMMARIZATION_TRIGGER_TOKENS }}
          SUMMARIZATION_MAX_SUMMARY_TOKENS: ${{ secrets.SUMMARIZATION_MAX_SUMMARY_TOKENS }}
          GITHUB_APP_PEM_PATH: /opt/secrets/github_app.pem
          HOST_UID: ${{ steps.identity.outputs.runtime_uid }}
          HOST_GID: ${{ steps.identity.outputs.runtime_gid }}
          GITHUB_APP_PRIVATE_KEY_PATH: /app/keys/github_app.pem
          LIVE_CONTOUR: stand
        run: |
          set -euo pipefail
          umask 077
          python3 -c '
          import os
          from pathlib import Path
          names = (
              "ORCHESTRATOR_PUBLIC_IP", "ORCHESTRATOR_HOSTNAME", "STAND_RUN_TAG",
              "BITLAUNCH_API_KEY", "INTERNAL_API_KEY", "POSTGRES_DB", "POSTGRES_USER",
              "POSTGRES_PASSWORD", "SECRETS_ENCRYPTION_KEY", "LK_JWT_SECRET", "GITHUB_ORG",
              "GITHUB_APP_ID", "GITHUB_APP_PEM_PATH", "GITHUB_APP_PRIVATE_KEY_PATH",
              "HOST_UID", "HOST_GID",
              "REGISTRY_USER", "REGISTRY_PASSWORD", "REGISTRY_PASSWORD_HASH", "LOKI_PUSH_USER",
              "LOKI_PUSH_PASSWORD", "LOKI_PUSH_PASSWORD_HASH", "LOKI_URL", "ADMIN_USER",
              "ADMIN_PASSWORD", "GRAFANA_DB_USER", "GRAFANA_DB_PASSWORD", "GRAFANA_ADMIN_PASSWORD",
              "WORKER_BROKER_INTERNAL_TOKEN", "STAND_CLAUDE_CODE_OAUTH_TOKEN", "STAND_CLAUDE_CODE_OAUTH_TOKEN_EXPIRES_AT", "STAND_CODEX_ACCESS_TOKEN", "PO_LLM_MODEL",
              "PO_LLM_BASE_URL", "PO_LLM_API_KEY", "ARCHITECT_LLM_MODEL", "ARCHITECT_LLM_BASE_URL",
              "ARCHITECT_LLM_API_KEY", "SUMMARIZATION_MODEL", "SUMMARIZATION_MAX_TOKENS",
              "SUMMARIZATION_TRIGGER_TOKENS", "SUMMARIZATION_MAX_SUMMARY_TOKENS", "LIVE_CONTOUR",
          )
          missing = [name for name in (*names, "GH_APP_PRIVATE_KEY") if not os.environ.get(name)]
          if missing:
              raise SystemExit("missing required stand configuration: " + ", ".join(missing))
          Path(".stand.env").write_text("\n".join(f"{name}={os.environ[name]}" for name in names) + "\n")
          Path(".stand-github-app.pem").write_text(os.environ["GH_APP_PRIVATE_KEY"])
          '

      - name: Bring up dynamic orchestrator and wait for API
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
          RUNTIME_UID: ${{ steps.identity.outputs.runtime_uid }}
          RUNTIME_GID: ${{ steps.identity.outputs.runtime_gid }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          scp -i "${key_path}" ${SSH_OPTS} .stand.env \
            root@"${PROD_HOST}":/opt/codegen_orchestrator/.env
          # Owned by the runtime user rather than by root, and no wider than
          # before: the directory stays 0700 and the key 0400. Production does the
          # same thing with `chown deploy:deploy /opt/secrets`; the stand bootstraps
          # as root and simply never did.
          ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" \
            "install -d -m 0700 -o ${RUNTIME_UID} -g ${RUNTIME_GID} /opt/secrets"
          scp -i "${key_path}" ${SSH_OPTS} .stand-github-app.pem \
            root@"${PROD_HOST}":/opt/secrets/github_app.pem
          ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" \
            "chown ${RUNTIME_UID}:${RUNTIME_GID} /opt/secrets/github_app.pem \
             && chmod 0400 /opt/secrets/github_app.pem"
          ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" '
            set -euo pipefail
            cd /opt/codegen_orchestrator
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml up -d --build --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml exec -T api alembic upgrade head
            remaining=180
            until docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml exec -T api curl -fsS http://127.0.0.1:8000/health >/dev/null; do
              test "${remaining}" -gt 0 || exit 1
              sleep 5
              remaining=$((remaining - 5))
            done
            # Migrations create the tables; the system configuration is separate
            # data, and the API refuses work without it. A stand that skipped this
            # answers `500` to the first project the suite creates, with
            # `Missing work admission config: work_admission.emergency_stop`
            # buried in its own log — which reads as a broken build rather than
            # an unseeded database.
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml"
            ${COMPOSE} exec -T api python /app/scripts/seed_system_configs.py \
              --api-base-url http://localhost:8000 \
              --configs-path /app/scripts/system_configs.yaml
            ${COMPOSE} exec -T api python /app/scripts/seed_agent_configs.py \
              --api-base-url http://localhost:8000 \
              --configs-path /app/scripts/agent_configs.yaml
          '

      - name: Register and provision dynamic target
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
          TARGET_ID: ${{ steps.create.outputs.target_id }}
          TARGET_IP: ${{ steps.create.outputs.target_ip }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          registration_input="${RUNNER_TEMP}/stand-target.json"
          target_key="${RUNNER_TEMP}/stand-target.key"
          trap 'shred -u "${registration_input}" "${target_key}" || true' EXIT INT TERM
          export REGISTRATION_INPUT_PATH="${registration_input}"
          export TARGET_KEY_PATH="${target_key}"
          python3 -c '
          import json
          import os
          from pathlib import Path
          Path(os.environ["REGISTRATION_INPUT_PATH"]).write_text(json.dumps({
              "target_id": os.environ["TARGET_ID"],
              "target_ip": os.environ["TARGET_IP"],
              "run_tag": os.environ["STAND_RUN_TAG"],
          }) + "\n")
          Path(os.environ["TARGET_KEY_PATH"]).write_text(os.environ["SSH_PRIVATE_KEY"])
          '
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          tar -C "${RUNNER_TEMP}" -cf - stand-target.json stand-target.key | \
            ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" '
            set -euo pipefail
            umask 077
            cleanup() {
              shred -u /run/stand-target.key /run/stand-target.json || true
            }
            trap cleanup EXIT INT TERM
            tar -C /run -xf -
            cd /opt/codegen_orchestrator
            INTERNAL_API_KEY=$(sed -n "s/^INTERNAL_API_KEY=//p" ./.env)
            test -n "${INTERNAL_API_KEY}"
            export INTERNAL_API_KEY
            python3 -m scripts.register_bitlaunch_target \
              --input /run/stand-target.json --ssh-private-key-file /run/stand-target.key
            target_handle=$(python3 -c "import json; from pathlib import Path; print(\"bitlaunch-\" + str(json.loads(Path(\"/run/stand-target.json\").read_text())[\"target_id\"]))")
            provisioning_started_epoch=$(date +%s)
            python3 -m scripts.request_stand_provisioning --handle "${target_handle}" --profile stand_e2e
            diagnostics_dir=/root/e2e-runs/provisioning
            mkdir -p "${diagnostics_dir}"
            wait_status=0
            python3 -m scripts.wait_stand_provisioning --handle "${target_handle}" --no-require-fresh-metrics 2>&1 | \
              tee "${diagnostics_dir}/provisioning-state.jsonl" || wait_status=$?
            if [ "${wait_status}" -eq 0 ]; then
              # Use the scheduler canonical probe, so this writes the same
              # metrics history and last_health_check evidence as the periodic
              # worker. The second observer below proves the real probe made
              # the target allocatable; it never stamps freshness itself.
              COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml"
              ${COMPOSE} exec -T -e TARGET_HANDLE="${target_handle}" scheduler python -m src.stand_health_probe
              python3 -m scripts.wait_stand_provisioning --handle "${target_handle}" 2>&1 | \
                tee -a "${diagnostics_dir}/provisioning-state.jsonl" || wait_status=$?
              if [ "${wait_status}" -eq 0 ]; then
                printf "{\"event\":\"first_health_ready\",\"seconds\":%s}\n" \
                  "$(( $(date +%s) - provisioning_started_epoch ))" | \
                  tee -a "${diagnostics_dir}/provisioning-state.jsonl"
              fi
            fi
            # Collected for a provisioning that succeeded as well as one that
            # failed. "Did the qa_identity role run on the host this row calls
            # complete" is a question about a *successful* provisioning, and
            # infra-service — which logs the recap of each play and the
            # closing report of that play — is the only place that answers it;
            # run 33718999040 had to be argued about without it. Same helper and
            # same protected-name allow-list as every other tail that leaves
            # this host, and every byte of the file comes out of the redaction
            # path: a pipe that did not complete publishes the stated reason
            # instead of its input.
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml"
            protected_names="INTERNAL_API_KEY POSTGRES_PASSWORD SECRETS_ENCRYPTION_KEY LK_JWT_SECRET REGISTRY_PASSWORD REGISTRY_PASSWORD_HASH LOKI_PUSH_PASSWORD LOKI_PUSH_PASSWORD_HASH ADMIN_PASSWORD GRAFANA_DB_PASSWORD GRAFANA_ADMIN_PASSWORD WORKER_BROKER_INTERNAL_TOKEN PO_LLM_API_KEY ARCHITECT_LLM_API_KEY"
            services_out="${diagnostics_dir}/provisioning-services.log"
            services_partial="${services_out}.partial"
            rm -f "${services_partial}"
            if ${COMPOSE} logs --no-color --tail 300 infra-service scheduler 2>&1 | \
              ${COMPOSE} exec -T -e STAND_DIAGNOSTIC_SECRET_NAMES="${protected_names}" api \
              python -c "import os,sys; from shared.diagnostics import redact_diagnostic; names=os.environ.get(\"STAND_DIAGNOSTIC_SECRET_NAMES\", \"\").split(); secrets=tuple(os.environ.get(name, \"\") for name in names); sys.stdout.write(\"\".join(redact_diagnostic(line, secrets=secrets) for line in sys.stdin))" \
              > "${services_partial}"; then
              mv "${services_partial}" "${services_out}"
            else
              printf "%s\n" "the provisioning service tails were not collected: the redaction path did not complete, so no unredacted service output is published (provisioning wait status: ${wait_status})" \
                > "${services_out}"
              rm -f "${services_partial}"
            fi
            if [ "${wait_status}" -ne 0 ]; then
              exit "${wait_status}"
            fi
          '

      - name: Provide worker base images on the stand
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          release_sha="${GITHUB_SHA}"
          echo "worker image release candidate: ${release_sha}"
          printf '%s\n' "${GHCR_TOKEN}" | ssh -i "${key_path}" ${SSH_OPTS} \
            root@"${PROD_HOST}" \
            "IFS= read -r GHCR_TOKEN && export GHCR_TOKEN && \
             cd /opt/codegen_orchestrator && \
             GHCR_OWNER='${GHCR_OWNER}' WORKER_IMAGE_TAG='${release_sha}' \
             DIGEST_FILE=/opt/codegen_orchestrator/deployed-worker-images.json \
             bash infra/scripts/pull-worker-images.sh" || pulled=$?
          if [ "${pulled:-0}" -ne 0 ]; then
            echo "FATAL: pulling the worker image release failed after pre-create validation (exit ${pulled})" >&2
            exit "${pulled}"
          fi

      # The runner is the single owner of named-suite and custom-target
      # semantics.  Its non-zero result is held until the safe handoff has been
      # collected, then restored below so a suite failure remains the e2e result.
      - name: Run selected stand suite
        id: suite-run
        if: success()
        continue-on-error: true
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
          SUITE: ${{ steps.suite.outputs.value }}
          WORKER: ${{ inputs.worker }}
          QA: ${{ inputs.qa }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          remote_command=$(printf 'cd /opt/codegen_orchestrator && uv run python scripts/stand_run.py --suite %q --worker %q --qa %q' "${SUITE}" "${WORKER}" "${QA}")
          ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" "${remote_command}" \
            >"${RUNNER_TEMP}/remote-invocation.log" 2>&1

      # Copy only the runner's public reports.  This short-lived handoff is how
      # the fresh cleanup runner can build the one final acceptance artifact.
      - name: Record machine manifest
        if: always()
        env:
          PROD_HOST: ${{ steps.create.outputs.orchestrator_ip }}
          SUITE: ${{ steps.suite.outputs.value }}
          WORKER: ${{ inputs.worker }}
          QA: ${{ inputs.qa }}
          SUITE_OUTCOME: ${{ steps.suite-run.outcome }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/stand-e2e-handoff"
          run_dir="${evidence_dir}/run"
          mkdir -p "${run_dir}"
          # What this step actually observed about the service-tail collection.
          # The fallback below may state a missing piece, but it may not assert a
          # cause nobody here observed, so the account is built where the attempt
          # happens rather than inferred from the absent file.
          services_attempt="no collection was attempted, because no stand host address was recorded for this run"
          # Whether this run owes a target-host snapshot, and what happened to
          # it, are recorded where the attempt is made — never inferred from the
          # absent file below.
          target_required=no
          target_attempt="no snapshot was attempted, because no stand host address was recorded for this run"
          test -f machines.json && cp machines.json "${evidence_dir}/machines.json" || true
          test -f "${RUNNER_TEMP}/remote-invocation.log" && \
            cp "${RUNNER_TEMP}/remote-invocation.log" "${run_dir}/remote-invocation.log" || true
          key_path="${RUNNER_TEMP}/stand-bootstrap.key"
          if [ -n "${PROD_HOST}" ]; then
            # Provisioning diagnostics live outside `latest`: pytest owns that
            # symlink and never creates it when target setup fails first.
            ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" '
              set -euo pipefail
              files=()
              if [ -d /root/e2e-runs/provisioning ]; then
                cd /root/e2e-runs/provisioning
                for name in provisioning-state.jsonl provisioning-services.log; do
                  test ! -f "${name}" || files+=("${name}")
                done
              fi
              if [ "${#files[@]}" -eq 0 ]; then
                tar -cf - --files-from=/dev/null
              else
                tar -cf - -- "${files[@]}"
              fi
            ' | tar -C "${run_dir}" -xf -

            if ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" '
              if [ -d /root/e2e-runs/latest ]; then exit 0; else exit 1; fi
            '; then
              reports=(junit.xml report.tsv run.log)
              if [ "${SUITE}" = "matrix" ]; then
                reports+=(claude-claude.log claude-codex.log codex-claude.log codex-codex.log)
              else
                # A named single-cell suite and a custom target produce exactly
                # the pair the runner was asked for. Trying all matrix filenames
                # here made scp wait on three files that cannot exist (21 seconds
                # in run 33446639363), obscuring rather than improving evidence.
                reports+=("${QA}-${WORKER}.log")
              fi
              for name in "${reports[@]}"; do
                scp -i "${key_path}" ${SSH_OPTS} \
                  root@"${PROD_HOST}":/root/e2e-runs/latest/"${name}" "${run_dir}/${name}" || true
              done
              # The pytest fixture writes bounded, redacted worker evidence and
              # its own debug dumps into the runner directory before cleanup
              # removes its containers. The dumps used to be written under the
              # checkout and died with the host, so a failed paid run left no
              # post-mortem at all.
              ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" \
                'bash -s /root/e2e-runs/latest' \
                < scripts/stand_collect_run_evidence.sh | tar -C "${run_dir}" -xf -
            fi

            # A suite that failed after provisioning succeeded gets the same
            # redacted service tails the provisioning-failure branch already
            # collects: the same helper, the same protected-name allow-list, and
            # nothing unredacted crossing the boundary. Without them a paid
            # failure is diagnosed from an acceptance artifact alone, against a
            # host that no longer exists.
            if [ "${SUITE_OUTCOME}" != "success" ]; then
              if ssh -i "${key_path}" ${SSH_OPTS} root@"${PROD_HOST}" '
                set -euo pipefail
                cd /opt/codegen_orchestrator
                COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stand.yml"
                protected_names="INTERNAL_API_KEY POSTGRES_PASSWORD SECRETS_ENCRYPTION_KEY LK_JWT_SECRET REGISTRY_PASSWORD REGISTRY_PASSWORD_HASH LOKI_PUSH_PASSWORD LOKI_PUSH_PASSWORD_HASH ADMIN_PASSWORD GRAFANA_DB_PASSWORD GRAFANA_ADMIN_PASSWORD WORKER_BROKER_INTERNAL_TOKEN PO_LLM_API_KEY ARCHITECT_LLM_API_KEY"
                out=/root/e2e-runs/suite-services.log
                partial="${out}.partial"
                rm -f "${partial}"
                # Every byte of this file leaves the redaction helper: the tails
                # are piped straight into it, and a run that could not complete
                # that pipe publishes the stated reason instead of the input.
                if ${COMPOSE} logs --no-color --tail 300 \
                     scheduler engineering-worker worker-manager worker-broker api \
                     qa-worker deploy-worker 2>&1 | \
                   ${COMPOSE} exec -T -e STAND_DIAGNOSTIC_SECRET_NAMES="${protected_names}" api \
                   python -c "import os,sys; from shared.diagnostics import redact_diagnostic; names=os.environ.get(\"STAND_DIAGNOSTIC_SECRET_NAMES\", \"\").split(); secrets=tuple(os.environ.get(name, \"\") for name in names); sys.stdout.write(\"\".join(redact_diagnostic(line, secrets=secrets) for line in sys.stdin))" \
                   > "${partial}"; then
                  mv "${partial}" "${out}"
                else
                  printf "%s\n" "service log tails were not collected: the redaction path did not complete, so no unredacted service output is published" > "${out}"
                  rm -f "${partial}"
                fi
              '; then
                services_attempt="the remote collection command completed"
              else
                services_attempt="the remote collection command over ssh did not complete"
              fi
              if ! scp -i "${key_path}" ${SSH_OPTS} \
                root@"${PROD_HOST}":/root/e2e-runs/suite-services.log \
                "${run_dir}/suite-services.log"; then
                services_attempt="${services_attempt}, and copying the collected file to the runner failed"
              fi

              # The one question the orchestrator's own services cannot answer
              # is not answered from here. Whether the application container was
              # down, up but unreachable, or answering something QA rejected is
              # readable only on the target host, and only until the suite's own
              # teardown removes those containers — long before this step runs.
              # So the suite takes that snapshot inside its phase and writes
              # `target-app.log` into the runner directory the block above
              # collects from; what is left here is the fail-closed half: this
              # run's evidence is asked whether it wanted one, and a snapshot
              # that was wanted and did not arrive is named below.
              if python3 -m scripts.stand_acceptance needs-target-snapshot --run-dir "${run_dir}"; then
                target_required=yes
                if [ -f "${run_dir}/target-app.log" ]; then
                  target_attempt="the suite collected it before its own teardown"
                else
                  target_attempt="the suite asked for a target host snapshot and none reached the runner directory"
                fi
              else
                target_attempt="no snapshot was asked for by the collected run evidence"
              fi
            fi
          fi
          if [ "${SUITE_OUTCOME}" != "success" ] && [ ! -f "${run_dir}/suite-services.log" ]; then
            # Named rather than silently absent: the admission below requires
            # this file for a failed paid run. It states what this step observed
            # — which collection step failed, and whether the suite ran at all —
            # and never a cause it did not observe: an unreachable host, a
            # `docker compose exec api` that could not start and a suite that
            # never ran after a provisioning failure are three different reasons
            # for the same absent file.
            printf '%s\n' "service log tails are unavailable: ${services_attempt} (suite step outcome: ${SUITE_OUTCOME})" \
              > "${run_dir}/suite-services.log"
          fi
          if [ "${target_required}" = "yes" ] && [ ! -f "${run_dir}/target-app.log" ]; then
            # Named, not silently absent: this run's evidence asked for the
            # target host and the admission below requires the answer. It states
            # only what this step observed about the attempt.
            printf '%s\n' "the target host snapshot is unavailable: ${target_attempt} (suite step outcome: ${SUITE_OUTCOME})" \
              > "${run_dir}/target-app.log"
          fi

      # This is the admission boundary for the inter-job handoff. It derives
      # needles only from the helper's protected-value allow-list; public stand
      # routing and application configuration never becomes a redaction needle.
      - name: Admit cleanup handoff
        id: handoff-admission
        if: always()
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LK_JWT_SECRET: ${{ secrets.LK_JWT_SECRET }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_PASSWORD_HASH: ${{ secrets.REGISTRY_PASSWORD_HASH }}
          LOKI_PUSH_PASSWORD: ${{ secrets.LOKI_PUSH_PASSWORD }}
          LOKI_PUSH_PASSWORD_HASH: ${{ secrets.LOKI_PUSH_PASSWORD_HASH }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          WORKER_BROKER_INTERNAL_TOKEN: ${{ secrets.WORKER_BROKER_INTERNAL_TOKEN }}
          STAND_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAND_CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          PO_LLM_API_KEY: ${{ secrets.PO_LLM_API_KEY }}
          ARCHITECT_LLM_API_KEY: ${{ secrets.ARCHITECT_LLM_API_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          never_upload="${RUNNER_TEMP}/stand-e2e-never-upload"
          mkdir -p "${never_upload}"
          canary="$(uuidgen)"
          printf '%s\n' "${canary}" > "${never_upload}/run.log"
          export STAND_ACCEPTANCE_CANARY="${canary}"
          if python3 -m scripts.stand_acceptance scan \
            --artifact "${never_upload}" --canary-env STAND_ACCEPTANCE_CANARY; then
            echo 'redaction canary was not detected' >&2
            exit 2
          fi
          python3 -m scripts.stand_acceptance admit \
            --artifact "${RUNNER_TEMP}/stand-e2e-handoff" \
            --status "${RUNNER_TEMP}/stand-e2e-handoff-admission.json" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --protected-env

      - name: Upload cleanup handoff
        if: ${{ always() && steps.handoff-admission.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: stand-e2e-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stand-e2e-handoff
          if-no-files-found: error

      - name: Preserve suite result
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite-run.outcome }}
        run: |
          test "${SUITE_OUTCOME}" != "failure"

  cleanup:
    needs: e2e
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: stand
    timeout-minutes: 30
    env:
      STAND_RUN_TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7

      - name: Download cleanup handoff
        id: handoff
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: stand-e2e-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stand-e2e-handoff

      # Retention is bounded by the sweep below, which now takes the record as
      # well as the machines: leaving a name pointing at an address the provider
      # will reassign is the one way retention could outlive the run that owns it.
      - name: Retain the pair for inspection
        if: ${{ always() && inputs.keep_machines }}
        run: |
          set -euo pipefail
          {
            echo '### Pair retained for inspection'
            echo
            echo "Run tag \`${STAND_RUN_TAG}\`. Billed until removed; the 6h sweep takes both."
            echo
            echo 'Remove early with:'
            echo '```'
            echo "python3 -m scripts.stand_lifecycle cleanup --run-tag ${STAND_RUN_TAG}"
            echo "python3 -m scripts.stand_dns cleanup --run-tag ${STAND_RUN_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the run's DNS record
        if: ${{ always() && !inputs.keep_machines }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Derived from the run tag alone, so this needs nothing the run may
          # have failed to publish.
          python3 -m scripts.stand_dns cleanup --run-tag "${STAND_RUN_TAG}"

      - name: Cleanup and observe run-tagged machines
        id: cleanup-observation
        if: ${{ always() && !inputs.keep_machines }}
        continue-on-error: true
        run: |
          set -euo pipefail
          handoff_dir="${RUNNER_TEMP}/stand-e2e-handoff"
          mkdir -p "${handoff_dir}"
          python3 -m scripts.stand_lifecycle cleanup-report \
            --run-tag "${STAND_RUN_TAG}" --output "${handoff_dir}/cleanup.json"

      - name: Build final acceptance evidence
        id: build-evidence
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m scripts.stand_acceptance build \
            --manifest "${RUNNER_TEMP}/stand-e2e-handoff/machines.json" \
            --run-dir "${RUNNER_TEMP}/stand-e2e-handoff/run" \
            --cleanup "${RUNNER_TEMP}/stand-e2e-handoff/cleanup.json" \
            --output "${RUNNER_TEMP}/stand-acceptance"

      - name: Admit final artifact
        id: final-admission
        if: always()
        env:
          BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          LK_JWT_SECRET: ${{ secrets.LK_JWT_SECRET }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_PASSWORD_HASH: ${{ secrets.REGISTRY_PASSWORD_HASH }}
          LOKI_PUSH_PASSWORD: ${{ secrets.LOKI_PUSH_PASSWORD }}
          LOKI_PUSH_PASSWORD_HASH: ${{ secrets.LOKI_PUSH_PASSWORD_HASH }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_DB_PASSWORD: ${{ secrets.GRAFANA_DB_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          WORKER_BROKER_INTERNAL_TOKEN: ${{ secrets.WORKER_BROKER_INTERNAL_TOKEN }}
          STAND_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAND_CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          PO_LLM_API_KEY: ${{ secrets.PO_LLM_API_KEY }}
          ARCHITECT_LLM_API_KEY: ${{ secrets.ARCHITECT_LLM_API_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          never_upload="${RUNNER_TEMP}/stand-acceptance-never-upload"
          mkdir -p "${never_upload}"
          canary="$(uuidgen)"
          printf '%s\n' "${canary}" > "${never_upload}/run.log"
          export STAND_ACCEPTANCE_CANARY="${canary}"
          if python3 -m scripts.stand_acceptance scan \
            --artifact "${never_upload}" --canary-env STAND_ACCEPTANCE_CANARY; then
            echo 'redaction canary was not detected' >&2
            exit 2
          fi
          python3 -m scripts.stand_acceptance admit \
            --artifact "${RUNNER_TEMP}/stand-acceptance" \
            --status "${RUNNER_TEMP}/stand-acceptance-admission.json" \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --protected-env

      - name: Upload acceptance artifact
        if: ${{ always() && steps.final-admission.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: stand-e2e-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stand-acceptance
          if-no-files-found: error

      - name: Fail closed on incomplete acceptance evidence
        if: always()
        env:
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup-observation.outcome }}
          BUILD_OUTCOME: ${{ steps.build-evidence.outcome }}
          ADMISSION_OUTCOME: ${{ steps.final-admission.outcome }}
        run: |
          test "${HANDOFF_OUTCOME}" = "success"
          test "${CLEANUP_OUTCOME}" = "success"
          test "${BUILD_OUTCOME}" = "success"
          test "${ADMISSION_OUTCOME}" = "success"

  ttl-sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: stand
    env:
      BITLAUNCH_API_KEY: ${{ secrets.BITLAUNCH_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out lifecycle code
        uses: actions/checkout@v7

      - name: Sweep expired run-tagged machines
        run: |
          set -euo pipefail
          python3 -m scripts.stand_lifecycle sweep --ttl-hours 6
          # The machines are what expire; their names have to go with them, or a
          # retained run leaves a hostname that later resolves to somebody else's
          # address.
          python3 -m scripts.stand_dns sweep --ttl-hours 6

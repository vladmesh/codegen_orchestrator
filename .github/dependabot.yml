version: 2

# Without this file nothing opens pull requests and the alerts just accumulate:
# 53 of them had piled up on the two frontends before it existed.
#
# Security updates arrive regardless of the schedule below. The weekly runs are
# for ordinary version drift, grouped so a bump is one review rather than thirty.
updates:
  - package-ecosystem: npm
    directories:
      - /services/admin-frontend
      - /services/user-dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # A frontend has no runtime of its own to break: the build either passes
      # or it does not, so patches ride together.
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 makes typescript-eslint refuse to load, so linting stops
      # working entirely. Drop this once typescript-eslint supports TS >= 7.1:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Our own workspace members. Unrelated PyPI packages share some of these
      # names, so Dependabot tries to pin a member to the PyPI version and uv
      # can never resolve it (scheduler, scaffolder in run 38420183278). Every
      # member is listed: tests/unit/test_dependabot_ignores_workspace.py.
      - dependency-name: api
      - dependency-name: langgraph-orchestrator
      - dependency-name: telegram-bot
      - dependency-name: scheduler
      - dependency-name: worker-manager
      - dependency-name: infra-service
      - dependency-name: scaffolder
      - dependency-name: worker-wrapper

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

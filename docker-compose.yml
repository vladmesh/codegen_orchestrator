services:
  # === Application Services ===

  api:
    image: codegen-orchestrator/api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      LK_JWT_SECRET: ${LK_JWT_SECRET}
      QA_EXECUTOR_AGENT_TYPE: ${QA_EXECUTOR_AGENT_TYPE:-codex}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health" ]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 5s
    networks:
      - internal
    volumes:
      - ./services/api/src:/app/src:delegated
      - ./services/api/alembic.ini:/app/alembic.ini:ro
      - ./services/api/migrations:/app/migrations:delegated
      - ./shared:/app/shared:delegated
      - ./scripts:/app/scripts:ro
      - ${GITHUB_APP_PEM_PATH:-./secrets/github_app.pem}:/app/keys/github_app.pem:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  langgraph:
    image: codegen-orchestrator/langgraph:local
    build:
      context: .
      dockerfile: services/langgraph/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      PYTHONPYCACHEPREFIX: /tmp/pycache
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      DEFAULT_AGENT_TYPE: ${DEFAULT_AGENT_TYPE:-claude}
      GITHUB_ORG: ${GITHUB_ORG}
      PO_LLM_MODEL: ${PO_LLM_MODEL:-}
      PO_LLM_BASE_URL: ${PO_LLM_BASE_URL:-}
      PO_LLM_API_KEY: ${PO_LLM_API_KEY:-}
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?options=-c%20search_path%3Dlanggraph
      SUMMARIZATION_MODEL: ${SUMMARIZATION_MODEL}
      SUMMARIZATION_MAX_TOKENS: ${SUMMARIZATION_MAX_TOKENS}
      SUMMARIZATION_TRIGGER_TOKENS: ${SUMMARIZATION_TRIGGER_TOKENS}
      SUMMARIZATION_MAX_SUMMARY_TOKENS: ${SUMMARIZATION_MAX_SUMMARY_TOKENS}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: langgraph
    volumes:
      - ./services/langgraph/src:/app/src:delegated
      - ./shared:/app/shared:delegated
      - ${GITHUB_APP_PEM_PATH:-./secrets/github_app.pem}:/app/keys/github_app.pem:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # Phase 4 Workers
  deploy-worker:
    image: codegen-orchestrator/langgraph:local
    build:
      context: .
      dockerfile: services/langgraph/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: python -m src.consumers.deploy
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      ORCHESTRATOR_HOSTNAME: ${ORCHESTRATOR_HOSTNAME}
      REGISTRY_USER: ${REGISTRY_USER}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: deploy-worker
    volumes:
      - ./services/langgraph/src:/app/src:delegated
      - ./shared:/app/shared:delegated
      - ${GITHUB_APP_PEM_PATH:-./secrets/github_app.pem}:/app/keys/github_app.pem:ro
    depends_on:
      - api
      - redis
    networks:
      - internal
    restart: unless-stopped
    deploy:
      replicas: 1

  qa-worker:
    image: codegen-orchestrator/langgraph:local
    build:
      context: .
      dockerfile: services/langgraph/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: python -m src.consumers.qa
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: qa-worker
      # Exploratory QA is performed by a central ephemeral coding agent started
      # through worker-manager on this host. Its subscription session is
      # HOST_CLAUDE_DIR / HOST_CODEX_HOME, mounted into that container by
      # worker-manager — this service never holds it, and no deploy target ever
      # sees it.
      QA_EXECUTOR_AGENT_TYPE: ${QA_EXECUTOR_AGENT_TYPE:-codex}
      # How that container addresses this service's per-run capability endpoint.
      # It must be this service's name on the worker network below.
      QA_CAPABILITY_HOST: ${QA_CAPABILITY_HOST:-qa-worker}
      # Optional API fallback, read only after the assigned executor has failed.
      # Empty is a valid production configuration.
      QA_LLM_MODEL: ${QA_LLM_MODEL:-}
      QA_LLM_BASE_URL: ${QA_LLM_BASE_URL:-}
      QA_LLM_API_KEY: ${QA_LLM_API_KEY:-}
      # The QA Telegram account lives here and nowhere else.
      TELETHON_API_ID: ${TELETHON_API_ID:-}
      TELETHON_API_HASH: ${TELETHON_API_HASH:-}
      TELETHON_SESSION: ${TELETHON_SESSION:-}
    volumes:
      - ./services/langgraph/src:/app/src:delegated
      - ./shared:/app/shared:delegated
    depends_on:
      - api
      - redis
    networks:
      # `internal` is how this service reaches the API and Redis. `qa_egress` is
      # the only thing the QA executor's container can see of the platform: one
      # per-run endpoint, on an ephemeral port, holding no credential of its own.
      # That network has no route off itself, so the endpoint is the executor's
      # only way to the deployment — see the `qa_egress` definition below.
      - internal
      - qa_egress
    restart: unless-stopped
    deploy:
      replicas: 1

  engineering-worker:
    image: codegen-orchestrator/langgraph:local
    build:
      context: .
      dockerfile: services/langgraph/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: python -m src.consumers.engineering
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      GITHUB_ORG: ${GITHUB_ORG}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      ORCHESTRATOR_HOSTNAME: ${ORCHESTRATOR_HOSTNAME}
      REGISTRY_USER: ${REGISTRY_USER}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: engineering-worker
    volumes:
      - ./services/langgraph/src:/app/src:delegated
      - ./shared:/app/shared:delegated
      - ${GITHUB_APP_PEM_PATH:-./secrets/github_app.pem}:/app/keys/github_app.pem:ro
    depends_on:
      - api
      - redis
    networks:
      - internal
    restart: unless-stopped
    deploy:
      replicas: 1

  architect:
    image: codegen-orchestrator/langgraph:local
    build:
      context: .
      dockerfile: services/langgraph/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    command: python -m src.consumers.architect
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      ARCHITECT_LLM_API_KEY: ${ARCHITECT_LLM_API_KEY:-}
      ARCHITECT_LLM_BASE_URL: ${ARCHITECT_LLM_BASE_URL:-}
      ARCHITECT_LLM_MODEL: ${ARCHITECT_LLM_MODEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: architect
    volumes:
      - ./services/langgraph/src:/app/src:delegated
      - ./shared:/app/shared:delegated
    depends_on:
      - api
      - redis
    networks:
      - internal
    restart: unless-stopped
    deploy:
      replicas: 1

  infra-service:
    image: codegen-orchestrator/infra-service:local
    build:
      context: .
      dockerfile: services/infra-service/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: infra-service
      ORCHESTRATOR_PUBLIC_IP: ${ORCHESTRATOR_PUBLIC_IP:-}
    volumes:
      - ./services/infra-service/src:/app/src:delegated
      - ./services/infra-service/ansible:/app/ansible:delegated
      - ./shared:/app/shared:delegated
    depends_on:
      - api
      - redis
    networks:
      - internal
    restart: unless-stopped

  telegram_bot:
    image: codegen-orchestrator/telegram_bot:local
    build:
      context: .
      dockerfile: services/telegram_bot/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      PYTHONPYCACHEPREFIX: /tmp/pycache
      REDIS_URL: redis://redis:6379
      DEFAULT_AGENT_TYPE: ${DEFAULT_AGENT_TYPE:-claude}
      LK_DOMAIN: ${LK_DOMAIN}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: telegram-bot
    volumes:
      - ./services/telegram_bot/src:/app/src:delegated
      - ./shared:/app/shared:delegated
    depends_on:
      - api
      - redis
    networks:
      - internal
    restart: unless-stopped

  worker-manager:
    # The only build service here without a ./shared mount, so what runs is the copy baked
    # into the image. It is named explicitly and stamped with the source hash so that
    # `make check-shared-freshness` can find the image and tell whether it is behind the
    # tree; built outside make the arg is empty and the check says so.
    image: codegen-orchestrator/worker-manager:local
    build:
      context: .
      dockerfile: services/worker-manager/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    user: root # Required for Docker daemon access (manages worker containers and networks on host)
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://api:8000
      WORKER_BROKER_URL: http://worker-broker:8001
      WORKER_BROKER_INTERNAL_TOKEN: ${WORKER_BROKER_INTERNAL_TOKEN}
      WORKER_BROKER_SESSION_TTL_SECONDS: ${WORKER_BROKER_SESSION_TTL_SECONDS:-3600}
      PYTHONPATH: /app
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: worker-manager
      # Host path for mounting .claude dir into workers
      HOST_CLAUDE_DIR: ${HOST_CLAUDE_DIR:-/home/user/.claude}
      HOST_CLAUDE_VALIDATION_PATH: /host-claude
      # Dedicated file-backed Codex profile. Never point this at the live ~/.codex.
      HOST_CODEX_HOME: ${HOST_CODEX_HOME:-}
      HOST_CODEX_VALIDATION_PATH: /host-codex
      SCAFFOLDED_WORKSPACE_PATH: /data/workspaces
      INTERNAL_NETWORK: codegen_internal
      WORKER_NETWORK: codegen_worker
      # The QA executor's network, and the only destinations its per-run egress
      # proxy opens. Empty backend lists mean the built-in defaults for the
      # assigned CLI. Worker creation fails closed if this network is not
      # internal — a QA run never starts with an unrestricted container.
      QA_EGRESS_NETWORK: codegen_qa_egress
      QA_CLAUDE_BACKEND_HOSTS: ${QA_CLAUDE_BACKEND_HOSTS:-}
      QA_CODEX_BACKEND_HOSTS: ${QA_CODEX_BACKEND_HOSTS:-}
      # This is both the Docker-host source path and the manager-visible path.
      # Keep them identical because worker containers are created through the
      # host Docker socket.
      WORKER_TRANSCRIPT_STORAGE_PATH: ${WORKER_TRANSCRIPT_HOST_PATH:-/data/worker-transcripts}
      WORKER_TRANSCRIPT_RETENTION_DAYS: ${WORKER_TRANSCRIPT_RETENTION_DAYS:-30}
      WORKER_TRANSCRIPT_MAX_BYTES: ${WORKER_TRANSCRIPT_MAX_BYTES:-5242880}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_HOST_PATH:-/data/workspaces}:/data/workspaces
      - ${WORKER_TRANSCRIPT_HOST_PATH:-/data/worker-transcripts}:${WORKER_TRANSCRIPT_HOST_PATH:-/data/worker-transcripts}
      - ${HOST_CLAUDE_DIR:-/home/user/.claude}:/host-claude:ro
      - ${HOST_CODEX_HOME:-./secrets/codex-unconfigured}:/host-codex:ro
    depends_on:
      redis:
        condition: service_healthy
      worker-broker:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  worker-broker:
    image: codegen-orchestrator/worker-broker:local
    build:
      context: .
      dockerfile: services/worker-broker/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      BROKER_INTERNAL_TOKEN: ${WORKER_BROKER_INTERNAL_TOKEN}
      WORKER_MANAGER_URL: http://worker-manager:8000
      SESSION_TTL_SECONDS: ${WORKER_BROKER_SESSION_TTL_SECONDS:-3600}
      STREAM_MAXLEN: ${WORKER_BROKER_STREAM_MAXLEN:-1000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - worker
      # Developer workers reach the broker on `worker`; a QA executor reaches it
      # on `qa_egress`, because that is the only network it is on. The broker is
      # the runtime's own control channel — it carries the run's prompt and the
      # container's output — and it is not a route to the deployment.
      - qa_egress
    restart: unless-stopped

  scheduler:
    image: codegen-orchestrator/scheduler:local
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      PYTHONPYCACHEPREFIX: /tmp/pycache
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: scheduler
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-300}
      # Loki read address for the analytics aggregator. Not the push path —
      # LOKI_PUSH_* are Promtail's write credentials. Required: without it
      # product analytics are not collected, so compose refuses to start.
      LOKI_URL: ${LOKI_URL:?set LOKI_URL to the Loki read address, e.g. http://loki:3100}
    volumes:
      - ./services/scheduler/src:/app/src:delegated
      - ./shared:/app/shared:delegated
      - ${GITHUB_APP_PEM_PATH:-./secrets/github_app.pem}:/app/keys/github_app.pem:ro
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  scaffolder:
    image: codegen-orchestrator/scaffolder:local
    build:
      context: .
      dockerfile: services/scaffolder/Dockerfile
      args:
        SOURCE_HASH: ${WORKER_SOURCE_HASH:-}
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      WORKSPACE_BASE_PATH: /data/workspaces
      GITHUB_ORG: ${GITHUB_ORG}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_NAME: scaffolder
    volumes:
      - ./services/scaffolder/src:/app/src:delegated
      - ./shared:/app/shared:delegated
      - ${GITHUB_APP_PEM_PATH:-./secrets/github_app.pem}:/app/keys/github_app.pem:ro
      - ${WORKSPACE_HOST_PATH:-/data/workspaces}:/data/workspaces
      - uv-cache:/root/.cache/uv
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    deploy:
      replicas: 1

  # === Reverse Proxy + Registry ===

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      ORCHESTRATOR_HOSTNAME: ${ORCHESTRATOR_HOSTNAME}
      REGISTRY_USER: ${REGISTRY_USER}
      REGISTRY_PASSWORD_HASH: ${REGISTRY_PASSWORD_HASH}
      LOKI_PUSH_USER: ${LOKI_PUSH_USER}
      LOKI_PUSH_PASSWORD_HASH: ${LOKI_PUSH_PASSWORD_HASH}
    depends_on:
      - api
      - registry
      - loki
      - user-dashboard
    networks:
      internal:
        aliases:
          - ${ORCHESTRATOR_HOSTNAME}
    restart: unless-stopped

  registry:
    image: registry:2.8.3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - internal
    restart: unless-stopped

  # === Observability ===

  loki:
    image: grafana/loki:3.4.3
    command: -config.file=/etc/loki/loki.yml -log.format=json
    volumes:
      - ./infra/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q ready" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.3
    command: -config.file=/etc/promtail/promtail.yml -log.format=json
    volumes:
      - ./infra/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  admin-frontend:
    build:
      context: services/admin-frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # The proxy authenticates to the API on behalf of whoever passed basic auth.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  user-dashboard:
    build:
      context: services/user-dashboard
      dockerfile: Dockerfile
    ports:
      - "3003:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: "http://${ORCHESTRATOR_HOSTNAME:-localhost}:3001/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LIVE_ALLOWED_ORIGINS: "*"
      GF_INSTALL_PLUGINS: ""
      GF_PLUGINS_DISABLE_PLUGINS: "grafana-lokiexplore-app"
      GF_LOG_MODE: "console"
      GF_LOG_CONSOLE_FORMAT: "json"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # === Infrastructure ===

  db:
    image: pgvector/pgvector:0.8.6-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 5s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init-grafana-reader.sh:/docker-entrypoint-initdb.d/20-grafana-reader.sh:ro
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7.4.10-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    name: codegen_internal
  worker:
    name: codegen_worker
  # The QA executor's whole world. `internal: true` is not decoration: it is
  # what makes "exploratory QA cannot write to the application" a fact about
  # routing rather than a rule in a prompt. A container attached to this and to
  # nothing else cannot reach the deployment's public URL, the fleet, or the
  # internet — only the two services attached here, and the run's own egress
  # proxy, which opens the assigned CLI's model backend and nothing else.
  # worker-manager refuses to start a QA executor if this network is missing or
  # is not internal.
  qa_egress:
    name: codegen_qa_egress
    internal: true

volumes:
  db_data:
  redis_data:
  caddy-data:
  caddy-config:
  registry-data:
  uv-cache:
  loki-data:
  grafana-data:

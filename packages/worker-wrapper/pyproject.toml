[project]
name = "worker-wrapper"
version = "0.1.0"
description = "Generic wrapper for executing worker agents"
authors = [{name = "Antigravity", email = "antigravity@gemini.google.com"}]
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",

    # Dependencies of the broker client and the shared contracts/logging modules
    # explicitly copied into the worker image.
    "pgvector>=0.2.5",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pynacl>=1.5.0",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=43.0.0",
]
requires-python = ">=3.12"

[project.scripts]
worker-wrapper = "worker_wrapper.main:run_main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

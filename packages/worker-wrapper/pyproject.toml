[project]
name = "worker-wrapper"
version = "0.1.0"
description = "Generic wrapper for executing worker agents"
authors = [{name = "Antigravity", email = "antigravity@gemini.google.com"}]
dependencies = [
    "redis>=8.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",

    # shared/ deps. The worker base image COPY's the whole shared tree and
    # installs nothing for it, so every module under shared/ has to be importable
    # from the deps declared here.
    "pgvector>=0.2.5",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pynacl>=1.5.0",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=50.0.0",
]
requires-python = ">=3.12"

[project.scripts]
worker-wrapper = "worker_wrapper.main:run_main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

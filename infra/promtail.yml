server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      # Orchestrator compose services
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=codegen_orchestrator"]
      # Platform compose services on the same Docker daemon
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=codegen_platform"]
      # Worker containers spawned by worker-manager
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.codegen.type=worker"]

    relabel_configs:
      # Explicit job label (docker_sd_configs doesn't set it automatically)
      - replacement: docker
        target_label: job
      # Distinguish compose projects sharing the host
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      # Compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      # Worker ID (for worker containers)
      - source_labels: ['__meta_docker_container_label_com_codegen_worker_id']
        target_label: worker_id
      # Container type: "worker" or empty (orchestrator)
      - source_labels: ['__meta_docker_container_label_com_codegen_type']
        target_label: container_type

    pipeline_stages:
      # Parse Docker JSON log wrapper
      - docker: {}

      # All services now emit JSON logs — single parser for everything
      - json:
          expressions:
            service: service
            level: level

      # Normalize "warn" → "warning" (Go services use "warn")
      - replace:
          expression: '(^warn$)'
          source: level
          replace: warning

      # The registry logs every 404 for a manifest, blob or repository that is not pushed
      # yet at error level; that miss is the expected answer to a lookup, so it ships as info.
      - match:
          selector: '{compose_service="registry"}'
          stages:
            - json:
                expressions:
                  status: '"http.response.status"'
                  err_code: '"err.code"'
            - template:
                source: level
                template: >-
                  {{ if and (eq (print .status) "404")
                  (eq (print .err_code) "manifest unknown" "blob unknown" "name unknown")
                  }}info{{ else if .Value }}{{ .Value }}{{ end }}

      # Add extracted fields as labels
      - labels:
          service:
          level:

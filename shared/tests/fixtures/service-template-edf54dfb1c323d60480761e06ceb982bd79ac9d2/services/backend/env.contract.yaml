version: "1"
owner: backend
entries:
  PORT:
    source: derived
    environments: [local, production]
    consumers: [backend]
    required: false
  ENABLED_MODULES:
    source: derived
    environments: [local, production]
    consumers: [backend]
    required: false
  SQLALCHEMY_SYNC_DRIVER:
    source: literal
    environments: [local, production]
    consumers: [backend]
    required: false
    value: postgresql+psycopg
  SQLALCHEMY_ASYNC_DRIVER:
    source: literal
    environments: [local, production]
    consumers: [backend]
    required: false
    value: postgresql+asyncpg
  DATABASE_URL:
    source: user_secret
    environments: [local, production]
    consumers: [backend]
    required: false
    description: Optional synchronous database URL override
  ASYNC_DATABASE_URL:
    source: user_secret
    environments: [local, production]
    consumers: [backend]
    required: false
    description: Optional asynchronous database URL override
  APP_NAME:
    source: derived
    environments: [local, production]
    consumers: [backend]
    required: true
  APP_ENV:
    source: derived
    environments: [local, production]
    consumers: [backend]
    required: true
  APP_SECRET_KEY:
    source: generated_secret
    environments: [local, production]
    consumers: [backend]
    required: true
  USERS_GRANT_CAPABILITY:
    source: generated_secret
    environments: [local, production]
    consumers: [backend]
    required: true
    description: >-
      Per-project user-write capability. Present it as the single X-Grant-Capability
      request header for POST /users/grant and POST /users/revoke; its value is
      generated and persisted only by the deployment secret resolver.
  DEBUG:
    source: literal
    environments: [local]
    consumers: [backend]
    required: true
    value: true
  BACKEND_PORT:
    source: allocation
    environments: [local, production]
    consumers: [backend]
    required: true
    service: backend
  BACKEND_IMAGE:
    source: derived
    environments: [local, production]
    consumers: [backend]
    required: true
  POSTGRES_HOST:
    source: literal
    environments: [local, production]
    consumers: [backend]
    required: true
    value: db
  POSTGRES_PORT:
    source: literal
    environments: [local, production]
    consumers: [backend]
    required: true
    value: 5432
  POSTGRES_DB:
    source: derived
    environments: [local, production]
    consumers: [backend]
    required: true
  POSTGRES_USER:
    source: literal
    environments: [local, production]
    consumers: [backend]
    required: true
    value: postgres
  POSTGRES_PASSWORD:
    source: generated_secret
    environments: [local, production]
    consumers: [backend]
    required: true
  POSTGRES_REQUIRE_SSL:
    source: literal
    environments: [local, production]
    consumers: [backend]
    required: true
    value: false

  BACKEND_API_URL:
    source: literal
    environments: [local, production]
    consumers: [tg_bot, notifications_worker]
    required: true
    value: http://backend:8000


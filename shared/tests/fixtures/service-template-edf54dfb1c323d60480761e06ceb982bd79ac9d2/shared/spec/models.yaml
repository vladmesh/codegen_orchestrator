models:
  User:
    fields:
      id:
        type: int
        readonly: true
      status:
        type:
          type: enum
          values: [active, inactive]
        default: inactive
      created_at:
        type: datetime
        readonly: true
      updated_at:
        type: datetime
        readonly: true
  UserChannel:
    fields:
      id:
        type: int
        readonly: true
      user_id:
        type: int
        readonly: true
      channel:
        type: string
        min_length: 1
      external_id:
        type: string
        min_length: 1
      created_at:
        type: datetime
        readonly: true
      updated_at:
        type: datetime
        readonly: true
  UserGrant:
    fields:
      channel:
        type: string
        min_length: 1
      external_id:
        type: string
        min_length: 1

  UserRevoke:
    fields:
      channel:
        type: string
        min_length: 1
      external_id:
        type: string
        min_length: 1

  UserAccess:
    fields:
      user_id:
        type: int
      status:
        type:
          type: enum
          values: [active, inactive]
      channel:
        type: string
      external_id:
        type: string

  CommandReceived:
    fields:
      command:
        type: string
      args:
        type: list[string]
      user_id:
        type: int
      timestamp:
        type: datetime
    variants:
      Create:
        optional: [timestamp]

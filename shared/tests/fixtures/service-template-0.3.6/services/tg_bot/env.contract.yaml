version: "1"
owner: tg_bot
entries:
  TG_BOT_IMAGE:
    source: derived
    environments: [local, production]
    consumers: [tg_bot]
    required: true
  TELEGRAM_BOT_TOKEN:
    source: user_secret
    environments: [local, production]
    consumers: [tg_bot]
    required: true
    description: Telegram bot API token
  USERS_GRANT_CAPABILITY:
    source: generated_secret
    environments: [local, production]
    consumers: [tg_bot]
    required: true
    description: >-
      Generated capability for the internal users.grant endpoint. The production
      value is generated and persisted by the orchestrator secret resolver.
  TG_BOT_TEST_TELEGRAM_ID:
    source: literal
    value: ""
    environments: [local, production]
    consumers: [tg_bot]
    required: false
    description: >-
      A single extra Telegram id admitted temporarily so a private bot can be tested.
      Kept separate from the product audience; removing the value revokes the access.

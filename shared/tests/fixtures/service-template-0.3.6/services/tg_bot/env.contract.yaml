version: "1"
owner: tg_bot
entries:
  TG_BOT_IMAGE:
    source: derived
    environments: [local, production]
    consumers: [tg_bot]
    required: true
  TELEGRAM_BOT_TOKEN:
    source: user_secret
    environments: [local, production]
    consumers: [tg_bot]
    required: true
    description: Telegram bot API token
  TG_BOT_ALLOWED_TELEGRAM_IDS:
    source: literal
    value: ""
    environments: [local, production]
    consumers: [tg_bot]
    required: false
    description: Comma-separated Telegram ids allowed to use the bot
  TG_BOT_TEST_TELEGRAM_ID:
    source: literal
    value: ""
    environments: [local, production]
    consumers: [tg_bot]
    required: false
    description: Temporary Telegram id for private-bot QA

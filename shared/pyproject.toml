# `shared` is not a distributable package and is never pip-installed.
# It reaches consumers as a bind-mount (compose) or a `COPY shared` (images), and
# tests import it from the repo tree. This file is the single declaration of the
# third-party dependencies that importing `shared` requires; every service that
# ships `shared` must repeat them in its own pyproject.toml, and
# shared/tests/unit/test_shared_dependency_parity.py enforces that.
[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities for codegen_orchestrator services"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0.0",
    "pgvector>=0.2.5",
    "redis[hiredis]>=8.0.0",
    "structlog>=25.1.0",
    "pynacl>=1.5.0",  # For GitHub Actions secrets encryption
    "pyyaml>=6.0",  # For loading prompt templates
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=43.0.0",
]

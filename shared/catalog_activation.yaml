# The one activated kit catalog snapshot (`shared.catalog_activation`).
#
# The PO's capability preview, the Architect's stored plan, `kit add` and the install probe all
# read the kit catalog at exactly this commit; nothing reads a live branch. The raw and semantic
# digests are the bytes and the parsed catalog of this commit, and the core and tooling are the
# kit host the catalog/planner/probe digest agreement is verified against. A reader that fetches other bytes, or runs on another host
# core or tooling, answers unavailable or inactive instead of planning.
#
# Activating another snapshot is a reviewed orchestrator change to this file: a package release
# becomes plannable then, not when the kit's default branch moves.

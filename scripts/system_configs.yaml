# System configuration values.
# Applied on every deploy (and by `make seed`): each key below is written to the
# database with the value from this file, overwriting whatever is there. Editing
# a value here is how it changes in production. A key edited through the API
# survives only until the next deploy. Keys absent from this file are owned by
# the database alone and are never touched.

# --- scheduler ---
- key: scheduler.dispatch_interval_seconds
  value: 30
  category: scheduler
  description: "Task dispatcher poll interval in seconds"

- key: scheduler.github_sync_interval
  value: 300
  category: scheduler
  description: "GitHub organization sync interval in seconds"

- key: scheduler.github_sync_missing_threshold
  value: 3
  category: scheduler
  description: "Consecutive missing repo checks before alerting"

- key: scheduler.server_sync_interval
  value: 60
  category: scheduler
  description: "Server list sync interval in seconds"

- key: scheduler.server_details_sync_interval
  value: 300
  category: scheduler
  description: "Detailed server specs sync interval in seconds"

- key: scheduler.provisioning_stuck_timeout_seconds
  value: 1800
  category: scheduler
  description: "Seconds before re-triggering stuck provisioning (30 min)"

- key: scheduler.provisioning_trigger_cooldown_seconds
  value: 120
  category: scheduler
  description: "Cooldown between provisioning trigger attempts in seconds"

- key: scheduler.scaffold_inflight_ttl
  value: 600
  category: scheduler
  description: "TTL for in-flight scaffold job markers in seconds (10 min)"

- key: scheduler.service_template_source
  value: "gh:vladmesh/service-template"
  category: scheduler
  description: "Production Copier template source"

- key: scheduler.service_template_ref
  value: "0.3.6"
  category: scheduler
  description: "Pinned service-template release tag or commit"

- key: scheduler.ssl_check_timeout
  value: 5
  category: scheduler
  description: "SSL certificate check socket timeout in seconds"

- key: scheduler.rag_summarizer_poll_interval
  value: 30
  category: scheduler
  description: "RAG summarizer poll interval in seconds"

- key: scheduler.ci_failure_max_fingerprint_attempts
  value: 2
  category: scheduler
  description: "Max fix tasks for repeated CI failure fingerprint"

- key: scheduler.ci_failure_log_excerpt_lines
  value: 40
  category: scheduler
  description: "Maximum lines retained around a failed GitHub Actions log error"

# --- supervisor ---
- key: supervisor.story_stuck_threshold_minutes
  value: 5
  category: supervisor
  description: "Minutes before a story in 'created' status is considered stuck"

- key: supervisor.task_stuck_threshold_minutes
  value: 30
  category: supervisor
  description: "Minutes before a task in 'in_dev' is considered stuck"

- key: supervisor.story_max_architect_retries
  value: 3
  category: supervisor
  description: "Max architect retry attempts for stuck stories"

- key: supervisor.story_retry_ttl
  value: 3600
  category: supervisor
  description: "Redis TTL for story retry counter in seconds (1 hour)"

- key: supervisor.qa_failure_max_fingerprint_attempts
  value: 2
  category: supervisor
  description: "Max fix attempts for one repeated QA failure fingerprint"

- key: supervisor.qa_max_fix_attempts
  value: 2
  category: supervisor
  description: "Max QA to fix cycles for one story"

- key: supervisor.resource_wait_timeout_minutes
  value: 1440
  category: supervisor
  description: "Minutes a task may wait for server capacity before human review"

- key: supervisor.resource_wait_metrics_freshness_seconds
  value: 300
  category: supervisor
  description: "Maximum age of server metrics used to resume capacity-waiting tasks"

- key: supervisor.qa_handoff_recovery_minutes
  value: 5
  category: supervisor
  description: "Minutes a queued QA run may sit unstarted before the supervisor finishes its handoff from the stored plan"

- key: supervisor.temporary_access_ttl_minutes
  value: 60
  category: supervisor
  description: "Minutes a temporary access grant may live before it is revoked by timeout"

- key: supervisor.temporary_access_revoke_stale_minutes
  value: 15
  category: supervisor
  description: "Minutes an unfinished revoke deploy may run before the revoke is re-dispatched"

- key: supervisor.temporary_access_max_revoke_attempts
  value: 3
  category: supervisor
  description: "Revoke attempts before an unrevoked temporary access is escalated to admins"

- key: supervisor.temporary_access_observation_window_minutes
  value: 5
  category: supervisor
  description: "Minutes one reading of a deployed service's environment is waited for before it is asked for again"

- key: supervisor.temporary_access_unrevoked_ttl_minutes
  value: 120
  category: supervisor
  description: "Minutes a grant may hold access before an unfinished revoke stops being an internal retry and is handed to a human"

# --- deploy ---
- key: deploy.max_deploy_fix_attempts
  value: 2
  category: deploy
  description: "Max engineering fix attempts for deploy failures"

- key: deploy.max_deploy_retries
  value: 3
  category: deploy
  description: "Max deploy failures before story is marked failed"

- key: deploy.deploy_retry_ttl
  value: 86400
  category: deploy
  description: "Redis TTL for deploy retry counter in seconds (24 hours)"

- key: deploy.deploy_lock_ttl
  value: 3600
  category: deploy
  description: "TTL for deploy lock in seconds (1 hour)"


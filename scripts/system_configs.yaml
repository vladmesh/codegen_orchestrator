# System configuration values.
# Applied on every deploy (and by `make seed`). Ordinary keys are reconciled to
# this file. Paid-work controls are initialized only when absent, so an operator
# change made through the typed API survives later deploys. Keys absent from
# this file are owned by the database alone and are never touched.

# --- scheduler ---
- key: work_admission.max_projects_per_user
  value: 3
  category: work_admission
  description: "Maximum non-archived projects for one non-admin user"

- key: work_admission.max_concurrent_paid_runs
  value: 5
  category: work_admission
  description: "Maximum queued or running engineering and QA coding-agent runs"

- key: work_admission.emergency_stop
  value: false
  category: work_admission
  description: "Operator switch that blocks new projects, engineering and QA work"

- key: work_admission.engineering_executor_override

# Platform capability manifest: what a product built by this orchestrator can and cannot have.
#
# This file is the one source of truth. `docs/PLATFORM_CAPABILITIES.md` (for people),
# `services/langgraph/src/prompts/platform_capabilities.txt` (the compact product block the PO
# reads), `platform_capabilities_architect.txt` beside it (the technical block the Architect
# reads), plus the adjacent runtime JSON, are rendered by `python -m scripts.platform_capabilities`;
# a unit test fails while any is stale, and another fails while a derived key, a secret kind or a port
# service the code supports is missing here.
#
# A pull request that changes a capability (the deployer, the secret resolver, allocations, the
# kit pin, the modules a product may request) changes this file in the same pull request, bumps
# `version` and re-renders. See AGENTS.md, "Platform capability manifest".
version: 21
status: owner-reviewed
review: product list agreed by the owner 2026-09-28

derived_from:
  kit:
    source: gh:vladmesh/codegen-product-kit
    # The commit the pinned release resolves to. The release tag itself is written down only
    # in `scripts/system_configs.yaml` (`scheduler.service_template_ref`); a test ties this
    # commit to the vendored render of that pin, so moving the pin fails until it is updated.
    commit: f7de8f96b18f79b94dcd0546905771674cf11cfa
    note: >-
      The release pinned in `scheduler.service_template_ref`. `gh:vladmesh/service-template` is
      still an admitted Copier source, but no new product is scaffolded from it.
  code:
    - services/scaffolder/src/install.py
    - services/api/src/catalog_install.py
    - services/langgraph/src/catalog_install.py
    - services/langgraph/src/subgraphs/devops/deployer.py
    - services/langgraph/src/subgraphs/devops/secret_resolver.py
    - services/langgraph/src/subgraphs/devops/deploy_workflow.py
    - services/langgraph/src/subgraphs/devops/smoke.py
    - services/langgraph/src/allocations.py
    - services/langgraph/src/consumers/deploy.py
    - services/langgraph/src/agents/po/tools_projects.py
    - services/api/src/routers/projects/access.py
    - services/infra-service/ansible/roles/security/tasks/main.yml
    - shared/contracts/service_ports.py
    - shared/contracts/env_contract.py
    - shared/contracts/dto/project.py
    - shared/contracts/dto/users_grant.py

# Product fields (`name`, `plain`, and for a limitation `why` and `workaround`) are what the PO
# and the user read: product language only, no ports, keys, addresses or storage internals.
# Everything technical lives in `how` (can) and `technical` (cannot), which only the Architect's
# block and the document carry.
can:
  - id: catalog_install
    name: Add a catalog capability
    plain: An existing bot can add a released catalog capability while retaining its own features.
    how: >-
      plan_install selects package/libraries/default binding in one INSTALL on owned clean
      core-{core_version} backend,tg_bot. Scaffolder preserves/validates files; hands exact head to
      PR/CI/deploy without engineering. Review refusals; confirm timezone.
  - id: http_self_address
    name: Plain HTTP self links
    plain: The bot can include plain HTTP self links; their address can change when the product moves.
    how: >-
      PUBLIC_BASE_URL uses one backend allocation (IPv6 bracketed); missing/ambiguous,
      loopback/unspecified/multicast refuse. IPv6 needs released executable transport at the
      built commit; unverified workflow/.rej refuses with DEPLOY_HOST. Existing products need
      reviewed kit update/reconciled merge. No domain/TLS/frontend/webhook.
  - id: telegram_bot
    name: Telegram bot
    plain: A Telegram bot people chat with, using commands, buttons and menus.
    how: >-
      Kit tg_bot uses python-telegram-bot 21.4 run_polling. Every product includes FastAPI
      backend; its allocated http://{server_ip}:{port} is the sole public port. No domain/https.
  - id: public_telegram_channels
    name: Read public Telegram channels
    plain: >-
      Read public Telegram channels for posts, digests and new-post delivery only through a
      platform-backed catalog module. Private channels and groups are not supported.
      Products must not fetch or scrape t.me, Telegram web previews or Telegram APIs for
      channel content themselves. Plan it now; deployment handles platform key issuance;
      no user key is needed.
    how: >-
      Read public Telegram channels for posts, digests and new-post delivery only through a
      platform-backed catalog module selected by live catalog capabilities. Private channels
      and groups are not supported. Products must not fetch or scrape t.me, Telegram web
      previews or Telegram APIs for channel content themselves. Platform uses its egress proxy.
      Plan it now; deployment handles key issuance; no user key is needed. Auth admin required;
      unavailable auth retries. Only stand can override declared HTTPS URLs with its fixture ingress.
  - id: stored_data
    name: The bot remembers data
    plain: The bot remembers data such as records, lists and history, and keeps it when the bot is updated.
    how: >-
      Private postgres:16 at db:5432 persists in db_data; private redis:7-alpine at redis:6379
      carries queues/caches/Redis Streams without persistence.
  - id: scheduled_work
    name: Actions on a schedule or later
    plain: The bot does things on a schedule or later, such as a daily message or a reminder in an hour.
    how: >-
      The kit core timer loop fires each timer an installed package declares, in production
      with no caller: reminders `reminders.tick` every 60 s. Other schedules need a timer
      in the product bot/backend; `POST /jobs/fire` only records/dispatches declared jobs.
      No bot job-queue extra.
  - id: user_settings
    name: Settings without a new version
    plain: The owner later changes settings, such as the list of languages or the texts, without a new version of the bot.
    how: >-
      Kit settings v1 (`POST /settings/get`, `POST /settings/set`): backend `manifest.yaml`
      declares keys; platform holds write capability and writes values.
  - id: outbound_apis
    name: Connecting to other services
    plain: >-
      The bot connects to other online services, such as AI, weather or spreadsheets, with a key
      the user provides; AI in the bot runs on the user's own key.
      Exception: Telegram channel content is read only through a platform-backed catalog module.
    how: >-
      ufw allows outgoing traffic. PO collects keys as `user_secret` via `set_project_secret`.
      Exception: Telegram channel content is read only through a platform-backed catalog module;
      outbound traffic permission does not authorize product-side channel fetching or scraping.
  - id: bot_access
    name: Who can use the bot
    plain: >-
      At first only the customer can use the bot; everyone else is ignored. The customer can
      give permanent access to specific Telegram users, and it starts working once the running
      bot confirms it. The customer can also hand the bot over to another Telegram user. Taking
      access back and opening the bot to everyone are not available yet. The owner or admin can
      retry exhausted initial deployment only when the platform offers a retry action for a failed attempt.
    how: >-
      Kit `users` resolves Telegram identities; only backend-confirmed `active` users enter.
      Worker applies/proves durable intents: `initial_owner` (first deploy), `add_user` (PO
      grant), `incoming_owner` (PO transfer). No PO revoke/public/mode-switch. Bounded owner/admin
      retry requires an admitted terminal Run; zero admissions refuse.

cannot:
  - id: web_presence
    # Merges the v4 items named in `aliases`; a brief that accepted one of them keeps its waiver.
    aliases: [https_domain, custom_domain, telegram_mini_app, web_frontend]
    detect:
      - website
      - web page
      - web interface
      - admin panel
      - admin dashboard
      - landing page
      - separate web app
      - frontend module
      - public https
      - https address
      - tls certificate
      - custom domain
      - own domain
      - public domain
      - telegram mini app
      - telegram web app
      - сайт
      - веб-страниц
      - веб-интерфейс
      - веб интерфейс
      - админка
      - админку
      - админ-панель
      - личный кабинет
      - личного кабинета
      - лендинг
      - отдельное веб-приложение
      - модуль frontend
      - публичный https
      - https-адрес
      - сертификат tls
      - свой домен
      - собственный домен
      - публичный домен
      - мини-приложение telegram
      - мини-приложение в telegram
      - мини-приложение в телеграм
    name: A website or web pages
    plain: >-
      The bot has no website, web pages, admin panel or domain of its own, and cannot open
      a mini app inside Telegram.
    why: The product lives entirely inside the Telegram chat.
    workaround: Everything happens in the chat with buttons.
    technical: >-
      Only backend `http://{server_ip}:{port}` is public; compose has no TLS proxy or domain
      allocation/verification. `PUBLIC_BASE_URL` is that HTTP address (IPv6 bracketed), for self
      links only. Mini Apps require https. Only `backend` and `tg_bot` are requestable;
      `frontend` is historical. No frontend, TLS or webhook availability.
  - id: inbound_webhooks
    detect:
      - inbound webhook
      - incoming webhook
      - receive webhooks
      - webhook url
      - callback url
      - входящий вебхук
      - входящие вебхуки
      - входящий webhook
      - принимать вебхуки
      - заявки с формы
      - заявки с форм
    name: Receiving events other services send
    plain: >-
      The bot cannot receive events that other services send to it by themselves, such as GitHub
      notifications or form submissions.
    why: Other services have nowhere to send such events to.
    workaround: The bot checks the service itself from time to time, if the service allows that.
    technical: >-
      Providers require https; `PUBLIC_BASE_URL` is plain HTTP on an IP/port that can change
      on relocation. Poll provider APIs from a timer; the Telegram bot uses long polling.
  - id: payments
    # A bare word ("payment", "оплата", "платёж") is a weak term: an expense tracker records
    # payments without accepting any, so it trips unless the requirement is about recording.
    detect:
      - accept payment
      - accept payments
      - accepting payments
      - take payments
      - payment gateway
      - payment provider
      - telegram payments
      - telegram stars
      - stripe
      - yookassa
      - принимать оплату
      - принимать платежи
      - приём оплаты
      - прием оплаты
      - приём платежей
      - прием платежей
      - платёжная система
      - платежная система
      - юkassa
      - юкасса
      - юкассу
    detect_weak: [payment, оплата, оплату, платёж, платежи]
    weak_unless: [record, track, expense, budget, spent, учёт, учитыва, записыва, расход, трат, бюджет, отмеча]
    name: Accepting payments
    plain: >-
      The bot cannot take payments: neither through payment services such as YooKassa or Stripe
      nor inside Telegram (Stars, Payments).
    why: Payment acceptance is not part of what the platform builds.
    workaround:
    technical: >-
      No kit module or package handles payments, and a payment provider's confirmation arrives
      as an inbound webhook on an https URL, which a product does not have.
  - id: oauth_web_redirect
    # Only the redirect or the web sign-in itself: a device-code or desktop OAuth flow is the
    # workaround. A term joined by " + " trips when every part is present.
    detect: [oauth redirect, oauth web, google oauth, redirect uri, sign in with google, log in with google, login with google, авторизация через google, авторизацией через google, авторизацию через google, вход через google, войти с google, войти через google]
    name: Signing in with Google and the like
    plain: The bot cannot use "Sign in with Google" or similar sign-in buttons to reach a user's account.
    why: Such sign-in needs a web page for the user to return to, which the bot does not have.
    workaround: >-
      The user shares their spreadsheet or calendar with the bot's Google service account, or
      pastes a personal token.
    technical: >-
      OAuth web redirects need stable-domain https. Use a shared Google service account,
      provider-supported device-code/desktop flow, or a personal API token as a user secret.
  - id: send_email
    detect: [send email, sends email, sending email, send an email, send e-mail, email notification, email newsletter, smtp, mail server, отправлять письма, отправляет письма, отправка писем, отправлять email, рассылка на почту, рассылку на почту, уведомления на почту, уведомления по email, письмо на почту]
    name: Sending email by itself
    plain: The bot cannot send email by itself.
    why: The bot has no mail service of its own.
    workaround: Send through an email service with a key the user provides, or send the message in Telegram.
    technical: >-
      No kit mail module or platform mail server/SMTP relay. Third-party email APIs use
      ordinary outbound calls with a `user_secret` key.
  - id: file_storage
    detect:
      - file storage
      - store uploaded files
      - store uploads
      - uploaded files
      - upload files
      - file upload
      - persistent files
      - files on disk
      - photos on the server
      - хранение файлов
      - файловое хранилище
      - хранилище файлов
      - хранить загруженные файлы
      - хранить файлы на сервере
      - файлы на диске
      - файлы на сервере
      - фото на сервере
      - документы на сервере
      - загрузка файлов
      - загружать файлы
    detect_weak: [upload]
    weak_unless: [file id, file_id]
    name: Keeping uploaded files
    plain: The bot does not keep uploaded files itself.
    why: The bot remembers data, not files.
    workaround: >-
      Photos and documents stay in Telegram and the bot remembers them; large files go to an
      external storage service with a key the user provides.
    technical: >-
      Only Postgres `db_data` persists; backend/bot have no volumes and are replaced on deploy.
      No object-storage module. Keep Telegram file ids; small files may go in the database.
  - id: external_database_access
    detect: [external database access, direct database access, public postgres, внешний доступ к базе, прямой доступ к базе, публичный postgres]
    name: Direct access to the bot's data store
    plain: Nobody can connect to the bot's data store directly.
    why: The data is reachable only through the bot.
    workaround: The bot hands out the data needed through a command, such as an export or a report.
    technical: >-
      Postgres/Redis host ports are allocated but unpublished; compose/firewall expose only
      backend. Expose data through bot commands or backend endpoints.
  - id: backups
    detect: [backup, backups, data recovery, бэкап, резервная копия, резервные копии, резервное копирование, резервную копию]
    name: Backups of the data
    plain: There are no backups of the bot's data; if the server is lost, the bot's data is lost with it.
    why: The platform makes no copies of the bot's data.
    workaround:
    technical: >-
      Nothing snapshots or copies the `db_data` volume; it lives only on the product's server.

kit:
  modules:
    - name: backend
      plain: FastAPI web API with PostgreSQL and Redis, always part of a product.
    - name: tg_bot
      plain: Telegram bot on long polling that talks to the backend.
  core:
    - name: users
      plain: Per-user access for the bot; the platform grants and revokes Telegram users.
    - name: settings v1
      plain: Declared product or per-user settings the platform writes and the product reads.
    - name: jobs v1
      plain: Declared named jobs a caller or the core timer fires; records and dispatches them.
    - name: caller identity v1
      plain: >-
        Package routes serve only the caller verified by `X-Identity-Capability`
        (`USER_IDENTITY_CAPABILITY`), `X-User-Channel`, `X-User-External-Id`; `user_ref` is
        `<channel>:<external_id>`.
    - name: events v1
      plain: Durable product events on Redis Streams, each handled once per consuming service.
  # Packages are not listed here: the Architect reads them live from the kit's catalog at
  # planning time (services/langgraph/src/kit_catalog.py), so a package release needs no
  # change to this manifest or to the orchestrator.
  catalog: >-
    the kit's `packages/catalog.yaml` lists each package's name, capabilities and settings;
    it is read live from the kit's default branch at planning time and the planning
    instructions list admitted packages, libraries, recommendations and default bindings;
    explicit selection uses plan_install and scaffolder mode=install; a new package
    release needs no orchestrator change.

deploy_targets:
  - service: backend
    requestable: true
    http_health: true
    exposure: public, http://<server IP>:<port>; the one published port and health check
  - service: tg_bot
    requestable: true
    http_health: false
    exposure: none; allocated a port but publishes nothing, reaches Telegram outbound
  - service: postgres
    requestable: false
    http_health: false
    exposure: internal only, `db:5432`; allocated a host port that production does not publish
  - service: redis
    requestable: false
    http_health: false
    exposure: internal only, `redis:6379`; allocated a host port that production does not publish
  - service: notifications
    requestable: false
    http_health: false
    exposure: not deployable for new products; kept only so old project records still read
  - service: frontend
    requestable: false
    http_health: false
    exposure: not deployable for new products; kept only so old project records still read

secret_kinds:
  - source: user_secret
    plain: A key or token the user supplies, such as a bot token or an API key; the PO asks for it.
  - source: generated_secret
    plain: A secret the platform generates once and keeps, such as the database password.
  - source: allocation
    plain: A port the platform reserves for the product on its server.
  - source: derived
    plain: A value the platform computes at deploy time; only the keys listed below exist.
  - source: literal
    plain: A fixed, non-secret value written in the product's own environment contract.
  - source: platform_key
    plain: A platform service key issued and persisted by the platform at deploy time; the user is never asked for it.
  - source: platform_base_url
    plain: The service URL declared in the product's environment contract, resolved at deploy time.

derived_keys:
  - key: APP_ENV
    value: production
  - key: ENVIRONMENT
    value: production
  - key: DEBUG
    value: "false"
  - key: POSTGRES_HOST
    value: db
  - key: POSTGRES_PORT
    value: "5432"
  - key: POSTGRES_REQUIRE_SSL
    value: "false"
  - key: BACKEND_API_URL
    value: http://backend:8000
  - key: API_URL
    value: http://backend:8000
  - key: API_BASE_URL
    value: http://backend:8000
  - key: BACKEND_URL
    value: http://backend:8000
  - key: APP_NAME
    value: the project's runtime slug
  - key: PROJECT_NAME
    value: the project's runtime slug
  - key: COMPOSE_PROJECT_NAME
    value: the project's runtime slug
  - key: POSTGRES_DB
    value: db_<project id>
  - key: ENABLED_MODULES
    value: the project's modules, comma-separated
  - key: PUBLIC_BASE_URL
    value: the single allocated backend's HTTP address and port, with bracketed IPv6
  - key: BACKEND_PORT
    value: the backend's allocated port
  - key: FRONTEND_PORT
    value: the frontend's allocated port
  - key: TG_BOT_PORT
    value: the bot's allocated port
  - key: POSTGRES_HOST_PORT
    value: the postgres allocated host port
  - key: REDIS_HOST_PORT
    value: the redis allocated host port
  - key: "*_IMAGE"
    value: the registry image of that service at the deployed commit

# Derived keys the pinned kit declares for production that the resolver does not compute. Each
# is optional in the kit, so a deploy skips it instead of failing.
kit_derived_keys_not_resolved:
  - key: PORT
    note: optional backend key; the backend listens on its own default, 8000
